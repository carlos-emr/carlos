name: BC billing checkpoint diagnostics
on:
  pull_request:
    branches: ['release/2026.08']
permissions:
  actions: read
  contents: read
jobs:
  checkpoint:
    if: github.event.pull_request.number == 6097
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Summarize existing checkpoint evidence
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import io, json, os, urllib.request, zipfile, xml.etree.ElementTree as ET
          class DownloadRedirect(urllib.request.HTTPRedirectHandler):
              def redirect_request(self, request, fp, code, message, headers, new_url):
                  redirected = super().redirect_request(request, fp, code, message, headers, new_url)
                  redirected.remove_header('Authorization')
                  return redirected
          opener = urllib.request.build_opener(DownloadRedirect())
          for artifact in (13648015904, 13648185072):
              request = urllib.request.Request(
                  f'https://api.github.com/repos/carlos-emr/carlos/actions/artifacts/{artifact}/zip',
                  headers={'Authorization': 'Bearer ' + os.environ['GH_TOKEN'], 'Accept': 'application/vnd.github+json'})
              with opener.open(request, timeout=60) as response:
                  archive = zipfile.ZipFile(io.BytesIO(response.read()))
              for name in archive.namelist():
                  if artifact == 13648015904 and name.endswith('.json'):
                      data = json.loads(archive.read(name))
                      print(name, json.dumps(data, ensure_ascii=True))
                  elif artifact == 13648185072 and name.endswith('.xml'):
                      root = ET.fromstring(archive.read(name))
                      for case in root.iter('testcase'):
                          for failure in list(case):
                              if failure.tag in ('failure', 'error'):
                                  print(json.dumps({'class': case.get('classname'), 'case': case.get('name'),
                                      'message': failure.get('message', '')[:2000], 'detail': (failure.text or '')[:2000]}))
          PY
