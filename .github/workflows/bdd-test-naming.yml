# GitHub Workflow: BDD Test Naming
#
# Description:
# Validates that billing migration tests use the project BDD method-name
# convention: should<Action>_<prepositionOrContext><Condition>.
#
# License:
# This GitHub Workflow file is part of the Carlos EMR project and is subject
# to the licensing terms outlined in the repository's LICENSE file.

name: BDD Test Naming

on:
  pull_request:
    branches:
      - main
      - develop
      - experimental
      - staging/*
      - hotfix/*
      - release/*
      - community/*/develop
      - community/*/staging/*
    paths:
      - 'src/test/java/**/*.java'
      - 'scripts/lint/check-bdd-test-naming.py'
      - 'scripts/lint/check-bdd-test-naming.sh'
      - '.github/workflows/bdd-test-naming.yml'
      - 'CLAUDE.md'
      - 'docs/test/**'
  push:
    branches:
      - develop
      - release/*
    paths:
      - 'src/test/java/**/*.java'
      - 'scripts/lint/check-bdd-test-naming.py'
      - 'scripts/lint/check-bdd-test-naming.sh'
      - '.github/workflows/bdd-test-naming.yml'
      - 'CLAUDE.md'
      - 'docs/test/**'
  workflow_dispatch: {}

# Superseded pushes to the same PR cancel the in-progress run; every other
# event (push to a protected branch, schedule, dispatch) gets a unique group
# via run_id and is never queued behind or cancelled by another run. The final
# head of a PR always gets its own complete run, so no check outcome changes.
concurrency:
  group: bdd-test-naming-${{ github.event_name == 'pull_request' && github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  bdd-test-naming:
    name: BDD Test Naming
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: false

      - name: Validate billing test method names
        run: scripts/lint/check-bdd-test-naming.sh
