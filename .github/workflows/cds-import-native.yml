name: CDS import native contracts

on:
  pull_request:
    branches: [main, develop, experimental, 'release/*', 'staging/*', 'hotfix/*']
    paths:
      # Shared clinical models, DAOs and guarded datasources participate in these contracts.
      - 'src/main/java/**'
      - 'src/main/resources/cds-import/**'
      - 'src/test/java/**/cdsimport/**'
      - 'src/test/resources/demographic/cds-import-*.xml'
      - 'database/mysql/migration/**'
      - 'scripts/ci/*cds*'
      - 'scripts/ci/CdsImportMariaDbBootstrap.java'
      - 'scripts/ci/requirements.txt'
      - 'scripts/ci/test_run_cds_native_tier.py'
      - 'pom.xml'
      - '.github/workflows/cds-import-native.yml'
  workflow_dispatch:

concurrency:
  group: cds-import-native-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read
  packages: read

jobs:
  native-contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout candidate
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - name: Start Java 25 build container
        uses: ./.github/actions/dev-container
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          maven-cache: restore
      - name: Compile actual application and tests
        run: docker exec carlos-tomcat-dev mvn -B -DskipTests test-compile
      - name: Verify bounded XML imports in fresh 64 MiB JVMs
        run: >-
          docker exec carlos-tomcat-dev mvn -B
          -Dtest=CdsXmlParserLargeInputUnitTest -Dgroups=performance
          -Dtest.forkCount=1 test
      - name: Prepare harness workspace ownership
        run: sudo chown -R "$(id -u):$(id -g)" target
      - name: Install hash-pinned native harness dependencies
        run: |
          python3 -m venv "$RUNNER_TEMP/cds-native-venv"
          "$RUNNER_TEMP/cds-native-venv/bin/python" -m pip install \
            --disable-pip-version-check --require-hashes -r scripts/ci/requirements.txt
          echo "$RUNNER_TEMP/cds-native-venv/bin" >> "$GITHUB_PATH"
      - name: Verify native harness fail-closed behavior
        run: python3 -m unittest discover -s scripts/ci -p test_run_cds_native_tier.py -v
      - name: Run non-skipping physical database contracts
        run: python3 scripts/ci/run-cds-native-tier.py
      - name: Preserve sanitized native contract reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: cds-native-contract-reports
          path: target/cds-native-*/reports/TEST-*.xml
          if-no-files-found: warn
          retention-days: 7
