# Task-scoped diagnostic branch. It cannot run on the application branches.
name: Refresh CDS external quality check
on:
  push:
    branches: ['codex/cds-quality-refresh-a42feca0']
permissions:
  checks: write
jobs:
  refresh:
    if: github.ref == 'refs/heads/codex/cds-quality-refresh-a42feca0'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Request the original CodeFactor app to recheck the exact PR head
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import json, os
          from urllib.request import Request, urlopen
          from urllib.error import HTTPError
          repo = "carlos-emr/carlos"
          head = "ce2aa735d2f3fb84045cdd69dbcec88e8ce2eb31"
          token = os.environ["GITHUB_TOKEN"]
          headers = {"Authorization": "Bearer " + token, "Accept": "application/vnd.github+json",
                     "X-GitHub-Api-Version": "2022-11-28"}
          def request(path, *, post=False):
              req = Request("https://api.github.com/repos/" + repo + path, headers=headers,
                            data=b"{}" if post else None, method="POST" if post else "GET")
              try:
                  with urlopen(req, timeout=30) as response:
                      body = response.read(2 * 1024 * 1024 + 1)
              except HTTPError as failure:
                  raw = failure.read(4097)
                  try:
                      details = json.loads(raw) if len(raw) <= 4096 else {}
                  except (ValueError, UnicodeDecodeError):
                      details = {}
                  message = details.get("message", "") if isinstance(details, dict) else ""
                  if not isinstance(message, str):
                      message = ""
                  message = message.replace(token, "[REDACTED]").replace("\\n", " ")[:240]
                  print(json.dumps({"httpStatus": failure.code, "message": message,
                                    "rateRemaining": failure.headers.get("X-RateLimit-Remaining", ""),
                                    "rateReset": failure.headers.get("X-RateLimit-Reset", "")}), flush=True)
                  raise RuntimeError("External check refresh refused: HTTP " + str(failure.code)) from None
              if len(body) > 2 * 1024 * 1024:
                  raise RuntimeError("External check response exceeded bound")
              return json.loads(body) if body.strip() else {}
          checks = request("/commits/" + head + "/check-runs?check_name=CodeFactor&filter=latest&per_page=100")
          matches = [check for check in checks.get("check_runs", []) if check.get("name") == "CodeFactor"
                     and check.get("head_sha") == head and check.get("app", {}).get("slug") == "codefactor-io"]
          if len(matches) != 1 or type(matches[0].get("id")) is not int:
              raise RuntimeError("One exact-head original-app CodeFactor check is required")
          check = matches[0]
          suite = check.get("check_suite", {}).get("id")
          if type(suite) is not int:
              raise RuntimeError("Original-app check suite identity is required")
          details = request("/check-suites/" + str(suite))
          if details.get("head_sha") != head or details.get("app", {}).get("slug") != "codefactor-io":
              raise RuntimeError("Original-app suite and exact head must match")
          request("/check-suites/" + str(suite) + "/rerequest", post=True)
          print(json.dumps({"requested": True, "headSha": head, "checkSuiteId": suite, "creator": "codefactor-io"}))
          PY
