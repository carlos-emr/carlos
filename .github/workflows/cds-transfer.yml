name: CDS coordinated import and export

on:
  pull_request:
    branches: [main, develop, experimental, 'release/*', 'staging/*', 'hotfix/*']
    paths:
      - 'src/main/java/**'
      - 'src/main/resources/**'
      - 'src/test/java/**'
      - 'src/test/resources/**'
      - 'database/mysql/migration/**'
      - 'scripts/ci/*cds*'
      - 'scripts/ci/CdsReleaseUpgradeProof.java'
      - 'debian/assets/flyway-runner/**'
      - 'debian/build-flyway-runner.sh'
      - 'scripts/schema-contract.py'
      - 'scripts/verify-cds-export-source-catalogue.py'
      - 'pom.xml'
      - '.github/actions/dev-container/**'
      - '.github/workflows/cds-transfer.yml'
      - 'scripts/ci/**'
      - 'database/mysql/schema-contract/**'
  push:
    # A release head must still export after independently green pull requests merge.
    branches: [main, 'release/**']
    paths:
      - 'src/main/java/**'
      - 'src/main/resources/**'
      - 'src/test/java/**'
      - 'src/test/resources/**'
      - 'database/mysql/migration/**'
      - 'scripts/ci/*cds*'
      - 'scripts/ci/CdsReleaseUpgradeProof.java'
      - 'debian/assets/flyway-runner/**'
      - 'debian/build-flyway-runner.sh'
      - 'scripts/schema-contract.py'
      - 'scripts/verify-cds-export-source-catalogue.py'
      - 'pom.xml'
      - '.github/actions/dev-container/**'
      - '.github/workflows/cds-transfer.yml'
      - 'scripts/ci/**'
      - 'database/mysql/schema-contract/**'
  workflow_dispatch:

concurrency:
  group: cds-transfer-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read
  packages: read

jobs:
  coordinated-contracts:
    name: CDS transfer / ${{ matrix.shard }}
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        shard: [import, export, shared]
    steps:
      - name: Checkout candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Start Java 25 build container
        uses: ./.github/actions/dev-container
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          maven-cache: restore
      - name: Verify source catalogue and compile application and tests once
        run: |
          python3 scripts/verify-cds-export-source-catalogue.py
          docker exec carlos-tomcat-dev mvn -B -DskipTests test-compile
      - name: Verify canonical web DAO and Struts action wiring
        if: matrix.shard == 'export'
        run: docker exec carlos-tomcat-dev mvn -B -Dtest=CdsExportLegacyDaoWiringUnitTest,CdsTransferConstructorInjectionUnitTest,CdsTransferInjectionRegressionTest surefire:test
      - name: Prepare harness workspace ownership
        run: sudo chown -R "$(id -u):$(id -g)" target
      - name: Install hash-pinned harness dependencies
        run: |
          python3 -m venv "$RUNNER_TEMP/cds-transfer-venv"
          "$RUNNER_TEMP/cds-transfer-venv/bin/python" -m pip install \
            --disable-pip-version-check --require-hashes -r scripts/ci/requirements.txt
          echo "$RUNNER_TEMP/cds-transfer-venv/bin" >> "$GITHUB_PATH"
      - name: Verify inventory partition and non-skipping evidence checks
        run: python3 -m unittest discover -s scripts/ci -p test_run_cds_native_tier.py -v
      - name: Run the reviewed shard against newly migrated owned databases
        run: python3 scripts/ci/run-cds-native-tier.py --coordinated-shard '${{ matrix.shard }}'
      - name: Preserve sanitized contract reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: cds-transfer-${{ matrix.shard }}-reports
          path: target/cds-native-*/reports/TEST-*.xml
          if-no-files-found: warn
          retention-days: 7

  compatibility-contracts:
    name: CDS compatibility / ${{ matrix.profile }}
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        profile: [case-folded-catalogue, release-upgrade]
    steps:
      - name: Checkout candidate and the actual release upgrade baseline
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Start Java 25 build container
        uses: ./.github/actions/dev-container
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          maven-cache: restore
      - name: Compile actual application and tests
        run: docker exec carlos-tomcat-dev mvn -B -DskipTests test-compile
      - name: Prepare harness workspace ownership
        run: sudo chown -R "$(id -u):$(id -g)" target
      - name: Install hash-pinned harness dependencies
        run: |
          python3 -m venv "$RUNNER_TEMP/cds-compatibility-venv"
          "$RUNNER_TEMP/cds-compatibility-venv/bin/python" -m pip install \
            --disable-pip-version-check --require-hashes -r scripts/ci/requirements.txt
          echo "$RUNNER_TEMP/cds-compatibility-venv/bin" >> "$GITHUB_PATH"
      - name: Verify catalogue under actual case-folded MariaDB identifiers
        if: matrix.profile == 'case-folded-catalogue'
        run: python3 scripts/ci/run-cds-native-tier.py --catalogue-case-folded
      - name: Upgrade both provinces from release/2026.08 with retained clinical data
        if: matrix.profile == 'release-upgrade'
        run: python3 scripts/ci/run-cds-native-tier.py --release-upgrade
      - name: Preserve sanitized compatibility evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: cds-compatibility-${{ matrix.profile }}-reports
          path: |
            target/cds-native-*/reports/TEST-*.xml
            target/cds-native-*/upgrade-*.json
            target/cds-native-*/schema-*.json
          if-no-files-found: error
          retention-days: 7
