# GitHub Workflow: Development Container Images
#
# Description:
# This workflow manages development container images for CARLOS EMR.
# It builds, tests, and pushes container images to GitHub Container Registry (ghcr.io)
# that are used by both CI workflows and local development environments.
#
# The maven-project.yml workflow will attempt to pull these pre-built images first,
# falling back to local builds if images are not available. This significantly speeds
# up both CI/CD pipelines and developer onboarding.
#
# Containers Managed:
# - carlos-tomcat-ci: Minimal trusted CI container with Java 21, Tomcat, Maven, Node.js
# - carlos-tomcat-dev: Development container extending carlos-tomcat-ci with interactive tools
# - carlos-mariadb-dev: MariaDB database container with schema initialization scripts
# - carlos-drugref: DrugRef2 service container with Java 11
#
# Freshness Check Strategy:
# 1. Calculate SHA256 hash of Dockerfile + build context for each container
# 2. Check if the branch-scoped ghcr.io cache image exists with matching hash label
# 3. If hash matches: skip build (image is up-to-date)
# 4. If hash differs or image missing: build, test, and push new image
#
# This ensures containers are only rebuilt when their source files actually change,
# not on every commit, saving CI/CD minutes and reducing wait times.
#
# Triggers:
# - Push to main/develop/experimental branches
# - Pull requests to main/develop/experimental branches
# - Manual dispatch for forced rebuilds (with force_rebuild option)
#
# License:
# This GitHub Workflow file is part of the Carlos EMR project and is subject
# to the licensing terms outlined in the repository's LICENSE file.

name: Development Container Images

on:
  push:
    branches:
      - main
      - develop
      - experimental
      - staging/*
      - hotfix/*
  pull_request:
    branches:
      - main
      - develop
      - experimental
      - staging/*
      - hotfix/*
  workflow_dispatch:
    inputs:
      force_rebuild:
        description: 'Force rebuild all containers (ignore cache)'
        required: false
        default: 'false'
        type: boolean

env:
  REGISTRY: ghcr.io
  # Images will be: ghcr.io/carlos-emr/carlos-tomcat-dev, etc.
  IMAGE_PREFIX: ${{ github.repository_owner }}

concurrency:
  group: container-images-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ===========================================================================
  # Check which containers need rebuilding
  # ===========================================================================
  check-containers:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
      attestations: read
    outputs:
      tomcat_needs_build: ${{ steps.check.outputs.tomcat_needs_build }}
      tomcat_hash: ${{ steps.check.outputs.tomcat_hash }}
      mariadb_needs_build: ${{ steps.check.outputs.mariadb_needs_build }}
      mariadb_hash: ${{ steps.check.outputs.mariadb_hash }}
      drugref_needs_build: ${{ steps.check.outputs.drugref_needs_build }}
      drugref_hash: ${{ steps.check.outputs.drugref_hash }}
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Log in to Container Registry
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Check container freshness
        id: check
        env:
          FORCE_REBUILD: ${{ inputs.force_rebuild }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REGISTRY: ${{ env.REGISTRY }}
          IMAGE_PREFIX: ${{ env.IMAGE_PREFIX }}
        run: |
          check_container() {
            local name=$1
            local output_name=$2
            local context_path=$3
            local extra_context=$4

            echo "========================================="
            echo "Checking container: $name"
            echo "========================================="

            # Calculate hash from every file in the Docker build inputs, not just selected
            # extensions. Dockerfile COPY sources include extensionless scripts, .properties, .xml,
            # .jsp, and .ico files; filtering by suffix can leave stale images in the registry.
            # Note: extra_context is expected to be a space-separated list of paths. Paths
            # containing spaces are not supported here.
            local hash_paths=("$context_path")
            if [ -n "$extra_context" ]; then
              # Intentionally rely on word splitting to support multiple paths.
              local extra_context_array=($extra_context)
              hash_paths+=("${extra_context_array[@]}")
            fi
            HASH=$(find "${hash_paths[@]}" \
              -path '*/db_data/*' -prune -o \
              -type f -exec sha256sum {} \; 2>/dev/null | sort | sha256sum | cut -d' ' -f1)
            echo "Content hash: $HASH"
            echo "${output_name}_hash=$HASH" >> "$GITHUB_OUTPUT"

            # Check if force rebuild is requested
            if [ "$FORCE_REBUILD" == "true" ]; then
              echo "Force rebuild requested"
              echo "${output_name}_needs_build=true" >> "$GITHUB_OUTPUT"
              return
            fi

            # A mutable branch tag and a matching label are not sufficient evidence. Resolve the
            # content-addressed tag, bind verification to the exact pulled digest, and accept it
            # only when it was produced by this repository's container publishing workflow.
            IMAGE_REPOSITORY="${REGISTRY}/${IMAGE_PREFIX}/carlos-${name}"
            IMAGE="${IMAGE_REPOSITORY}:content-${HASH}"
            echo "Checking image: $IMAGE"

            EXISTING_HASH=""
            if docker pull "$IMAGE" 2>/dev/null; then
              if ! EXISTING_HASH=$(docker inspect "$IMAGE" --format '{{ index .Config.Labels "org.openosp.content-hash" }}' 2>/dev/null); then
                echo "Warning: failed to inspect existing image labels for $IMAGE; will treat as missing hash and rebuild if needed" >&2
                EXISTING_HASH=""
              fi

              IMAGE_DIGEST=$(docker inspect "$IMAGE" --format '{{ index .RepoDigests 0 }}' 2>/dev/null || true)
              if [[ "$IMAGE_DIGEST" =~ @sha256:[0-9a-f]{64}$ ]] && \
                 [ "${IMAGE_DIGEST%@*}" = "$IMAGE_REPOSITORY" ] && \
                 [ "$HASH" = "$EXISTING_HASH" ] && \
                 gh attestation verify "oci://${IMAGE_DIGEST}" \
                   --repo "${{ github.repository }}" \
                   --signer-workflow "${{ github.repository }}/.github/workflows/container-images.yml"; then
                echo "Verified attested content image; skipping build"
                echo "${output_name}_needs_build=false" >> "$GITHUB_OUTPUT"
                return
              fi

              echo "Existing image did not pass content and provenance verification" >&2
            fi

            echo "Existing hash: ${EXISTING_HASH:-<none>}"
            echo "Container needs rebuild"
            echo "${output_name}_needs_build=true" >> "$GITHUB_OUTPUT"
          }

          # Check each container (name, output_name, context_path, extra_context)
          check_container "tomcat-ci" "tomcat" ".devcontainer/development" ""
          check_container "mariadb-dev" "mariadb" ".devcontainer/db" "database .devcontainer/development/config/shared/my.cnf"
          check_container "drugref" "drugref" ".devcontainer/drugref" ""

  # ===========================================================================
  # Build and push tomcat-dev container
  # ===========================================================================
  build-tomcat:
    needs: check-containers
    if: needs.check-containers.outputs.tomcat_needs_build == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f

      - name: Build tomcat CI and development containers
        env:
          CONTENT_HASH: ${{ needs.check-containers.outputs.tomcat_hash }}
        run: |
          echo "Building minimal carlos-tomcat-ci container..."
          docker buildx build \
            --load \
            --target ci \
            -t carlos-tomcat-ci:test \
            --label "org.openosp.content-hash=$CONTENT_HASH" \
            --label "org.opencontainers.image.source=https://github.com/${{ github.repository }}" \
            --label "org.opencontainers.image.revision=${{ github.sha }}" \
            .devcontainer/development

          echo "Building developer-tool extension..."
          docker buildx build \
            --load \
            --target development \
            -t carlos-tomcat-dev:test \
            --label "org.openosp.content-hash=$CONTENT_HASH" \
            --label "org.opencontainers.image.source=https://github.com/${{ github.repository }}" \
            --label "org.opencontainers.image.revision=${{ github.sha }}" \
            .devcontainer/development

      - name: Test tomcat CI and development containers
        run: |
          echo "Testing CI container starts correctly..."
          docker run -d --name test-tomcat-ci carlos-tomcat-ci:test tail -f /dev/null
          sleep 5

          docker exec test-tomcat-ci mvn --version
          docker exec test-tomcat-ci java --version
          docker exec test-tomcat-ci node --version
          docker exec test-tomcat-ci test -d /usr/local/tomcat
          if docker exec test-tomcat-ci sh -c 'command -v gh || command -v javadoc2md || command -v docusaurus || command -v claude || command -v gemini || command -v copilot || command -v codex || command -v aider'; then
            echo "Developer-only tooling leaked into the CI image" >&2
            exit 1
          fi
          docker stop test-tomcat-ci && docker rm test-tomcat-ci

          echo "Testing developer extension..."
          docker run --rm carlos-tomcat-dev:test sh -c \
            'gh --version && javadoc2md --help && docusaurus --version && claude --version && gemini --version && copilot --version && codex --version && aider --version'

      - name: Save tested tomcat images
        run: |
          echo "Reclaiming Docker Buildx cache before exporting tested image..."
          docker buildx prune -af || true
          docker system df || true
          mkdir -p "$RUNNER_TEMP/container-images"
          docker save carlos-tomcat-ci:test -o "$RUNNER_TEMP/container-images/carlos-tomcat-ci.tar"
          docker save carlos-tomcat-dev:test -o "$RUNNER_TEMP/container-images/carlos-tomcat-dev.tar"

      - name: Upload tested tomcat images
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: carlos-tomcat-images
          path: ${{ runner.temp }}/container-images/carlos-tomcat-*.tar
          retention-days: 1

  publish-tomcat:
    needs: [check-containers, build-tomcat]
    if: needs.check-containers.outputs.tomcat_needs_build == 'true' && needs.build-tomcat.result == 'success' && (github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && github.event.inputs.force_rebuild == 'true'))
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    steps:
      - name: Download tested tomcat images
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: carlos-tomcat-images
          path: ${{ runner.temp }}/container-images

      - name: Log in to Container Registry
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push tested tomcat containers
        id: push-tomcat
        env:
          CI_IMAGE: ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/carlos-tomcat-ci
          DEV_IMAGE: ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/carlos-tomcat-dev
          CONTENT_HASH: ${{ needs.check-containers.outputs.tomcat_hash }}
          CACHE_REF_NAME: ${{ github.base_ref || github.ref_name }}
          SHOULD_PUSH_LATEST: ${{ github.ref_name == 'develop' }}
        run: |
          cache_tag() {
            local ref_name=$1
            local safe_ref

            safe_ref=$(printf '%s' "$ref_name" \
              | tr '[:upper:]/' '[:lower:]-' \
              | sed -E 's/[^a-z0-9_.-]+/-/g; s/^-+//; s/-+$//; s/^$/branch/' \
              | cut -c1-120)
            printf '%s-latest' "$safe_ref"
          }

          push_image() {
            local local_image=$1
            local image=$2
            local output_name=$3
            local cache_tag_value=$4
            local content_tag="content-${CONTENT_HASH}"

            docker tag "$local_image" "$image:${{ github.sha }}"
            docker tag "$local_image" "$image:$cache_tag_value"
            docker tag "$local_image" "$image:$content_tag"

            docker push "$image:$cache_tag_value"
            docker push "$image:${{ github.sha }}"
            push_output=$(docker push "$image:$content_tag")
            printf '%s\n' "$push_output"
            digest=$(printf '%s\n' "$push_output" \
              | sed -nE 's/^.*digest: (sha256:[0-9a-f]{64}).*$/\1/p' \
              | tail -1)
            if [ -z "$digest" ]; then
              echo "Unable to resolve pushed digest for $image:$content_tag" >&2
              exit 1
            fi

            if [ "$SHOULD_PUSH_LATEST" = "true" ]; then
              docker tag "$local_image" "$image:latest"
              docker push "$image:latest"
            fi

            echo "${output_name}_name=$image" >> "$GITHUB_OUTPUT"
            echo "${output_name}_digest=$digest" >> "$GITHUB_OUTPUT"
          }

          docker load -i "$RUNNER_TEMP/container-images/carlos-tomcat-ci.tar"
          docker load -i "$RUNNER_TEMP/container-images/carlos-tomcat-dev.tar"
          CACHE_TAG=$(cache_tag "$CACHE_REF_NAME")
          push_image carlos-tomcat-ci:test "$CI_IMAGE" ci "$CACHE_TAG"
          push_image carlos-tomcat-dev:test "$DEV_IMAGE" dev "$CACHE_TAG"

      - name: Attest tomcat CI image provenance
        uses: actions/attest-build-provenance@0f67c3f4856b2e3261c31976d6725780e5e4c373 # v4.1.1
        with:
          subject-name: ${{ steps.push-tomcat.outputs.ci_name }}
          subject-digest: ${{ steps.push-tomcat.outputs.ci_digest }}
          push-to-registry: true

      - name: Attest tomcat development image provenance
        uses: actions/attest-build-provenance@0f67c3f4856b2e3261c31976d6725780e5e4c373 # v4.1.1
        with:
          subject-name: ${{ steps.push-tomcat.outputs.dev_name }}
          subject-digest: ${{ steps.push-tomcat.outputs.dev_digest }}
          push-to-registry: true

  # ===========================================================================
  # Build and push mariadb-dev container
  # ===========================================================================
  build-mariadb:
    needs: check-containers
    if: needs.check-containers.outputs.mariadb_needs_build == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f

      - name: Build mariadb-dev container
        env:
          CONTENT_HASH: ${{ needs.check-containers.outputs.mariadb_hash }}
        run: |
          echo "Building carlos-mariadb-dev container..."
          docker buildx build \
            --load \
            -t carlos-mariadb-dev:test \
            --label "org.openosp.content-hash=$CONTENT_HASH" \
            --label "org.opencontainers.image.source=https://github.com/${{ github.repository }}" \
            --label "org.opencontainers.image.revision=${{ github.sha }}" \
            -f .devcontainer/db/Dockerfile .

      - name: Test mariadb-dev container
        run: |
          echo "Testing container starts correctly..."
          docker run -d --name test-mariadb \
            -e MARIADB_ROOT_PASSWORD=testpassword \
            carlos-mariadb-dev:test

          echo "Waiting for MariaDB to start..."
          ready=false
          for i in {1..30}; do
            if docker exec test-mariadb mariadb-admin ping -h localhost -u root -ptestpassword 2>/dev/null; then
              echo "MariaDB is ready!"
              ready=true
              break
            fi
            echo "Waiting... ($i/30)"
            sleep 2
          done

          if [ "$ready" != "true" ]; then
            echo "ERROR: MariaDB failed to start within timeout"
            docker logs test-mariadb
            docker stop test-mariadb && docker rm test-mariadb
            exit 1
          fi

          echo "Verifying MariaDB version..."
          docker exec test-mariadb mariadb --version

          echo "Verifying database scripts are present..."
          docker exec test-mariadb ls -la /database/mysql/

          echo "Waiting for database initialization to complete..."
          initialized=false
          for i in {1..90}; do
            # Check container logs for the exact completion message from populate_db.sh: "Database initialization complete!"
            if docker logs test-mariadb 2>&1 | grep -q "Database initialization complete!"; then
              # Verify database state to avoid false positives from reused logs
              provider_count=$(docker exec test-mariadb mariadb -N -u root -ptestpassword -e "SELECT COUNT(*) FROM oscar.provider;" 2>/dev/null || echo 0)
              if [ "$provider_count" -gt 0 ]; then
                echo "Database initialization complete and provider table populated (count=$provider_count)."
                initialized=true
                break
              fi
            fi
            echo "Waiting for database initialization... ($i/90)"
            sleep 2
          done

          if [ "$initialized" != "true" ]; then
            echo "ERROR: Database initialization failed within timeout"
            echo "Container logs:"
            docker logs test-mariadb
            docker stop test-mariadb && docker rm test-mariadb
            exit 1
          fi

          # Verify all databases exist
          echo "Verifying databases..."
          docker exec test-mariadb mariadb -u root -ptestpassword -e "SHOW DATABASES;" | grep -x "oscar" > /dev/null || { echo "ERROR: oscar database not found"; docker stop test-mariadb && docker rm test-mariadb; exit 1; }
          docker exec test-mariadb mariadb -u root -ptestpassword -e "SHOW DATABASES;" | grep -x "oscar_test" > /dev/null || { echo "ERROR: oscar_test database not found"; docker stop test-mariadb && docker rm test-mariadb; exit 1; }
          docker exec test-mariadb mariadb -u root -ptestpassword -e "SHOW DATABASES;" | grep -x "drugref2" > /dev/null || { echo "ERROR: drugref2 database not found"; docker stop test-mariadb && docker rm test-mariadb; exit 1; }
          echo "All databases verified!"

          echo "All tests passed!"
          docker stop test-mariadb && docker rm test-mariadb

      - name: Save tested mariadb-dev image
        run: |
          mkdir -p "$RUNNER_TEMP/container-images"
          docker save carlos-mariadb-dev:test -o "$RUNNER_TEMP/container-images/carlos-mariadb-dev.tar"

      - name: Upload tested mariadb-dev image
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: carlos-mariadb-dev-image
          path: ${{ runner.temp }}/container-images/carlos-mariadb-dev.tar
          retention-days: 1

  publish-mariadb:
    needs: [check-containers, build-mariadb]
    if: needs.check-containers.outputs.mariadb_needs_build == 'true' && needs.build-mariadb.result == 'success' && (github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && github.event.inputs.force_rebuild == 'true'))
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    steps:
      - name: Download tested mariadb-dev image
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: carlos-mariadb-dev-image
          path: ${{ runner.temp }}/container-images

      - name: Log in to Container Registry
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push tested mariadb-dev container
        id: push-mariadb
        env:
          IMAGE: ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/carlos-mariadb-dev
          CONTENT_HASH: ${{ needs.check-containers.outputs.mariadb_hash }}
          CACHE_REF_NAME: ${{ github.base_ref || github.ref_name }}
          SHOULD_PUSH_LATEST: ${{ github.ref_name == 'develop' }}
        run: |
          cache_tag() {
            local ref_name=$1
            local safe_ref

            safe_ref=$(printf '%s' "$ref_name" \
              | tr '[:upper:]/' '[:lower:]-' \
              | sed -E 's/[^a-z0-9_.-]+/-/g; s/^-+//; s/-+$//; s/^$/branch/' \
              | cut -c1-120)
            printf '%s-latest' "$safe_ref"
          }

          docker load -i "$RUNNER_TEMP/container-images/carlos-mariadb-dev.tar"
          docker tag carlos-mariadb-dev:test "$IMAGE:${{ github.sha }}"
          CACHE_TAG=$(cache_tag "$CACHE_REF_NAME")
          docker tag carlos-mariadb-dev:test "$IMAGE:$CACHE_TAG"
          docker tag carlos-mariadb-dev:test "$IMAGE:content-$CONTENT_HASH"
          docker push "$IMAGE:$CACHE_TAG"
          docker push "$IMAGE:${{ github.sha }}"
          push_output=$(docker push "$IMAGE:content-$CONTENT_HASH")
          printf '%s\n' "$push_output"
          digest=$(printf '%s\n' "$push_output" \
            | sed -nE 's/^.*digest: (sha256:[0-9a-f]{64}).*$/\1/p' \
            | tail -1)
          if [ -z "$digest" ]; then
            echo "Unable to resolve pushed MariaDB image digest" >&2
            exit 1
          fi
          if [ "$SHOULD_PUSH_LATEST" = "true" ]; then
            docker tag carlos-mariadb-dev:test "$IMAGE:latest"
            docker push "$IMAGE:latest"
          fi
          echo "image_name=$IMAGE" >> "$GITHUB_OUTPUT"
          echo "image_digest=$digest" >> "$GITHUB_OUTPUT"

      - name: Attest MariaDB image provenance
        uses: actions/attest-build-provenance@0f67c3f4856b2e3261c31976d6725780e5e4c373 # v4.1.1
        with:
          subject-name: ${{ steps.push-mariadb.outputs.image_name }}
          subject-digest: ${{ steps.push-mariadb.outputs.image_digest }}
          push-to-registry: true

  # ===========================================================================
  # Build and push drugref container
  # ===========================================================================
  build-drugref:
    needs: check-containers
    if: needs.check-containers.outputs.drugref_needs_build == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f

      - name: Build drugref container
        env:
          CONTENT_HASH: ${{ needs.check-containers.outputs.drugref_hash }}
        run: |
          echo "Building carlos-drugref container..."
          docker buildx build \
            --load \
            -t carlos-drugref:test \
            --label "org.openosp.content-hash=$CONTENT_HASH" \
            --label "org.opencontainers.image.source=https://github.com/${{ github.repository }}" \
            --label "org.opencontainers.image.revision=${{ github.sha }}" \
            .devcontainer/drugref

      - name: Test drugref container
        run: |
          echo "Testing container starts correctly..."
          docker run -d --name test-drugref -p 8081:8080 carlos-drugref:test

          echo "Waiting for Tomcat to start..."
          ready=false
          for i in {1..30}; do
            # Check if Tomcat is responding (any response including 404 means Tomcat is up)
            # DrugRef deploys to /drugref2/, so root may 404 but that's fine
            http_code=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:8081/ 2>/dev/null || echo "000")
            if [ "$http_code" != "000" ]; then
              echo "Tomcat is responding! (HTTP $http_code)"
              ready=true
              break
            fi
            # Check if container is still running
            if ! docker ps | grep -q test-drugref; then
              echo "Container stopped unexpectedly. Logs:"
              docker logs test-drugref
              exit 1
            fi
            echo "Waiting... ($i/30)"
            sleep 2
          done

          if [ "$ready" != "true" ]; then
            echo "ERROR: Tomcat failed to respond within timeout"
            docker logs test-drugref
            docker stop test-drugref && docker rm test-drugref
            exit 1
          fi

          echo "Verifying Java version..."
          docker exec test-drugref java --version

          echo "Verifying WAR deployment..."
          docker exec test-drugref ls -la /usr/local/tomcat/webapps/

          echo "All tests passed!"
          docker stop test-drugref && docker rm test-drugref

      - name: Save tested drugref image
        run: |
          mkdir -p "$RUNNER_TEMP/container-images"
          docker save carlos-drugref:test -o "$RUNNER_TEMP/container-images/carlos-drugref.tar"

      - name: Upload tested drugref image
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: carlos-drugref-image
          path: ${{ runner.temp }}/container-images/carlos-drugref.tar
          retention-days: 1

  publish-drugref:
    needs: [check-containers, build-drugref]
    if: needs.check-containers.outputs.drugref_needs_build == 'true' && needs.build-drugref.result == 'success' && (github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && github.event.inputs.force_rebuild == 'true'))
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    steps:
      - name: Download tested drugref image
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: carlos-drugref-image
          path: ${{ runner.temp }}/container-images

      - name: Log in to Container Registry
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push tested drugref container
        id: push-drugref
        env:
          IMAGE: ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/carlos-drugref
          CONTENT_HASH: ${{ needs.check-containers.outputs.drugref_hash }}
          CACHE_REF_NAME: ${{ github.base_ref || github.ref_name }}
          SHOULD_PUSH_LATEST: ${{ github.ref_name == 'develop' }}
        run: |
          cache_tag() {
            local ref_name=$1
            local safe_ref

            safe_ref=$(printf '%s' "$ref_name" \
              | tr '[:upper:]/' '[:lower:]-' \
              | sed -E 's/[^a-z0-9_.-]+/-/g; s/^-+//; s/-+$//; s/^$/branch/' \
              | cut -c1-120)
            printf '%s-latest' "$safe_ref"
          }

          docker load -i "$RUNNER_TEMP/container-images/carlos-drugref.tar"
          docker tag carlos-drugref:test "$IMAGE:${{ github.sha }}"
          CACHE_TAG=$(cache_tag "$CACHE_REF_NAME")
          docker tag carlos-drugref:test "$IMAGE:$CACHE_TAG"
          docker tag carlos-drugref:test "$IMAGE:content-$CONTENT_HASH"
          docker push "$IMAGE:$CACHE_TAG"
          docker push "$IMAGE:${{ github.sha }}"
          push_output=$(docker push "$IMAGE:content-$CONTENT_HASH")
          printf '%s\n' "$push_output"
          digest=$(printf '%s\n' "$push_output" \
            | sed -nE 's/^.*digest: (sha256:[0-9a-f]{64}).*$/\1/p' \
            | tail -1)
          if [ -z "$digest" ]; then
            echo "Unable to resolve pushed DrugRef image digest" >&2
            exit 1
          fi
          if [ "$SHOULD_PUSH_LATEST" = "true" ]; then
            docker tag carlos-drugref:test "$IMAGE:latest"
            docker push "$IMAGE:latest"
          fi
          echo "image_name=$IMAGE" >> "$GITHUB_OUTPUT"
          echo "image_digest=$digest" >> "$GITHUB_OUTPUT"

      - name: Attest DrugRef image provenance
        uses: actions/attest-build-provenance@0f67c3f4856b2e3261c31976d6725780e5e4c373 # v4.1.1
        with:
          subject-name: ${{ steps.push-drugref.outputs.image_name }}
          subject-digest: ${{ steps.push-drugref.outputs.image_digest }}
          push-to-registry: true

  # ===========================================================================
  # Summary job - reports what happened
  # ===========================================================================
  summary:
    needs: [check-containers, build-tomcat, build-mariadb, build-drugref, publish-tomcat, publish-mariadb, publish-drugref]
    if: always()
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Report results
        env:
          TOMCAT_NEEDS_BUILD: ${{ needs.check-containers.outputs.tomcat_needs_build }}
          TOMCAT_RESULT: ${{ needs.build-tomcat.result }}
          TOMCAT_PUBLISH_RESULT: ${{ needs.publish-tomcat.result }}
          MARIADB_NEEDS_BUILD: ${{ needs.check-containers.outputs.mariadb_needs_build }}
          MARIADB_RESULT: ${{ needs.build-mariadb.result }}
          MARIADB_PUBLISH_RESULT: ${{ needs.publish-mariadb.result }}
          DRUGREF_NEEDS_BUILD: ${{ needs.check-containers.outputs.drugref_needs_build }}
          DRUGREF_RESULT: ${{ needs.build-drugref.result }}
          DRUGREF_PUBLISH_RESULT: ${{ needs.publish-drugref.result }}
        run: |
          echo "========================================="
          echo "Container Image Build Summary"
          echo "========================================="
          echo ""
          echo "Tomcat-dev:"
          echo "  - Needs build: $TOMCAT_NEEDS_BUILD"
          echo "  - Build result: ${TOMCAT_RESULT:-skipped}"
          echo "  - Publish result: ${TOMCAT_PUBLISH_RESULT:-skipped}"
          echo ""
          echo "MariaDB-dev:"
          echo "  - Needs build: $MARIADB_NEEDS_BUILD"
          echo "  - Build result: ${MARIADB_RESULT:-skipped}"
          echo "  - Publish result: ${MARIADB_PUBLISH_RESULT:-skipped}"
          echo ""
          echo "DrugRef:"
          echo "  - Needs build: $DRUGREF_NEEDS_BUILD"
          echo "  - Build result: ${DRUGREF_RESULT:-skipped}"
          echo "  - Publish result: ${DRUGREF_PUBLISH_RESULT:-skipped}"
          echo ""

          # Check for failures
          if [ "$TOMCAT_RESULT" == "failure" ] || \
             [ "$MARIADB_RESULT" == "failure" ] || \
             [ "$DRUGREF_RESULT" == "failure" ] || \
             [ "$TOMCAT_PUBLISH_RESULT" == "failure" ] || \
             [ "$MARIADB_PUBLISH_RESULT" == "failure" ] || \
             [ "$DRUGREF_PUBLISH_RESULT" == "failure" ]; then
            echo "One or more builds failed!"
            exit 1
          fi

          echo "All container operations completed successfully!"
