# GitHub Workflow: Verify the CARLOS Flyway baseline applies cleanly
#
# The legacy script build (createdatabase_<prov>.sh + oscarinit*/oscardata*) has been retired:
# the consolidated Flyway V1 baseline is now the single source of truth. There is no longer a
# legacy schema to diff against, so this workflow proves the forward guarantee instead — that a
# fresh `flyway migrate` (common + province) succeeds, validates, and yields a populated schema —
# for both provinces. Reference-data/row-count parity against the old build was verified once at
# cutover (PR #3150) and is preserved in git history.
#
# Triggered on schema, installer, validator, hook, and devcontainer changes that can affect DB setup.

name: DB schema verify

on:
  pull_request:
    paths:
      - 'database/mysql/**'
      - 'release/**'
      - 'pom.xml'
      - 'src/main/java/io/github/carlos_emr/carlos/db/FlywaySchemaValidator.java'
      - 'src/main/resources/spring_jpa.xml'
      - 'src/main/resources/carlos.properties'
      - '.devcontainer/**'
      - '.github/workflows/db-schema-verify.yml'
      - 'scripts/ci/verify-flyway-baseline.sh'
      - '.claude/**'

# Read-only job: it checks out the repo and talks to a local docker container.
# Superseded pushes to the same PR cancel the in-progress run; every other
# event (push to a protected branch, schedule, dispatch) gets a unique group
# via run_id and is never queued behind or cancelled by another run. The final
# head of a PR always gets its own complete run, so no check outcome changes.
concurrency:
  group: db-schema-verify-${{ github.event_name == 'pull_request' && github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  flyway-baseline:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        province: [on, bc]

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false

      - name: Install MariaDB client and Flyway CLI
        run: |
          sudo apt-get update && sudo apt-get install -y mariadb-client
          FLYWAY_VERSION=11.14.0
          # Pinned SHA256 (same pin as release/make_CARLOS_deb.sh) — update together with the version.
          FLYWAY_SHA256=310af67e104e128e93cfe7fa7a59570024f0bb2c03bfdc70137acbe03d5cf5d0
          # The bundled linux CLI tarball is on Red Gate's mirror; Maven Central only has the jar.
          curl -fsSL "https://download.red-gate.com/maven/release/com/redgate/flyway/flyway-commandline/${FLYWAY_VERSION}/flyway-commandline-${FLYWAY_VERSION}-linux-x64.tar.gz" \
            -o /tmp/flyway.tgz
          echo "${FLYWAY_SHA256}  /tmp/flyway.tgz" | sha256sum -c -
          tar xzf /tmp/flyway.tgz
          echo "$PWD/flyway-${FLYWAY_VERSION}" >> "$GITHUB_PATH"

      - name: Start MariaDB 11.8.8 with the CARLOS server config
        env:
          MYSQL_PWD: password
        run: |
          set -euo pipefail
          # Run MariaDB with the SAME my.cnf the devcontainer/production use (not a stock service
          # container) so the datadir initializes with innodb_page_size=32K. CARLOS requires 32K
          # pages (a documented invariant): several wide legacy form tables — e.g. formBCAR (500+
          # varchar columns) — exceed InnoDB's ~8126-byte leaf-row limit under the default 16K page
          # size but fit under 32K. 11.8.8 matches the devcontainer/CI runtime and carlos-podman.
          docker run -d --name carlos-db -p 3306:3306 \
            -e MARIADB_ROOT_PASSWORD=password \
            -v "$GITHUB_WORKSPACE/.devcontainer/development/config/shared/my.cnf:/etc/mysql/my.cnf:ro" \
            mariadb:11.8.8
          echo "Waiting for MariaDB to accept connections..."
          for i in $(seq 1 60); do
            if mariadb -h 127.0.0.1 -uroot -e "SELECT 1" >/dev/null 2>&1; then
              echo "MariaDB ready (innodb_page_size=$(mariadb -N -h 127.0.0.1 -uroot -e 'SELECT @@innodb_page_size'))"
              break
            fi
            [ "$i" = 60 ] && { echo "::error::MariaDB did not start"; docker logs carlos-db; exit 1; }
            sleep 2
          done
          # ASSERT the 32K invariant this whole job depends on — a mis-mounted my.cnf would fall
          # back to 16K pages and only fail indirectly (or not at all) on narrow tables.
          PAGE_SIZE=$(mariadb -N -h 127.0.0.1 -uroot -e 'SELECT @@innodb_page_size')
          if [ "${PAGE_SIZE}" != "32768" ]; then
            echo "::error::innodb_page_size is ${PAGE_SIZE}, expected 32768 — the CARLOS my.cnf did not apply"
            exit 1
          fi

      - name: Migrate the V1 baseline and smoke-check the result
        env:
          # DB password stays off the process argv: the mariadb client reads MYSQL_PWD and Flyway
          # reads FLYWAY_PASSWORD, so neither the `-p...` nor `-password=` flag appears in `ps`.
          # (These CI creds are a throwaway against an ephemeral local container, but this matches
          # the off-argv hardening used in release/postinst and carlos_backup.sh.)
          MYSQL_PWD: password
          FLYWAY_PASSWORD: password
          # Matrix value enters via env (not inline ${{ }} in the script body) — template-injection hygiene.
          PROV: ${{ matrix.province }}
        run: bash scripts/ci/verify-flyway-baseline.sh
