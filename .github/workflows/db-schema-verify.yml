# GitHub Workflow: Verify the CARLOS Flyway baseline applies cleanly
#
# The legacy script build (createdatabase_<prov>.sh + oscarinit*/oscardata*) has been retired:
# the consolidated Flyway V1 baseline is now the single source of truth. There is no longer a
# legacy schema to diff against, so this workflow proves the forward guarantee instead — that a
# fresh `flyway migrate` (common + province) succeeds, validates, and yields a populated schema —
# for both provinces. Reference-data/row-count parity against the old build was verified once at
# cutover (PR #3150) and is preserved in git history.
#
# Triggered only on changes under database/mysql/** so it does not slow unrelated PRs.

name: DB schema verify

on:
  pull_request:
    paths:
      - 'database/mysql/**'
      - '.github/workflows/db-schema-verify.yml'

jobs:
  flyway-baseline:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        province: [on, bc]
    services:
      mariadb:
        # 11.8.8 matches the devcontainer/CI runtime and production (carlos-podman). The V1 baseline
        # DDL is fully explicit about every timestamp column's nullability/default, so 11.8's
        # explicit_defaults_for_timestamp=ON (vs 10.5's OFF) produces identical columns; the 3
        # zero-date timestamp defaults still load because sql_mode omits NO_ZERO_DATE.
        image: mariadb:11.8.8
        env:
          MARIADB_ROOT_PASSWORD: password
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mariadb-admin ping -ppassword"
          --health-interval=10s --health-timeout=5s --health-retries=10

    steps:
      - uses: actions/checkout@v4

      - name: Install MariaDB client and Flyway CLI
        run: |
          sudo apt-get update && sudo apt-get install -y mariadb-client
          FLYWAY_VERSION=11.14.0
          # The bundled linux CLI tarball is on Red Gate's mirror; Maven Central only has the jar.
          curl -fsSL "https://download.red-gate.com/maven/release/com/redgate/flyway/flyway-commandline/${FLYWAY_VERSION}/flyway-commandline-${FLYWAY_VERSION}-linux-x64.tar.gz" \
            | tar xz
          echo "$PWD/flyway-${FLYWAY_VERSION}" >> "$GITHUB_PATH"

      - name: Migrate the V1 baseline and smoke-check the result
        env:
          MYSQL_PWD: password
        run: |
          set -euo pipefail
          cd database/mysql
          PROV=${{ matrix.province }}
          MYSQL="mariadb -h 127.0.0.1 -uroot -ppassword"
          JDBC="jdbc:mysql://127.0.0.1:3306/carlos_${PROV}?allowPublicKeyRetrieval=true&useSSL=false"

          # Fresh install path: exactly what production runs via `carlos-ctl db migrate` and the
          # .deb postinst — common + province locations, baselineOnMigrate for the empty schema.
          $MYSQL -e "CREATE DATABASE carlos_${PROV};"
          flyway -url="$JDBC" -user=root -password=password \
            -locations="filesystem:migration/common,filesystem:migration/${PROV}" \
            -baselineOnMigrate=true migrate

          # validate re-checks every applied migration's checksum against the files on disk:
          # this catches a hand-edited baseline or a mismatched delta.
          flyway -url="$JDBC" -user=root -password=password \
            -locations="filesystem:migration/common,filesystem:migration/${PROV}" validate

          # Smoke checks: a real, populated schema (not an empty or half-applied DB).
          TABLES=$($MYSQL -N -e "SELECT COUNT(*) FROM information_schema.tables WHERE table_schema='carlos_${PROV}' AND table_name<>'flyway_schema_history'")
          echo "province ${PROV}: ${TABLES} tables"
          if [ "${TABLES}" -lt 300 ]; then
            echo "::error::Only ${TABLES} tables after migrate for ${PROV} — baseline did not apply fully"
            exit 1
          fi

          # Required reference data must be present: the carlosdoc admin privilege seed and ICD codes.
          ADMIN_GRANT=$($MYSQL -N carlos_${PROV} -e "SELECT COUNT(*) FROM secObjPrivilege WHERE roleUserGroup='admin' AND objectName='_admin'")
          ICD=$($MYSQL -N carlos_${PROV} -e "SELECT COUNT(*) FROM icd9")
          if [ "${ADMIN_GRANT}" -lt 1 ]; then
            echo "::error::carlosdoc admin privilege seed missing after migrate for ${PROV}"
            exit 1
          fi
          if [ "${ICD:-0}" -lt 1 ]; then
            echo "::error::diagnostic code table (icd9) empty after migrate for ${PROV}"
            exit 1
          fi
          echo "Flyway baseline verified for province ${PROV}: ${TABLES} tables, reference data present"
