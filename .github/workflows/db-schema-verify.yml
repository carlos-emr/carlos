# GitHub Workflow: Verify CARLOS DB schema identity (legacy scripts vs Flyway baseline)
#
# Proves that a database built by `flyway migrate` (consolidated V1 baseline + deltas) is
# schema-identical to one built the legacy way (createdatabase_<prov>.sh + the required recent
# update-*.sql). This is the core guarantee behind adopting Flyway: the migration set reproduces
# today's known-good schema exactly.
#
# Dormant until the baseline is generated: if common/V1__baseline_core_schema.sql does not yet
# exist, the diff step is skipped with a notice (the Flyway path has nothing to apply). Run
# database/mysql/build-baseline.sh in a devcontainer and commit the V1* files to activate it.
#
# Triggered only on changes under database/mysql/** so it does not slow unrelated PRs.

name: DB schema verify

on:
  pull_request:
    paths:
      - 'database/mysql/**'
      - '.github/workflows/db-schema-verify.yml'

jobs:
  schema-identity:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - province: on
            icd: '9'
          - province: bc
            icd: '9'
    services:
      mariadb:
        image: mariadb:10.5
        env:
          MARIADB_ROOT_PASSWORD: password
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -ppassword"
          --health-interval=10s --health-timeout=5s --health-retries=10

    steps:
      - uses: actions/checkout@v4

      - name: Install MariaDB client and Flyway CLI
        run: |
          sudo apt-get update && sudo apt-get install -y mariadb-client
          FLYWAY_VERSION=11.14.0
          # The bundled linux CLI tarball is on Red Gate's mirror; Maven Central only has the jar.
          curl -fsSL "https://download.red-gate.com/maven/release/com/redgate/flyway/flyway-commandline/${FLYWAY_VERSION}/flyway-commandline-${FLYWAY_VERSION}-linux-x64.tar.gz" \
            | tar xz
          echo "$PWD/flyway-${FLYWAY_VERSION}" >> "$GITHUB_PATH"

      - name: Skip if baseline not yet generated
        id: guard
        run: |
          if [ ! -f "database/mysql/migration/common/V1__baseline_schema.sql" ]; then
            echo "::notice::No V1 baseline committed yet — run database/mysql/build-baseline.sh and commit the V1 files to activate schema verification."
            echo "active=false" >> "$GITHUB_OUTPUT"
          else
            echo "active=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Build DB-A (legacy scripts) and DB-B (Flyway) and diff
        if: steps.guard.outputs.active == 'true'
        env:
          MYSQL_HOST: 127.0.0.1
          MYSQL_PWD: password
        run: |
          set -euo pipefail
          cd database/mysql
          PROV=${{ matrix.province }}
          ICD=${{ matrix.icd }}

          # createdatabase_*.sh connect via the default socket (host "localhost"); a GitHub Actions
          # service-container DB is reachable only over TCP. Force the mariadb clients to 127.0.0.1
          # + TCP via ~/.my.cnf so the legacy build (which passes no -h) reaches the service DB.
          printf '[client]\nhost=127.0.0.1\nprotocol=tcp\n' > ~/.my.cnf

          # DB-A: legacy path. Call createdatabase_generic.sh directly (the bc wrapper caps at 3
          # args and can't pass suppressPwdGen), matching build-baseline.sh. Then apply the same
          # required updates it folds into V1 (bare update-*.sql names from its REQUIRED_UPDATES).
          ./createdatabase_generic.sh root password legacy_${PROV} ${PROV} ${ICD} suppressPwdGen >/dev/null
          for u in $(grep -oE "update-[0-9]{4}-[0-9]{2}-[0-9]{2}[a-zA-Z0-9._-]*\.sql" build-baseline.sh | sort -u); do
            [ -f "updates/$u" ] && mysql -h 127.0.0.1 -uroot -ppassword legacy_${PROV} < "updates/$u" || true
          done
          # Prune the same dead tables build-baseline.sh drops, so DB-A matches the pruned V1.
          { echo "SET FOREIGN_KEY_CHECKS=0;"; grep -v '^#' migration/pruned-tables.txt | grep -v '^[[:space:]]*$' \
              | while read -r t; do echo "DROP TABLE IF EXISTS \`$t\`;"; done; echo "SET FOREIGN_KEY_CHECKS=1;"; } \
            | mysql -h 127.0.0.1 -uroot -ppassword legacy_${PROV}

          # DB-B: Flyway path (complete baseline: common schema + province schema + province data)
          mysql -h 127.0.0.1 -uroot -ppassword -e "CREATE DATABASE flyway_${PROV};"
          flyway -url="jdbc:mysql://127.0.0.1:3306/flyway_${PROV}?allowPublicKeyRetrieval=true&useSSL=false" \
            -user=root -password=password \
            -locations="filesystem:migration/common,filesystem:migration/${PROV}" \
            -baselineOnMigrate=true migrate

          # Schema parity (exclude Flyway's own flyway_schema_history — the only expected difference).
          norm() { mysqldump -h 127.0.0.1 -uroot -ppassword --no-data --skip-comments --skip-dump-date \
                    --ignore-table="$1.flyway_schema_history" "$1" \
                    | sed -E 's/ AUTO_INCREMENT=[0-9]+//g' | sort; }
          norm legacy_${PROV} > /tmp/a.sql
          norm flyway_${PROV} > /tmp/b.sql
          if ! diff -u /tmp/a.sql /tmp/b.sql; then
            echo "::error::Flyway schema for ${PROV} differs from the pruned legacy-built schema"
            exit 1
          fi
          echo "Schema identity verified for province ${PROV}"

          # Data parity: exact row count per table must match between the two builds.
          rowcounts() {
            for t in $(mysql -N -h 127.0.0.1 -uroot -ppassword -e \
                "SELECT table_name FROM information_schema.tables WHERE table_schema='$1' AND table_name<>'flyway_schema_history'"); do
              printf "%s %s\n" "$t" "$(mysql -N -h 127.0.0.1 -uroot -ppassword -e "SELECT COUNT(*) FROM \`$1\`.\`$t\`")"
            done | sort
          }
          rowcounts legacy_${PROV} > /tmp/ra.txt
          rowcounts flyway_${PROV} > /tmp/rb.txt
          if ! diff -u /tmp/ra.txt /tmp/rb.txt; then
            echo "::error::Flyway reference data for ${PROV} differs from the legacy-built data (row counts)"
            exit 1
          fi
          echo "Schema + data identity verified for province ${PROV}"
