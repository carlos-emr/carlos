# Runs the DCO workflow's own regression tests. dco-check.yml runs as
# pull_request_target from the base branch, so a change to it is never
# exercised by its own PR; this job executes the real workflow shell against
# sanitized API fixtures instead. No token beyond contents:read is needed.
name: CARLOS DCO Workflow Validation
on:
  pull_request:
    paths:
      - '.github/workflows/dco-check.yml'
      - '.github/workflows/dco-validation.yml'
      - 'scripts/dco-workflow.test.js'
      - 'scripts/fixtures/dco/**'
permissions:
  contents: read
concurrency:
  group: dco-validation-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22.23.3'
          package-manager-cache: false
      - name: Test the DCO workflow verifier and reporting
        run: node --test scripts/dco-workflow.test.js
