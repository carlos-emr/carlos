#
# Build the Debian packages (carlos-emr, carlos-emr-drugref), attach them to
# the release, and PUBLISH the release as the final step.
#
# DESIGN — a SEPARATE workflow from publish-release.yml, but it FINALIZES the
# release: publish-release.yml leaves the release as a DRAFT carrying the WAR +
# SBOM, and this workflow downloads that WAR, builds the .debs, attaches them,
# and only then flips the release to published. The order matters because the
# repository enables immutable releases — assets cannot be added once a release
# is published, so every asset (WAR, SBOM, both .debs) must be in place while it
# is still a draft.
#
#   * The deb ships the release's OWN WAR, downloaded from the draft and
#     verified against its .sha256 and provenance attestation — the same bytes,
#     with no second Maven compile that could drift.
#   * If this workflow fails, the release simply stays a draft (nothing is
#     half-published); the workflow_dispatch input re-runs it to finish the job
#     (or to backfill an older release).
#
# The build runs inside an ubuntu:26.04 container so the toolchain and the
# runtime dependency versions are exactly the target distribution's,
# independent of which runner labels GitHub offers this month.

name: Debian Packages

on:
  # The release trigger only fires for releases published by a HUMAN (or a
  # PAT/app): releases published by publish-release.yml use the
  # workflow-scoped GITHUB_TOKEN, whose events GitHub suppresses — that
  # pipeline therefore dispatches this workflow explicitly as its final
  # step. Both paths land in the same build.
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Published release tag to build .deb assets for
        required: true
        type: string

# ONE GLOBAL group (not per-tag): this workflow now publishes the release and
# makes the latest-pointer decision, which reads the set of already-published
# stable releases. Two releases finalizing concurrently could each query while
# the other is still a draft and both claim --latest, letting the one that
# publishes last win even if it is older. Global serialization removes that
# race; it also still prevents a retry racing the original run (which would
# upload the same asset names at once). Releases are rare and deliberate, so
# serializing all deb builds costs nothing.
concurrency:
  group: deb-packages
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build-debs:
    name: Build and attach .deb packages
    runs-on: ubuntu-latest
    container:
      # Digest-pinned like every third-party artefact in this repository's
      # workflows: a re-pushed tag must never change what runs with release
      # and attestation permissions. Re-resolve on deliberate base bumps
      # (skopeo inspect docker://ubuntu:26.04).
      image: ubuntu:26.04@sha256:2260313b31c8c011cd2eebe728008efac1b3982be73eb71348ea2648d2c0e09b
    permissions:
      # Upload assets to the release.
      contents: write
      # Provenance attestation for the .debs, matching the WAR's.
      id-token: write
      attestations: write
    env:
      RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.event.release.tag_name }}
      REPO: ${{ github.repository }}
      GH_TOKEN: ${{ github.token }}
      DEBIAN_FRONTEND: noninteractive
    steps:
      - name: Install build dependencies
        run: |
          set -euo pipefail
          apt-get update
          # The list mirrors debian/control Build-Depends plus the release
          # tooling (gh, curl, git for the DrugRef fetch). Maven is still
          # installed for the DrugRef build; the CARLOS WAR itself is NOT
          # compiled here (see CARLOS_WAR below).
          apt-get install -y --no-install-recommends \
            build-essential debhelper devscripts lintian fakeroot \
            maven openjdk-21-jdk-headless tomcat11 \
            git ca-certificates curl xz-utils
          # gh comes from GitHub's own apt repository, NOT the Ubuntu
          # archive: resolute ships gh 2.46.0, and `gh attestation` (which
          # the WAR verification below depends on) only exists from 2.49.0 —
          # with the archive build, every run failed at the verify step.
          curl -fsSL https://cli.github.com/packages/githubcli-archive-keyring.gpg \
            -o /usr/share/keyrings/githubcli-archive-keyring.gpg
          echo "deb [arch=$(dpkg --print-architecture) signed-by=/usr/share/keyrings/githubcli-archive-keyring.gpg] https://cli.github.com/packages stable main" \
            > /etc/apt/sources.list.d/github-cli.list
          apt-get update
          apt-get install -y --no-install-recommends gh
          gh --version

      - name: Checkout the tagged source
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          ref: refs/tags/${{ env.RELEASE_TAG }}
          persist-credentials: false

      - name: Refuse tags that predate the packaging
        run: |
          set -euo pipefail
          # Backfill builds FROM THE TAG'S OWN TREE — a tag cut before
          # debian/ existed has nothing to build, and without this guard the
          # run died later on a bare "No such file or directory" from the
          # changelog stamp.
          if [ ! -d debian ]; then
            echo "::error::tag $RELEASE_TAG contains no debian/ directory — it predates the packaging and cannot be backfilled. Only tags cut after the packaging merged can build deb assets."
            exit 1
          fi

      - name: Skip if the release is already finalized
        run: |
          set -eu
          # gh release view (unlike the releases/tags REST endpoint, which 404s
          # on drafts) can see a DRAFT release. Under the release flow the
          # release is a draft carrying only the WAR at this point, so we must
          # not treat "not published yet" as "published without debs".
          #   draft, or no release yet -> proceed to build, attach, and publish
          #   published with both packages -> nothing to do (immutable; re-upload would 422)
          #   published but missing a package -> fail fast (immutable, unfixable)
          isdraft=$(gh release view "$RELEASE_TAG" --repo "$REPO" --json isDraft --jq '.isDraft' 2>/dev/null || echo missing)
          if [ "$isdraft" != "false" ]; then
            echo "SKIP=false" >> "$GITHUB_ENV"
          else
            emr=$(gh release view "$RELEASE_TAG" --repo "$REPO" --json assets \
              --jq '[.assets[].name | select(startswith("carlos-emr_") and endswith(".deb"))] | length' 2>/dev/null || echo 0)
            drugref=$(gh release view "$RELEASE_TAG" --repo "$REPO" --json assets \
              --jq '[.assets[].name | select(startswith("carlos-emr-drugref_") and endswith(".deb"))] | length' 2>/dev/null || echo 0)
            if [ "$emr" -ge 1 ] && [ "$drugref" -ge 1 ]; then
              echo "Release $RELEASE_TAG is already published with both carlos-emr and carlos-emr-drugref .deb assets; nothing to do."
              echo "SKIP=true" >> "$GITHUB_ENV"
            else
              echo "::error::Release $RELEASE_TAG is already published but is missing a .deb asset. Immutable releases cannot accept new assets, so this cannot be completed; ship the .debs with the next release."
              exit 1
            fi
          fi

      - name: Download and verify the release WAR
        if: env.SKIP != 'true'
        run: |
          set -euo pipefail
          # The deb ships the exact WAR the release carries (still a draft):
          # the .sha256 catches corrupt/partial downloads, and the attestation check
          # below is what makes the stronger claim true — a swapped WAR
          # (even one with a matching swapped .sha256) fails provenance
          # verification and never becomes a package payload.
          gh release download "$RELEASE_TAG" --repo "$REPO" \
            --pattern "carlos-$RELEASE_TAG.war" \
            --pattern "carlos-$RELEASE_TAG.war.sha256" \
            --dir /tmp/release-war
          cd /tmp/release-war
          sha256sum -c "carlos-$RELEASE_TAG.war.sha256"
          # The .sha256 travels with the WAR, so it only catches corrupt or
          # partial downloads. The ATTESTATION is the tamper control: it
          # binds these exact bytes to the publish-release workflow run that
          # built them, and nobody with mere contents:write can forge it.
          gh attestation verify "carlos-$RELEASE_TAG.war" --repo "$REPO"
          echo "CARLOS_WAR=/tmp/release-war/carlos-$RELEASE_TAG.war" >> "$GITHUB_ENV"

      - name: Stamp the package version from the release tag
        if: env.SKIP != 'true'
        run: |
          set -euo pipefail
          # CalVer tag -> Debian version. Pre-release suffixes swap '-' for
          # '~' (2026.08.0-alpha4 -> 2026.08.0~alpha4): '~' sorts BEFORE the
          # empty string in dpkg, so alphas and rcs correctly upgrade to the
          # final release. NO '-N' Debian revision is appended: this is a
          # `3.0 (native)` package (debian/source/format), and a native
          # version with a hyphen is malformed (dpkg-source warns "native
          # package version may not have a revision"). The release tag is the
          # whole version; re-publishing a tag replaces its assets in place.
          deb_version="$(printf '%s' "$RELEASE_TAG" | sed 's/-/~/g')"
          # git identity for dch-less changelog editing is not needed; write
          # the stanza directly, keeping the existing changelog as history.
          {
            printf 'carlos-emr (%s) resolute; urgency=medium\n\n' "$deb_version"
            printf '  * Automated package build of the %s release.\n' "$RELEASE_TAG"
            printf '    The carlos-emr package ships the WAR published (and attested) by\n'
            printf '    that release, byte for byte; DrugRef is built from the revision\n'
            printf '    pinned in debian/drugref.pin.\n\n'
            printf ' -- CARLOS Release CI <releases@carlos-emr.invalid>  %s\n' "$(date -R)"
          } > debian/changelog.new
          # Replace, do NOT prepend: the in-tree changelog's top stanza is a
          # development snapshot (e.g. 2026.09.0~snapshot1) whose version is
          # HIGHER than the release being built, so keeping it below the
          # release entry would present a higher version as older history and
          # trip lintian's ordering check. The authoritative history is git.
          mv debian/changelog.new debian/changelog
          echo "DEB_VERSION=$deb_version" >> "$GITHUB_ENV"

      - name: Build the packages
        if: env.SKIP != 'true'
        run: |
          set -euo pipefail
          # CARLOS_WAR skips the in-tree Maven compile; DrugRef builds from
          # the pinned revision via debian/fetch-drugref.sh. dpkg-buildpackage
          # runs the whole debhelper pipeline including our install-time
          # staging checks.
          dpkg-buildpackage -us -uc -b
          mkdir -p release-assets
          for deb in ../carlos-emr_"${DEB_VERSION}"_all.deb ../carlos-emr-drugref_"${DEB_VERSION}"_all.deb; do
            cp "$deb" release-assets/
          done
          cd release-assets
          for f in *.deb; do sha256sum "$f" > "$f.sha256"; done
          ls -la

      - name: Lintian gate
        if: env.SKIP != 'true'
        run: |
          set -euo pipefail
          # Errors fail the build. The overrides files in debian/ carry the
          # documented, deliberate exceptions; anything NEW is a regression.
          lintian --fail-on error ../carlos-emr_*.changes

      - name: Attest package provenance
        if: env.SKIP != 'true'
        uses: actions/attest-build-provenance@0f67c3f4856b2e3261c31976d6725780e5e4c373 # v4.1.1
        with:
          subject-path: |
            release-assets/*.deb

      - name: Upload and verify the release assets
        if: env.SKIP != 'true'
        run: |
          set -euo pipefail
          gh release upload "$RELEASE_TAG" release-assets/* --repo "$REPO" --clobber
          # Same digest verification contract as the WAR upload in
          # publish-release.yml: what GitHub stores must be what we hashed.
          # Matched by DIGEST, not by name: GitHub normalises the stored
          # asset name (it rewrites the '~' in a Debian pre-release version
          # to '.'), so a name-equality lookup never matched and the check
          # failed on every alpha/rc tag. The digest is invariant.
          stored_digests="$(gh api "repos/$REPO/releases/tags/$RELEASE_TAG" --jq '.assets[].digest')"
          for asset in release-assets/*.deb; do
            name="$(basename "$asset")"
            expected="sha256:$(sha256sum "$asset" | awk '{print $1}')"
            if ! printf '%s\n' "$stored_digests" | grep -qxF "$expected"; then
              echo "::error::no uploaded asset on $RELEASE_TAG matches the digest of $name ($expected)"
              exit 1
            fi
          done
          echo "Published: $(cd release-assets && ls *.deb | tr '\n' ' ')"

      - name: Publish the release
        if: env.SKIP != 'true'
        run: |
          set -euo pipefail
          # Every asset (WAR, SBOM, both .debs) is now attached to the draft.
          # Flip it to published — this is the point the release becomes
          # immutable. The latest-pointer decision lives here (not in
          # publish-release.yml) because the release is only published once all
          # assets, including these .debs, are in place.
          prerelease=false
          if [[ "$RELEASE_TAG" =~ -(alpha|beta|rc)[1-9][0-9]*$ ]]; then
            prerelease=true
          fi

          if [ "$prerelease" = "true" ]; then
            gh release edit "$RELEASE_TAG" --repo "$REPO" --draft=false --prerelease --latest=false
          else
            # A maintenance patch published from an OLDER release line must not
            # steal the repo's "latest release" pointer from a newer train:
            # mark latest only when this tag tops every published stable
            # release under the CalVer numeric sort. Paginated so a fixed
            # --limit cannot miss the newest stable release once the repo grows.
            latest_flag=--latest
            existing=$(gh api --paginate "repos/$REPO/releases?per_page=100" \
              --jq '.[] | select((.draft or .prerelease) | not) | .tag_name')
            top=$({ printf '%s\n' "$RELEASE_TAG"; printf '%s\n' "$existing"; } \
              | sed '/^$/d' | sort -t. -k1,1n -k2,2n -k3,3n | tail -1)
            if [ "$top" != "$RELEASE_TAG" ]; then
              latest_flag=--latest=false
              echo "A newer stable release ($top) is already published — not marking $RELEASE_TAG as latest."
            fi
            gh release edit "$RELEASE_TAG" --repo "$REPO" --draft=false --prerelease=false "$latest_flag"
          fi
          echo "Published release $RELEASE_TAG with WAR, SBOM, and .deb assets."
