#
# The Python regressions around the Debian packaging, and the contract with
# the carlos-ctl package (carlos-emr/carlos-ctl) that carlos-emr depends on:
#
#   * debian/assets/tests: packaging-contract tests (the backup script vs.
#     the postrm, the OSCAR 19 import guard and its three callers, the
#     release-asset checksum generator in deb-packages.yml).
#   * scripts/migration/o19/tests: the manifest generator and the shipped
#     OSCAR 19 manifests (debian/assets/o19-manifest), read through the
#     pinned carlos-ctl's loaders.
#   * the pinned carlos-ctl's own suite with CARLOS_SRC pointing at this
#     checkout: its contract tests (the login-name rule the importer
#     mirrors, the Flyway set db-baseline adopts, the rules that ship the
#     o19 fixups, the runbook the man page must agree with) run here and
#     nowhere else.
#
# The carlos-ctl checkout is the release debian/carlos-ctl.pin names, so this
# job answers "does the CLI a release ships still agree with this tree".
name: Debian Python Regressions

on:
  pull_request:
    paths:
      - 'debian/**'
      - 'scripts/migration/o19/**'
      - 'scripts/ci/prepare-cli-manifest-test-copy.py'
      # the manifest generator's inputs (schema/overlay parity tests run
      # here; full --check also needs an OSCAR 19 checkout): the Flyway set
      # and the legacy patches it reads, the entity
      # classes its primitive-column scan walks, and the three resource
      # files whose values it ships
      - 'src/main/java/**'
      - 'database/mysql/migration/**'
      - 'database/mysql/updates/**'
      - 'src/main/resources/carlos.properties'
      - 'src/main/resources/oscar/prevention/PreventionItems.xml'
      - 'src/main/resources/oscarResources_en.properties'
      - 'docs/o19-import-deb.md'
      - '.github/workflows/deb-packages.yml'
      - '.github/workflows/debian-python-tests.yml'
  push:
    branches: [develop, 'release/**']
    paths:
      - 'debian/**'
      - 'scripts/migration/o19/**'
      - 'scripts/ci/prepare-cli-manifest-test-copy.py'
      # the manifest generator's inputs (schema/overlay parity tests run
      # here; full --check also needs an OSCAR 19 checkout): the Flyway set
      # and the legacy patches it reads, the entity
      # classes its primitive-column scan walks, and the three resource
      # files whose values it ships
      - 'src/main/java/**'
      - 'database/mysql/migration/**'
      - 'database/mysql/updates/**'
      - 'src/main/resources/carlos.properties'
      - 'src/main/resources/oscar/prevention/PreventionItems.xml'
      - 'src/main/resources/oscarResources_en.properties'
      - 'docs/o19-import-deb.md'
      - '.github/workflows/deb-packages.yml'
      - '.github/workflows/debian-python-tests.yml'

permissions:
  contents: read

jobs:
  tests:
    name: Debian Python regressions
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CARLOS_CTL_SRC: ${{ github.workspace }}/.carlos-ctl
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check out the pinned carlos-ctl release
        run: |
          set -euo pipefail
          tag="$(sed -n 's/^tag=//p' debian/carlos-ctl.pin)"
          if [ -z "$tag" ]; then
            echo "::error::debian/carlos-ctl.pin names no tag"
            exit 1
          fi
          if git clone --quiet --depth 1 --branch "$tag" \
              https://github.com/carlos-emr/carlos-ctl.git "$CARLOS_CTL_SRC"; then
            echo "carlos-ctl $tag at $(git -C "$CARLOS_CTL_SRC" rev-parse HEAD)"
          else
            # the pin's pre-release fallback commit (see debian/carlos-ctl.pin)
            fallback="$(sed -n 's/^fallback=//p' debian/carlos-ctl.pin)"
            if [ -z "$fallback" ]; then
              echo "::error::carlos-ctl tag $tag is not published and debian/carlos-ctl.pin names no fallback commit"
              exit 1
            fi
            git clone --quiet https://github.com/carlos-emr/carlos-ctl.git "$CARLOS_CTL_SRC"
            git -C "$CARLOS_CTL_SRC" checkout --quiet "$fallback"
            echo "::warning::carlos-ctl tag $tag is not published yet; testing against the pin's fallback commit $fallback"
          fi
      # Ubuntu 26.04 ships Python 3.14. The runner's 3.12 CSV reader has
      # a known QUOTE_NOTNULL bug and cannot validate the target semantics.
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.14'
      - name: Install the CLI's runtime dependency
        run: pip install bcrypt==5.0.0
      - name: Packaging-contract tests
        # Do not import these as debian.assets: python-debian, installed on
        # Debian development hosts, owns the top-level debian package.
        run: python3 -m unittest discover -s debian/assets/tests
      - name: Manifest generator and shipped-manifest tests
        run: python3 -m unittest discover -s scripts/migration/o19/tests -t .
      # Standalone data belongs to carlos-emr and can advance independently
      # of the pinned CLI release. Its supported exporter refreshes only the
      # generated data block in a disposable copy; code and tests stay pinned.
      - name: Export current standalone data into a pinned CLI test copy
        run: >-
          python3 scripts/ci/prepare-cli-manifest-test-copy.py
          "$CARLOS_CTL_SRC" "$RUNNER_TEMP/carlos-ctl-current-data" "$GITHUB_WORKSPACE"
      - name: Pinned CLI runtime code with current exported standalone data
        working-directory: ${{ runner.temp }}/carlos-ctl-current-data
        env:
          CARLOS_SRC: ${{ github.workspace }}
          CARLOS_CTL_SRC: ${{ runner.temp }}/carlos-ctl-current-data
          PYTHONPATH: ${{ runner.temp }}/carlos-ctl-current-data
          PYTHONDONTWRITEBYTECODE: '1'
        run: |
          test_status=0
          python3 -m unittest discover -s tests -t . || test_status=$?
          python3 "$GITHUB_WORKSPACE/scripts/ci/prepare-cli-manifest-test-copy.py" --verify \
            "$GITHUB_WORKSPACE/.carlos-ctl" "$RUNNER_TEMP/carlos-ctl-current-data" "$GITHUB_WORKSPACE"
          exit "$test_status"
