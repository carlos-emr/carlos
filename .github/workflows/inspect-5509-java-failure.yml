name: Classify preserved EBS peer resolver failure
on:
  push:
    branches: [diagnostics/5509-ebs-failure]
permissions:
  actions: read
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Classify resolver failures without publishing raw logs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import os, re, urllib.request
          url = 'https://api.github.com/repos/carlos-emr/carlos/actions/jobs/125332170753/logs'
          req = urllib.request.Request(url, headers={'Accept': 'application/vnd.github+json', 'X-GitHub-Api-Version': '2022-11-28'})
          req.add_unredirected_header('Authorization', 'Bearer ' + os.environ['GH_TOKEN'])
          with urllib.request.urlopen(req, timeout=60) as response:
              data = response.read(64 * 1024 * 1024 + 1)
          if len(data) > 64 * 1024 * 1024:
              raise RuntimeError('Log exceeds diagnostic limit')
          text = data.decode('utf-8', errors='replace')
          def note(text):
              safe = text.replace('%', '%25').replace('\r', '%0D').replace('\n', '%0A')
              print('::notice title=Resolver failure classification::' + safe)
          snippets = [text[m.start():m.start()+30000] for m in re.finditer('Synthetic EBS peer failed', text)]
          seen = set()
          count = 0
          for snippet in snippets:
              for match in re.finditer(r'org\.apache\.xml\.security\.utils\.resolver\.ResourceResolverException:([^\n]*)', snippet):
                  message = match.group(1)
                  categories = []
                  for label, pattern in [
                      ('NO_RESOLVER', r'no resolver|could not find a resolver'),
                      ('MISSING_ELEMENT_ID', r'cannot resolve element|cannot find.*element'),
                      ('DUPLICATE_ID', r'multiple.*same.*id|duplicate'),
                      ('MISSING_ATTACHMENT', r'attachment.*not found|no attachment|cannot.*attachment'),
                      ('UNSUPPORTED_PROTOCOL', r'unknown protocol|no protocol|unsupported protocol'),
                      ('RESOLVER_NOT_THREAD_SAFE', r'thread.safe'),
                  ]:
                      if re.search(pattern, message, re.I): categories.append(label)
                  schemes = [s for s in ('cid:', 'http:', 'https:', 'file:') if s in message]
                  tail = snippet[match.end():match.end()+6000]
                  frames = re.findall(r'at ([\w.$]+)\(([^)]*\.java:\d+)\)', tail)[:10]
                  details = ['categories=' + ','.join(categories or ['UNCLASSIFIED']), 'uri_schemes=' + ','.join(schemes)]
                  details.extend(method + ' (' + location + ')' for method, location in frames)
                  safe = ' | '.join(details)
                  if safe not in seen:
                      note(safe); seen.add(safe); count += 1
          note('Fixture exception markers=' + str(len(snippets)) + '; distinct resolver classifications=' + str(count))
          PY
