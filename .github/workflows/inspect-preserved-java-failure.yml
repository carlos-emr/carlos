name: Inspect preserved Java failure report
on:
  push:
    branches: [diagnostics/cxf-failure-055d319]
permissions:
  actions: read
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Inspect sanitized artifact from run 41266015612
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import hashlib, io, os, re, urllib.request, zipfile
          import xml.etree.ElementTree as ET
          url = 'https://api.github.com/repos/carlos-emr/carlos/actions/artifacts/13067701489/zip'
          request = urllib.request.Request(url, headers={'Accept': 'application/vnd.github+json', 'X-GitHub-Api-Version': '2022-11-28'})
          request.add_unredirected_header('Authorization', 'Bearer ' + os.environ['GH_TOKEN'])
          with urllib.request.urlopen(request, timeout=60) as response:
              data = response.read(4 * 1024 * 1024 + 1)
          if len(data) > 4 * 1024 * 1024:
              raise RuntimeError('Artifact exceeds diagnostic limit')
          expected = '99bcaaa101d91da720373a2c50b5e626fd31a0bf01ab61de0af2b27f7131795f'
          if hashlib.sha256(data).hexdigest() != expected:
              raise RuntimeError('Artifact digest differs from GitHub metadata')
          def annotate(text):
              safe = text.replace('%', '%25').replace('\r', '%0D').replace('\n', '%0A')
              print('::notice title=Preserved Java failure::' + safe)
          failures = 0
          with zipfile.ZipFile(io.BytesIO(data)) as archive:
              for entry in archive.infolist():
                  if not entry.filename.endswith('.xml'):
                      continue
                  if entry.file_size > 16 * 1024 * 1024:
                      raise RuntimeError('XML report exceeds diagnostic limit')
                  root = ET.fromstring(archive.read(entry))
                  for case in root.iter('testcase'):
                      for problem in case:
                          if problem.tag not in {'error', 'failure'}:
                              continue
                          failures += 1
                          test_id = case.get('classname', '') + '.' + case.get('name', '')
                          annotate(test_id + ' | ' + problem.tag + ' | ' + problem.get('type', ''))
                          trace = problem.text or ''
                          annotate('elapsed seconds: ' + str(float(case.get('time', '0'))))
                          for condition in ['Connection reset', 'Broken pipe', 'Socket closed', 'Unexpected end of file', 'Read timed out', 'Connection refused', 'Too many open files', 'timed out after', 'Unexpected EOF']:
                              if condition.lower() in trace.lower():
                                  annotate('network condition: ' + condition)
                          causes = re.findall(r'Caused by: ([\w.$]+)', trace)
                          frames = re.findall(r'at ([\w.$]+)\(([^)]*\.java:\d+)\)', trace)
                          for cause in causes[:8]:
                              annotate('cause class: ' + cause)
                          for method, location in frames[:8]:
                              annotate('frame: ' + method + ' (' + location + ')')
          annotate('Failing cases in preserved report: ' + str(failures))
          PY
