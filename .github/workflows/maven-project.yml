# GitHub Workflow: Check CARLOS EMR
#
# Description:
# This workflow automates the build and testing for the CARLOS EMR Maven project.
# The build, tests and JSP-compilation jobs run as independent parallel jobs:
# each compiles from a clean tree inside the dev container, so none of them
# needs the others' output. The build job is the fail-fast signal and the only
# job that saves the shared Maven dependency cache.
#
# Container Images:
# Every Maven job starts the dev container through the local composite action
# .github/actions/dev-container: it pulls the pre-built carlos-tomcat-dev image
# from ghcr.io (skipping the local build when it is available), falls back to
# building it locally otherwise, and restores the shared Maven cache. See
# container-images.yml for the workflow that builds and pushes the images.
#
# Usage:
# - Triggered by pull requests targeting the following branches:
#   - main
#   - develop
#   - experimental
#   - release/*
#
# Key Jobs:
# - build:
#   - Pulls or builds the dev container
#   - Runs `make install` to verify the project builds successfully
#   - The only job that SAVES the Maven dependency cache (the others restore)
#
# - tests (parallel, does not wait for build):
#   - Restores Maven dependencies from cache (graceful fallback if miss)
#   - Runs tests (JUnit 5) using H2 in-memory database
# - mariadb-dao-tests (parallel):
#   - Runs existing Spring DAO suites and patient-match regressions on MariaDB
#   - Uses the production dialect with the existing generated test schema
#   - Also verifies critical DAOs against a fresh Flyway-migrated schema
#
# - jspc (parallel, does not wait for build):
#   - Restores Maven dependencies from cache (graceful fallback if miss)
#   - Compiles all JSPs via the jspc Maven profile
#   - Catches JSP syntax errors and EL/tag errors that do not surface at runtime
#   - Does NOT require the database container
#
# License:
# This GitHub Workflow file is part of the Carlos EMR project and is subject
# to the licensing terms outlined in the repository's LICENSE file.
#
# Last Updated:
# September 2026

name: Check Carlos EMR

on:
  workflow_call:
    inputs:
      ref:
        description: Git ref to verify; defaults to the event commit
        required: false
        type: string
        default: ""
  pull_request:
    branches:
      - main
      - develop
      - experimental
      - staging/*
      - hotfix/*
      - release/*
      - community/*/develop
      - community/*/staging/*


# Superseded pushes to the same PR cancel the in-progress run; every other
# event gets a unique group via run_id. The slug is a literal rather than
# github.workflow on purpose: when publish-release.yml calls this workflow,
# github.* is the CALLER's context, and sharing the caller's `publish-release`
# group would deadlock the release run. A release run therefore lands in
# check-carlos-emr-<run_id> with cancel-in-progress: false. The final head of
# a PR always gets its own complete run, so no check outcome changes.
concurrency:
  group: check-carlos-emr-${{ github.event_name == 'pull_request' && github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ${{ github.repository_owner }}

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      packages: read
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref != '' && inputs.ref || github.sha }}
          persist-credentials: false

      - name: Start dev container (Maven cache restore + save)
        uses: ./.github/actions/dev-container
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          maven-cache: save

      - name: Build project (no tests)
        run: |
          docker exec carlos-tomcat-dev bash -c "
            echo '========================================='
            echo 'Building project without tests'
            echo '========================================='
            make install
          "

      - name: Compile packaged Edit Appointment servlet
        run: |
          docker exec carlos-tomcat-dev bash -c '
            bash scripts/compile-edit-appointment-jsp.sh /usr/local/tomcat/webapps/carlos
          '

      - name: Fix workspace ownership for cache save
        # The container runs as root and leaves root-owned files in the mounted
        # workspace (.m2-cache, target/**). The post-job cache save runs as the
        # runner user and re-evaluates hashFiles() across the workspace, so
        # unreadable root-owned paths can fail the job after a successful build
        # on a cold cache (sonarcloud.yml hit exactly this). Restore ownership
        # before the post steps run.
        if: always()
        run: sudo chown -R "$(id -u):$(id -g)" "$GITHUB_WORKSPACE"

  tests:
    # No dependency on the build job: make install --run-tests compiles from
    # scratch itself, and the Maven cache it restores has a prefix fallback, so
    # waiting for build only added its ~4.5 min to the critical path.
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    permissions:
      contents: read
      packages: read
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref != '' && inputs.ref || github.sha }}
          persist-credentials: false

      - name: Start dev container (Maven cache restore-only)
        uses: ./.github/actions/dev-container
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          maven-cache: restore

      - name: Run tests
        run: |
          docker exec carlos-tomcat-dev bash -c "
            echo '========================================='
            echo 'Running Tests (JUnit 5 with H2)'
            echo '========================================='
            make install --run-tests
          "

      - name: Exercise and verify permission-sensitive startup refusal
        run: |
          docker exec carlos-tomcat-dev bash scripts/check-ci-permission-test.sh
          python3 -m pip install --require-hashes -r scripts/ci/requirements.txt
          python3 scripts/ci/verify-h2-reports.py --reports target/surefire-reports --permission-reports target/ci-permission-reports

      - name: Exercise removed-library compatibility oracles
        run: |
          docker exec carlos-tomcat-dev bash -euc '
            for artifact in com.eatthepath:java-otp:0.4.0 org.apache.ant:ant:1.10.18 com.google.zxing:javase:3.5.4 org.apache.velocity.tools:velocity-tools-generic:3.1; do
              mvn -B -ntp dependency:get -Dartifact="$artifact" -Dtransitive=false
            done
            mvn -B -ntp test -Dtest=LegacyDependencyCompatibilityUnitTest -Dtest.forkCount=1 \
              -Dlegacy.compatibility.repo=/root/.m2/repository -Dtest.reportsDirectory=target/ci-legacy-reports
          '
          python3 scripts/ci/verify-h2-reports.py --legacy-reports target/ci-legacy-reports

      - name: Verify demographic dates in non-UTC JVMs
        run: |
          for timezone in America/Toronto Asia/Tokyo; do
            docker exec -e JAVA_TOOL_OPTIONS="-Duser.timezone=$timezone" carlos-tomcat-dev \
              mvn --batch-mode test -Dtest.forkCount=1 \
              -Dtest=DemographicBirthDayTimezoneUnitTest,DemographicBirthDayPropertyUnitTest,DemographicServiceEndpointTest,DemographicConverterUnitTest,SmartDateModuleRoundTripUnitTest,RestBirthDateMapperConfigurationUnitTest
          done

      - name: Verify Rourke PDFs with alternate fonts and cache permissions
        run: docker exec carlos-tomcat-dev bash scripts/check-rourke-fonts.sh

      - name: Prepare sanitized Java test reports
        if: always()
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import os
          import shutil
          import xml.etree.ElementTree as ET

          source = Path("target/surefire-reports")
          destination = Path(os.environ["RUNNER_TEMP"]) / "carlos-ci-surefire-reports"
          if destination.exists():
              shutil.rmtree(destination)
          destination.mkdir(parents=True)
          reports = sorted(source.glob("TEST-*.xml"))
          for extra in ("ci-permission-reports", "ci-legacy-reports"):
              reports.extend(sorted((Path("target") / extra).glob("TEST-*.xml")))
          if not reports:
              print("::warning::No Surefire XML reports were generated; no Java failure inventory is available.")
          for report in reports:
              try:
                  tree = ET.parse(report)
              except ET.ParseError:
                  print(f"::warning::Cannot sanitize {report.name}; no unsanitized report will be published.")
                  raise SystemExit(1)
              root = tree.getroot()
              # Never publish JVM/configuration properties or captured console output.
              for parent in list(root.iter()):
                  for child in list(parent):
                      if child.tag.rsplit("}", 1)[-1] in {"properties", "system-out", "system-err"}:
                          parent.remove(child)
              report_destination = destination if report.parent == source else destination / report.parent.name
              report_destination.mkdir(parents=True, exist_ok=True)
              tree.write(report_destination / report.name, encoding="utf-8", xml_declaration=True)
              # Derive concise TXT diagnostics from the safe copy, not console-output files.
              lines = [root.get("name", report.stem), " ".join(
                  f"{key}={root.get(key, 'unknown')}" for key in ("tests", "failures", "errors", "skipped", "time"))]
              for case in root.iter():
                  if case.tag.rsplit("}", 1)[-1] != "testcase":
                      continue
                  for problem in case:
                      kind = problem.tag.rsplit("}", 1)[-1]
                      if kind not in {"failure", "error"}:
                          continue
                      # Publish identifiers only; messages/stacks stay in the sanitized artifact.
                      test_id = f"{case.get('classname', '')}.{case.get('name', '')}"
                      escaped_id = test_id.replace("%", "%25").replace("\r", "%0D").replace("\n", "%0A")
                      print(f"::error title=Java test {kind}::{escaped_id}")
                      lines.extend([f"{kind.upper()}: {case.get('classname', '')}.{case.get('name', '')}",
                                    problem.get("type", ""), problem.get("message", ""), problem.text or ""])
              (report_destination / (report.stem.removeprefix("TEST-") + ".txt")).write_text(
                  "\n".join(lines) + "\n", encoding="utf-8")
          print(f"Prepared {len(reports)} sanitized Surefire XML/TXT report pairs")
          PY

      - name: Preserve Java test reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: java-test-reports
          path: ${{ runner.temp }}/carlos-ci-surefire-reports/
          if-no-files-found: warn
          retention-days: 14

      - name: Preserve synthetic Rourke rendering evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: rourke-font-rendering
          path: |
            target/rourke-font-matrix/
            target/rourke-pdf/
          if-no-files-found: ignore
          retention-days: 14

  mariadb-dao-tests:
    name: MariaDB DAO integration tests
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    permissions:
      contents: read
      packages: read
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref != '' && inputs.ref || github.sha }}
          persist-credentials: false

      - name: Start dev container (Maven cache restore-only)
        uses: ./.github/actions/dev-container
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          maven-cache: restore
          extra-run-args: --add-host=host.docker.internal:host-gateway

      - name: Start physical MariaDB with the packaged page-size invariant
        run: |
          set -euo pipefail
          docker run -d --name carlos-ci-db -p 3306:3306 \
            -e MARIADB_ALLOW_EMPTY_ROOT_PASSWORD=1 mariadb:11.8.8 \
            --innodb-page-size=32768 --sql-mode= --innodb-strict-mode=OFF
          ready=false
          for attempt in $(seq 1 30); do
            if docker exec carlos-ci-db healthcheck.sh --connect --innodb_initialized >/dev/null 2>&1; then
              ready=true
              break
            fi
            sleep 2
          done
          test "$ready" = true
          test "$(docker exec carlos-ci-db mariadb -uroot -N -e 'SELECT @@innodb_page_size')" = 32768

      - name: Run existing DAO and critical transaction suites on physical MariaDB
        run: |
          # Schema-specific cases run in the next lane; this lane must have no skips.
          docker exec -e CARLOS_TEST_MARIADB_DAO=true \
            -e CARLOS_TEST_MARIADB_SCHEMA=generated \
            -e CARLOS_TEST_MARIADB_URL=jdbc:mariadb://host.docker.internal:3306/ \
            carlos-tomcat-dev mvn --batch-mode --no-transfer-progress test jacoco:report \
            '-Dtest=*Dao*IntegrationTest,*DAO*IntegrationTest,PatientEndYearStatementIntegrationTest,PatientEndYearStatementTransactionIntegrationTest,QueryReturnTypeIntegrationTest,JdbcConnectorMariaDbIntegrationTest,MeasurementPatientMatchMariaDbIntegrationTest,ConsultationListProjectionIntegrationTest,BCAR2020FormSaveTransactionIntegrationTest,RxCorrectionSaveRollbackIntegrationTest,DemographicMergeMariaDbIntegrationTest,DemographicIdentifierPreservationMariaDbIntegrationTest,ScheduleSyncMariaDbIntegrationTest,Growth0To36FormPersistenceIntegrationTest' \
            '-Dgroups=spring-context | mariadb-native' -DexcludedGroups=flyway-schema -Dtest.forkCount=3 \
            -Djacoco.destFile=target/jacoco-mariadb-generated.exec -Djacoco.dataFile=target/jacoco-mariadb-generated.exec \
            -Dtest.coverageDirectory=target/coverage-mariadb/generated
          docker exec carlos-tomcat-dev test -s target/coverage-mariadb/generated/jacoco.xml

      - name: Verify critical DAO paths against the Flyway schema
        if: always()
        run: |
          docker exec -e CARLOS_TEST_MARIADB_DAO=true -e CARLOS_TEST_MARIADB_SCHEMA=flyway \
            -e CARLOS_TEST_MARIADB_URL=jdbc:mariadb://host.docker.internal:3306/ \
            carlos-tomcat-dev mvn --batch-mode --no-transfer-progress jacoco:prepare-agent surefire:test jacoco:report \
            -Dtest=SoapTokenHousekeepingDaoIntegrationTest,FixedJasperReportDaoIntegrationTest,PatientEndYearStatementIntegrationTest,PatientEndYearStatementTransactionIntegrationTest,LegacyLabNativeMariaDbIntegrationTest,LegacyLabUploadDaoIntegrationTest,LabRoutingLookupDaoIntegrationTest,ConsultationArchiveDaoIntegrationTest,ArchiveAuditTimestampIntegrationTest,CaseManagementNoteLockMariaDbIntegrationTest,MariaDbDaoHarnessIntegrationTest,MeasurementDaoIntegrationTest,MeasurementsExtDaoIntegrationTest,ProviderLabRoutingDaoIntegrationTest,BillingONCHeader1DaoIntegrationTest,CaseManagementIssueDAOIntegrationTest,ConsultationListProjectionIntegrationTest,RxCorrectionSaveRollbackIntegrationTest,DemographicMergeMariaDbIntegrationTest,DemographicIdentifierPreservationMariaDbIntegrationTest,ScheduleSyncMariaDbIntegrationTest,Growth0To36FormPersistenceIntegrationTest \
            '-Dgroups=spring-context | mariadb-native' -Dtest.forkCount=1 -Dcarlos.test.schema.expected=flyway \
            -Dsurefire.reportNameSuffix=flyway \
            -Djacoco.destFile=target/jacoco-mariadb-flyway.exec -Djacoco.dataFile=target/jacoco-mariadb-flyway.exec \
            -Dtest.coverageDirectory=target/coverage-mariadb/flyway
          docker exec carlos-tomcat-dev test -s target/coverage-mariadb/flyway/jacoco.xml

      - name: Verify BC billing, encounter and day-sheet transactions against the Flyway schema
        if: always()
        run: |
          docker exec -e CARLOS_TEST_MARIADB_DAO=true -e CARLOS_TEST_MARIADB_SCHEMA=flyway \
            -e CARLOS_TEST_MARIADB_PROVINCE=bc \
            -e CARLOS_TEST_MARIADB_URL=jdbc:mariadb://host.docker.internal:3306/ \
            carlos-tomcat-dev mvn --batch-mode --no-transfer-progress jacoco:prepare-agent surefire:test jacoco:report \
            -Dtest=SoapTokenHousekeepingDaoIntegrationTest,FixedJasperReportDaoIntegrationTest,PatientEndYearStatementTransactionIntegrationTest,LegacyLabNativeMariaDbIntegrationTest,LabRoutingLookupDaoIntegrationTest,ConsultationArchiveDaoIntegrationTest,ArchiveAuditTimestampIntegrationTest,CaseManagementNoteLockMariaDbIntegrationTest,BcBillingNativeMariaDbIntegrationTest,BcBillingDaoTransactionIntegrationTest,BCAR2020FormSaveTransactionIntegrationTest,DemographicMergeMariaDbIntegrationTest,DemographicIdentifierPreservationMariaDbIntegrationTest,ScheduleSyncMariaDbIntegrationTest,FormXmlImportServiceIntegrationTest,EFormApColumnLookupIntegrationTest,AppointmentDaySheetServiceIntegrationTest,AntenatalReportDaoIntegrationTest,EFormGroupDaoIntegrationTest,Growth0To36FormPersistenceIntegrationTest \
            '-Dgroups=spring-context | mariadb-native' -Dtest.forkCount=1 \
            -Dsurefire.reportNameSuffix=bc-flyway \
            -Djacoco.destFile=target/jacoco-mariadb-bc-flyway.exec -Djacoco.dataFile=target/jacoco-mariadb-bc-flyway.exec \
            -Dtest.coverageDirectory=target/coverage-mariadb/bc-flyway
          docker exec carlos-tomcat-dev test -s target/coverage-mariadb/bc-flyway/jacoco.xml

      - name: Verify MariaDB coverage and summarize results
        if: always()
        # Maven's container creates root-owned target directories; write the
        # sanitized artifact in the runner's own temporary directory.
        run: |
          python3 -m venv "$RUNNER_TEMP/mariadb-report-venv"
          "$RUNNER_TEMP/mariadb-report-venv/bin/python" -m pip install \
            --disable-pip-version-check --require-hashes -r scripts/ci/requirements.txt
          "$RUNNER_TEMP/mariadb-report-venv/bin/python" scripts/ci/verify-mariadb-dao-reports.py \
            --output "$RUNNER_TEMP/mariadb-dao-test-summary.txt"

      - name: Preserve sanitized MariaDB test results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: mariadb-dao-test-results
          path: |
            ${{ runner.temp }}/mariadb-dao-test-summary.txt
            target/coverage-mariadb/**/jacoco.xml
          if-no-files-found: ignore
          retention-days: 14

      - name: Stop the owned MariaDB test server
        if: always()
        run: docker rm -f carlos-ci-db

  encode-lint:
    # Encoder null-safety lint — catches two silent-failure classes:
    #   A) <e:forXxx> tags used without the owasp.encoder.jakarta taglib
    #      directive declared (Jasper silently drops the tag output).
    #   B) Direct <e:forXxx>, ${e:forXxx()}, or Encode.forXxx() usage where
    #      the null-safe CARLOS wrappers are available.
    # Does not need the docker image or Maven cache — runs in ~10 seconds.
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref != '' && inputs.ref || github.sha }}
          persist-credentials: false
      - name: Set up JDK 25 for hermetic source checks
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v4.7.1
        with:
          distribution: temurin
          java-version: '25'
      - name: Run encoder null-safety lint
        run: bash scripts/lint/check-encoder-null-safety.sh
      - name: Run encoder null-safety lint fixtures
        run: bash scripts/lint/test-encoder-null-safety.sh
      - name: Run SecurityException message convention lint
        run: bash scripts/lint/check-security-exception-message-convention.sh
      - name: Run SecurityException message convention lint fixtures
        run: bash scripts/lint/test-security-exception-message-convention.sh
      - name: Run Struts DTD validation
        run: bash scripts/lint/check-struts-dtd.sh
  jspc:
    # No dependency on the build job, for the same reason as the tests job.
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      packages: read
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref != '' && inputs.ref || github.sha }}
          persist-credentials: false

      - name: Start dev container (Maven cache restore-only)
        uses: ./.github/actions/dev-container
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          maven-cache: restore

      - name: Compile JSPs
        run: |
          docker exec carlos-tomcat-dev bash -ec "
            echo '========================================='
            echo 'Compiling JSPs (jspc profile)'
            echo '========================================='
            make jspc
            mvn -B -ntp dependency:build-classpath -DincludeScope=compile -Dmdep.outputFile=target/jsp-classpath.txt
            python3 scripts/check-jsp-directives.py --classpath-file target/jsp-classpath.txt
          "
