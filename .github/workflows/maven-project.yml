# GitHub Workflow: Check CARLOS EMR
#
# Description:
# This workflow automates the build and testing for the CARLOS EMR Maven project.
# It uses a parallelized approach: build first, then run tests and JSP compilation
# in parallel.
#
# Container Images:
# Every Maven job starts the dev container through the local composite action
# .github/actions/dev-container: it pulls the pre-built carlos-tomcat-dev image
# from ghcr.io (skipping the local build when it is available), falls back to
# building it locally otherwise, and restores the shared Maven cache. See
# container-images.yml for the workflow that builds and pushes the images.
#
# Usage:
# - Triggered by pull requests targeting the following branches:
#   - main
#   - develop
#   - experimental
#   - release/*
#
# Key Jobs:
# - build:
#   - Pulls or builds the dev container
#   - Runs `make install` to verify the project builds successfully
#   - The only job that SAVES the Maven dependency cache (the others restore)
#
# - tests (parallel):
#   - Restores Maven dependencies from cache (graceful fallback if miss)
#   - Runs tests (JUnit 5) using H2 in-memory database
#   - Does NOT require the database container
#
# - jspc (parallel):
#   - Restores Maven dependencies from cache (graceful fallback if miss)
#   - Compiles all JSPs via the jspc Maven profile
#   - Catches JSP syntax errors and EL/tag errors that do not surface at runtime
#   - Does NOT require the database container
#
# License:
# This GitHub Workflow file is part of the Carlos EMR project and is subject
# to the licensing terms outlined in the repository's LICENSE file.
#
# Last Updated:
# September 2026

name: Check Carlos EMR

on:
  workflow_call:
    inputs:
      ref:
        description: Git ref to verify; defaults to the event commit
        required: false
        type: string
        default: ""
  pull_request:
    branches:
      - main
      - develop
      - experimental
      - staging/*
      - hotfix/*
      - release/*
      - community/*/develop
      - community/*/staging/*


env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ${{ github.repository_owner }}

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: read
    steps:
      - name: Checkout code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          ref: ${{ inputs.ref != '' && inputs.ref || github.sha }}
          persist-credentials: false

      - name: Start dev container (Maven cache restore + save)
        uses: ./.github/actions/dev-container
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          maven-cache: save

      - name: Build project (no tests)
        run: |
          docker exec carlos-tomcat-dev bash -c "
            echo '========================================='
            echo 'Building project without tests'
            echo '========================================='
            make install
          "

      - name: Fix workspace ownership for cache save
        # The container runs as root and leaves root-owned files in the mounted
        # workspace (.m2-cache, target/**). The post-job cache save runs as the
        # runner user and re-evaluates hashFiles() across the workspace, so
        # unreadable root-owned paths can fail the job after a successful build
        # on a cold cache (sonarcloud.yml hit exactly this). Restore ownership
        # before the post steps run.
        if: always()
        run: sudo chown -R "$(id -u):$(id -g)" "$GITHUB_WORKSPACE"

  tests:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: read
      packages: read
    steps:
      - name: Checkout code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          ref: ${{ inputs.ref != '' && inputs.ref || github.sha }}
          persist-credentials: false

      - name: Start dev container (Maven cache restore-only)
        uses: ./.github/actions/dev-container
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          maven-cache: restore

      - name: Run tests
        run: |
          docker exec carlos-tomcat-dev bash -c "
            echo '========================================='
            echo 'Running Tests (JUnit 5 with H2)'
            echo '========================================='
            make install --run-tests
          "

  encode-lint:
    # Encoder null-safety lint — catches two silent-failure classes:
    #   A) <e:forXxx> tags used without the owasp.encoder.jakarta taglib
    #      directive declared (Jasper silently drops the tag output).
    #   B) Direct <e:forXxx>, ${e:forXxx()}, or Encode.forXxx() usage where
    #      the null-safe CARLOS wrappers are available.
    # Does not need the docker image or Maven cache — runs in ~10 seconds.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          ref: ${{ inputs.ref != '' && inputs.ref || github.sha }}
          persist-credentials: false
      - name: Set up JDK 21 for hermetic source checks
        uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9 # v4.7.1
        with:
          distribution: temurin
          java-version: '21'
      - name: Run encoder null-safety lint
        run: bash scripts/lint/check-encoder-null-safety.sh
      - name: Run encoder null-safety lint fixtures
        run: bash scripts/lint/test-encoder-null-safety.sh
      - name: Run SecurityException message convention lint
        run: bash scripts/lint/check-security-exception-message-convention.sh
      - name: Run SecurityException message convention lint fixtures
        run: bash scripts/lint/test-security-exception-message-convention.sh
      - name: Run Struts DTD validation
        run: bash scripts/lint/check-struts-dtd.sh
  jspc:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: read
    steps:
      - name: Checkout code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          ref: ${{ inputs.ref != '' && inputs.ref || github.sha }}
          persist-credentials: false

      - name: Start dev container (Maven cache restore-only)
        uses: ./.github/actions/dev-container
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          maven-cache: restore

      - name: Compile JSPs
        run: |
          docker exec carlos-tomcat-dev bash -c "
            echo '========================================='
            echo 'Compiling JSPs (jspc profile)'
            echo '========================================='
            make jspc
          "
