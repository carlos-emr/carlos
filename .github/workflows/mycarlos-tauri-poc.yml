name: myCarlos Tauri POC

on:
  pull_request:
    paths:
      - "mycarlos-tauri-poc/**"
      - ".github/workflows/mycarlos-tauri-poc.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mycarlos-tauri-poc-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: mycarlos-tauri-poc

jobs:
  web:
    name: Web UI and browser tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.14.0
          cache: npm
          cache-dependency-path: mycarlos-tauri-poc/package-lock.json
      - run: npm ci
      - run: npm run check
      - run: npm test
      - run: npm run test:dev-data
      - run: npm run build
      - name: Install Playwright Chromium with bounded mirror retries
        run: |
          for attempt in 1 2 3; do
            if npx playwright install --with-deps chromium; then
              exit 0
            fi
            if [ "$attempt" -eq 3 ]; then
              exit 1
            fi
            sleep $((attempt * 10))
          done
      - run: npm run test:e2e
      - name: Upload responsive screenshots and traces
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: mycarlos-browser-evidence
          path: |
            mycarlos-tauri-poc/test-results
            mycarlos-tauri-poc/playwright-report
          if-no-files-found: ignore
          retention-days: 7

  desktop:
    # Linux is not an initial supported platform while the documented glib advisory is unresolved.
    # Keep this build as a compatibility monitor so an upstream resolution remains visible.
    name: Linux compatibility monitor (unsupported)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Linux webview dependencies
        run: |
          for attempt in 1 2 3; do
            if sudo apt-get update && sudo apt-get install -y \
              libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf; then
              exit 0
            fi
            if [ "$attempt" -eq 3 ]; then
              exit 1
            fi
            sleep $((attempt * 10))
          done
        working-directory: .
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.14.0
          cache: npm
          cache-dependency-path: mycarlos-tauri-poc/package-lock.json
      - name: Install pinned Rust toolchain
        run: >-
          rustup toolchain install 1.98.0 --profile minimal
          --component rustfmt --component clippy
      - run: npm ci
      - run: cargo fmt --manifest-path src-tauri/Cargo.toml -- --check
      - run: cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings
      - run: cargo test --manifest-path src-tauri/Cargo.toml
      - run: npm run tauri build -- --debug --bundles deb
      - name: Report desktop artifact sizes
        run: find src-tauri/target/debug/bundle -type f -printf '%p %k KB\n' | sort
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: mycarlos-linux-evaluation-debug
          path: mycarlos-tauri-poc/src-tauri/target/debug/bundle
          retention-days: 7

  windows:
    # Installer signing and release packaging are separate gates. This job validates the native
    # application and vault on Windows without presenting an unsigned NSIS installer as evidence.
    name: Windows native build
    runs-on: windows-2025
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.14.0
          cache: npm
          cache-dependency-path: mycarlos-tauri-poc/package-lock.json
      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.98.0 --profile minimal
      - run: npm ci
      - run: cargo test --manifest-path src-tauri/Cargo.toml
      - run: npm run tauri build -- --debug --no-bundle

  macos:
    name: macOS native build
    runs-on: macos-15
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.14.0
          cache: npm
          cache-dependency-path: mycarlos-tauri-poc/package-lock.json
      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.98.0 --profile minimal
      - run: npm ci
      - run: npm run tauri build -- --debug --bundles app

  android:
    name: Android debug build
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.14.0
          cache: npm
          cache-dependency-path: mycarlos-tauri-poc/package-lock.json
      - uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9 # v4.7.1
        with:
          distribution: temurin
          java-version: 17
      - name: Configure hosted Android NDK
        run: |
          test -d "$ANDROID_NDK_LATEST_HOME"
          echo "NDK_HOME=$ANDROID_NDK_LATEST_HOME" >> "$GITHUB_ENV"
      - name: Install pinned Rust toolchain and Android target
        run: >-
          rustup toolchain install 1.98.0 --profile minimal
          --target aarch64-linux-android
      - run: npm ci
      - run: npm run tauri android init -- --ci
      - name: Disable Android cloud and device-transfer backup
        shell: bash
        run: >-
          perl -0pi -e
          's/<application\b/<application android:allowBackup="false" android:fullBackupContent="false"/'
          src-tauri/gen/android/app/src/main/AndroidManifest.xml
      - name: Verify Android backup remains disabled
        run: grep -q 'android:allowBackup="false"' src-tauri/gen/android/app/src/main/AndroidManifest.xml
      - run: npm run tauri android build -- --debug --apk --target aarch64 --ci
      - name: Report Android artifact sizes
        run: find src-tauri/gen/android -type f -name '*.apk' -printf '%p %k KB\n' | sort
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: mycarlos-android-debug
          path: mycarlos-tauri-poc/src-tauri/gen/android/app/build/outputs/apk
          retention-days: 7

  ios:
    name: iOS simulator debug build
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.14.0
          cache: npm
          cache-dependency-path: mycarlos-tauri-poc/package-lock.json
      - name: Install pinned Rust toolchain and iOS simulator target
        run: >-
          rustup toolchain install 1.98.0 --profile minimal
          --target aarch64-apple-ios-sim
      - run: npm ci
      - run: npm run tauri ios init -- --ci
      - run: npm run tauri ios build -- --debug --target aarch64-sim --no-sign --ci
      - name: Report iOS simulator artifact sizes
        run: find src-tauri/gen/apple/build -type d -name '*.app' -exec du -sh {} \;
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: mycarlos-ios-simulator-debug
          path: mycarlos-tauri-poc/src-tauri/gen/apple/build/**/*.app
          if-no-files-found: error
          retention-days: 7
