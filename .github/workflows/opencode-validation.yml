# Offline-provider tests: no repository write token, App key, or paid API calls.
name: CARLOS OpenCode Validation
on:
  pull_request:
    paths:
      - '.github/workflows/opencode*.yml'
      - 'scripts/opencode/**'
      - 'scripts/opencode-workflow.test.js'
permissions:
  contents: read
concurrency:
  group: opencode-validation-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22.23.3'
          package-manager-cache: false
      - name: Test policy and publication
        run: node --test scripts/opencode-workflow.test.js
      - name: Install verified CLI
        env:
          TOOLS_DIR: ${{ runner.temp }}/opencode-tools
        run: node scripts/opencode/worker.cjs install
      - name: Exercise streaming and tool calls inside the isolated runtime
        env:
          TOOLS_DIR: ${{ runner.temp }}/opencode-tools
        run: node scripts/opencode/container-smoke.cjs
