# Licensed under the repository's LICENSE.
# issue_comment loads this workflow from main; inference is explicitly opt-in.
name: CARLOS OpenCode
run-name: OpenCode ${{ format('#{0} comment {1}', github.event.issue.number, github.event.comment.id) }}

on:
  issue_comment:
    types: [created]

permissions: {}

# queue:max prevents newer requests from silently replacing the pending request.
concurrency:
  group: >-
    ${{ github.event.comment.user.type == 'User' &&
      (startsWith(github.event.comment.body, '/oc') || startsWith(github.event.comment.body, '/opencode'))
      && format('carlos-opencode-{0}-{1}', github.repository, github.event.issue.number)
      || format('carlos-opencode-ignored-{0}', github.run_id) }}
  queue: max
  cancel-in-progress: false

env:
  OPENCODE_ENABLED: ${{ vars.OPENCODE_ENABLED }}
  OPENCODE_ALLOWED_USERS: ${{ vars.OPENCODE_ALLOWED_USERS }}
  OPENCODE_MODEL_ALLOWED_USERS: ${{ vars.OPENCODE_MODEL_ALLOWED_USERS }}
  OPENCODE_MODELS: ${{ vars.OPENCODE_MODELS }}
  OPENCODE_APP_ID: ${{ vars.OPENCODE_APP_ID }}
  OPENCODE_REVIEW_PASSES: ${{ vars.OPENCODE_REVIEW_PASSES }}

jobs:
  authorize:
    concurrency:
      group: carlos-opencode-status-${{ github.run_id }}
      queue: max
      cancel-in-progress: false
    if: >-
      github.repository == 'carlos-emr/carlos' &&
      github.event.comment.user.type == 'User' &&
      (startsWith(github.event.comment.body, '/oc') || startsWith(github.event.comment.body, '/opencode'))
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      actions: read
      contents: read
      issues: write
      pull-requests: read
    outputs:
      accepted: ${{ steps.gate.outputs.accepted }}
      source: ${{ steps.gate.outputs.source }}
      baseline: ${{ steps.gate.outputs.baseline }}
      provider: ${{ steps.gate.outputs.provider }}
      model: ${{ steps.gate.outputs.model }}
      alias: ${{ steps.gate.outputs.alias }}
      adapter: ${{ steps.gate.outputs.adapter }}
      reviewPasses: ${{ steps.gate.outputs.reviewPasses }}
      base: ${{ steps.gate.outputs.base }}
      branch: ${{ steps.gate.outputs.branch }}
      attempt: ${{ steps.gate.outputs.attempt }}
      mode: ${{ steps.gate.outputs.mode }}
    steps:
      - name: Check out trusted controller
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22.23.3'
          package-manager-cache: false
      - name: Authorize and resolve request
        id: gate
        env:
          OPENCODE_PROVIDER_1_CONFIGURED: ${{ secrets.OPENCODE_PROVIDER_1_API_KEY != '' && secrets.OPENCODE_PROVIDER_1_BASE_URL != '' }}
          OPENCODE_PROVIDER_2_CONFIGURED: ${{ secrets.OPENCODE_PROVIDER_2_API_KEY != '' && secrets.OPENCODE_PROVIDER_2_BASE_URL != '' }}
          OPENCODE_PROVIDER_3_CONFIGURED: ${{ secrets.OPENCODE_PROVIDER_3_API_KEY != '' && secrets.OPENCODE_PROVIDER_3_BASE_URL != '' }}
          GH_TOKEN: ${{ github.token }}
          REQUEST_DIR: ${{ runner.temp }}/opencode-request
        run: node scripts/opencode/controller.cjs gate
      - name: Save authorized request
        if: steps.gate.outputs.accepted == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: opencode-request-${{ github.run_attempt }}
          path: ${{ runner.temp }}/opencode-request/request.json
          if-no-files-found: error
          retention-days: 1

  generate:
    needs: authorize
    if: needs.authorize.outputs.accepted == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      actions: read
      contents: read
      issues: read
      pull-requests: read
    outputs:
      attempt: ${{ steps.generation.outputs.attempt }}
    steps:
      - name: Check out trusted controller
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          path: control
          persist-credentials: false
      - name: Check out exact task source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.authorize.outputs.source }}
          path: source
          persist-credentials: false
      - name: Check out exact PR merge base for review
        if: needs.authorize.outputs.baseline != ''
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.authorize.outputs.baseline }}
          path: baseline
          persist-credentials: false
      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22.23.3'
          package-manager-cache: false
      - name: Load authorized request
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          digest-mismatch: error
          name: opencode-request-${{ needs.authorize.outputs.attempt }}
          path: ${{ runner.temp }}/opencode-request
      - name: Install and verify pinned CLI
        env:
          TOOLS_DIR: ${{ runner.temp }}/opencode-tools
        run: node control/scripts/opencode/worker.cjs install
      - name: Generate in isolated container
        id: generation
        env:
          OPENCODE_PROVIDER_1_CONFIGURED: ${{ secrets.OPENCODE_PROVIDER_1_API_KEY != '' && secrets.OPENCODE_PROVIDER_1_BASE_URL != '' }}
          OPENCODE_PROVIDER_2_CONFIGURED: ${{ secrets.OPENCODE_PROVIDER_2_API_KEY != '' && secrets.OPENCODE_PROVIDER_2_BASE_URL != '' }}
          OPENCODE_PROVIDER_3_CONFIGURED: ${{ secrets.OPENCODE_PROVIDER_3_API_KEY != '' && secrets.OPENCODE_PROVIDER_3_BASE_URL != '' }}
          GH_TOKEN: ${{ github.token }}
          EXPECTED_BASE: ${{ needs.authorize.outputs.base }}
          EXPECTED_BRANCH: ${{ needs.authorize.outputs.branch }}
          OPENCODE_API_KEY: ${{ needs.authorize.outputs.provider == '1' && secrets.OPENCODE_PROVIDER_1_API_KEY || needs.authorize.outputs.provider == '2' && secrets.OPENCODE_PROVIDER_2_API_KEY || needs.authorize.outputs.provider == '3' && secrets.OPENCODE_PROVIDER_3_API_KEY || '' }}
          OPENCODE_API_BASE_URL: ${{ needs.authorize.outputs.provider == '1' && secrets.OPENCODE_PROVIDER_1_BASE_URL || needs.authorize.outputs.provider == '2' && secrets.OPENCODE_PROVIDER_2_BASE_URL || needs.authorize.outputs.provider == '3' && secrets.OPENCODE_PROVIDER_3_BASE_URL || '' }}
          EXPECTED_SOURCE: ${{ needs.authorize.outputs.source }}
          EXPECTED_BASELINE: ${{ needs.authorize.outputs.baseline }}
          EXPECTED_PROVIDER: ${{ needs.authorize.outputs.provider }}
          EXPECTED_MODEL: ${{ needs.authorize.outputs.model }}
          EXPECTED_ALIAS: ${{ needs.authorize.outputs.alias }}
          EXPECTED_ADAPTER: ${{ needs.authorize.outputs.adapter }}
          EXPECTED_REVIEW_PASSES: ${{ needs.authorize.outputs.reviewPasses }}
          SOURCE_DIR: ${{ github.workspace }}/source
          BASELINE_SOURCE_DIR: ${{ github.workspace }}/baseline
          BASELINE_WORK_DIR: ${{ runner.temp }}/opencode-baseline
          WORK_DIR: ${{ runner.temp }}/opencode-work
          TOOLS_DIR: ${{ runner.temp }}/opencode-tools
          REQUEST_DIR: ${{ runner.temp }}/opencode-request
          RESULT_DIR: ${{ runner.temp }}/opencode-result
        run: |
          node control/scripts/opencode/controller.cjs verify
          node control/scripts/opencode/worker.cjs
          echo "attempt=$GITHUB_RUN_ATTEMPT" >> "$GITHUB_OUTPUT"
      - name: Save validated result
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: opencode-result-${{ github.run_attempt }}
          path: ${{ runner.temp }}/opencode-result/
          if-no-files-found: error
          retention-days: 1
      - name: Stop any remaining container
        if: always()
        env:
          CONTAINER: carlos-opencode-${{ github.run_id }}
        run: |
          if docker container inspect "$CONTAINER" >/dev/null 2>&1; then
            docker rm -f "$CONTAINER"
          fi

  publish:
    concurrency:
      group: carlos-opencode-status-${{ github.run_id }}
      queue: max
      cancel-in-progress: false
    needs: [authorize, generate]
    if: >-
      always() && !cancelled() && needs.authorize.result == 'success' &&
      needs.authorize.outputs.accepted == 'true' && needs.authorize.outputs.mode == 'implement' &&
      needs.generate.result == 'success'
    environment:
      name: opencode-publish
      url: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      actions: read
      contents: read
      issues: write
      pull-requests: read
    steps:
      - name: Check out trusted publisher
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22.23.3'
          package-manager-cache: false
      - name: Load generated result
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          digest-mismatch: error
          name: opencode-result-${{ needs.generate.outputs.attempt }}
          path: ${{ runner.temp }}/opencode-result
      - name: Reauthorize and publish
        env:
          OPENCODE_PROVIDER_1_CONFIGURED: ${{ secrets.OPENCODE_PROVIDER_1_API_KEY != '' && secrets.OPENCODE_PROVIDER_1_BASE_URL != '' }}
          OPENCODE_PROVIDER_2_CONFIGURED: ${{ secrets.OPENCODE_PROVIDER_2_API_KEY != '' && secrets.OPENCODE_PROVIDER_2_BASE_URL != '' }}
          OPENCODE_PROVIDER_3_CONFIGURED: ${{ secrets.OPENCODE_PROVIDER_3_API_KEY != '' && secrets.OPENCODE_PROVIDER_3_BASE_URL != '' }}
          GH_TOKEN: ${{ github.token }}
          EXPECTED_SOURCE: ${{ needs.authorize.outputs.source }}
          EXPECTED_BASELINE: ${{ needs.authorize.outputs.baseline }}
          EXPECTED_PROVIDER: ${{ needs.authorize.outputs.provider }}
          EXPECTED_MODEL: ${{ needs.authorize.outputs.model }}
          EXPECTED_ALIAS: ${{ needs.authorize.outputs.alias }}
          EXPECTED_ADAPTER: ${{ needs.authorize.outputs.adapter }}
          EXPECTED_REVIEW_PASSES: ${{ needs.authorize.outputs.reviewPasses }}
          EXPECTED_BASE: ${{ needs.authorize.outputs.base }}
          EXPECTED_BRANCH: ${{ needs.authorize.outputs.branch }}
          RESULT_DIR: ${{ runner.temp }}/opencode-result
          OPENCODE_APP_PRIVATE_KEY: ${{ secrets.OPENCODE_APP_PRIVATE_KEY }}
        run: node scripts/opencode/controller.cjs publish

  respond:
    concurrency:
      group: carlos-opencode-status-${{ github.run_id }}
      queue: max
      cancel-in-progress: false
    needs: [authorize, generate]
    if: >-
      always() && !cancelled() && needs.authorize.result == 'success' &&
      needs.authorize.outputs.accepted == 'true' && needs.authorize.outputs.mode != 'implement' &&
      needs.generate.result == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      actions: read
      contents: read
      issues: write
      pull-requests: read
    steps:
      - name: Check out trusted publisher
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22.23.3'
          package-manager-cache: false
      - name: Load generated result
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          digest-mismatch: error
          name: opencode-result-${{ needs.generate.outputs.attempt }}
          path: ${{ runner.temp }}/opencode-result
      - name: Reauthorize and respond
        env:
          OPENCODE_PROVIDER_1_CONFIGURED: ${{ secrets.OPENCODE_PROVIDER_1_API_KEY != '' && secrets.OPENCODE_PROVIDER_1_BASE_URL != '' }}
          OPENCODE_PROVIDER_2_CONFIGURED: ${{ secrets.OPENCODE_PROVIDER_2_API_KEY != '' && secrets.OPENCODE_PROVIDER_2_BASE_URL != '' }}
          OPENCODE_PROVIDER_3_CONFIGURED: ${{ secrets.OPENCODE_PROVIDER_3_API_KEY != '' && secrets.OPENCODE_PROVIDER_3_BASE_URL != '' }}
          GH_TOKEN: ${{ github.token }}
          EXPECTED_SOURCE: ${{ needs.authorize.outputs.source }}
          EXPECTED_BASELINE: ${{ needs.authorize.outputs.baseline }}
          EXPECTED_PROVIDER: ${{ needs.authorize.outputs.provider }}
          EXPECTED_MODEL: ${{ needs.authorize.outputs.model }}
          EXPECTED_ALIAS: ${{ needs.authorize.outputs.alias }}
          EXPECTED_ADAPTER: ${{ needs.authorize.outputs.adapter }}
          EXPECTED_REVIEW_PASSES: ${{ needs.authorize.outputs.reviewPasses }}
          EXPECTED_BASE: ${{ needs.authorize.outputs.base }}
          EXPECTED_BRANCH: ${{ needs.authorize.outputs.branch }}
          RESULT_DIR: ${{ runner.temp }}/opencode-result
        run: node scripts/opencode/controller.cjs publish
