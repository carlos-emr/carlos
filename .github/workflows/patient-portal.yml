# GitHub Workflow: Check Patient Portal
#
# Description:
# Runs the Python checks for the CARLOS patient portal package.

name: Check Patient Portal

on:
  pull_request:
    branches:
      - main
      - develop
      - experimental
      - staging/*
      - hotfix/*
      - community/*/develop
      - community/*/staging/*
    paths:
      - ".github/workflows/patient-portal.yml"
      - "patient_portal/**"

permissions:
  contents: read

jobs:
  patient-portal:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: carlos_portal
          POSTGRES_PASSWORD: carlos_portal
          POSTGRES_USER: carlos_portal
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U carlos_portal -d carlos_portal"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    defaults:
      run:
        working-directory: patient_portal
    steps:
      - name: Checkout code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: patient_portal/requirements.lock

      - name: Install dependencies
        run: python -m pip install --require-hashes -r requirements.lock

      - name: Run Ruff
        run: python -m ruff check .

      - name: Run tests
        run: python -m pytest

      - name: Compile Python files
        run: python -m compileall carlos_patient_portal tests

      - name: Run migrations
        env:
          PATIENT_PORTAL_ENVIRONMENT: development
          PATIENT_PORTAL_DATABASE_URL: "sqlite+pysqlite:///:memory:"
        run: alembic -c alembic.ini upgrade head

      - name: Run PostgreSQL migrations
        env:
          PATIENT_PORTAL_ENVIRONMENT: development
          PATIENT_PORTAL_DATABASE_URL: "postgresql+psycopg://carlos_portal:carlos_portal@127.0.0.1:5432/carlos_portal"
        run: |
          alembic -c alembic.ini upgrade head
          alembic -c alembic.ini downgrade base

      - name: Build wheel
        run: python -m build --wheel --no-isolation

      - name: Validate runtime lock
        run: |
          python -m venv "$RUNNER_TEMP/patient-portal-runtime"
          . "$RUNNER_TEMP/patient-portal-runtime/bin/activate"
          python -m pip install --require-hashes -r requirements-runtime.lock
          python -m pip install --no-deps dist/*.whl
          python -m pip check
