# GitHub Workflow: Check Patient Portal
#
# Description:
# Runs the Python checks for the CARLOS patient portal package.

name: Check Patient Portal

env:
  FHIR_VALIDATOR_SHA256: 0e53ab1d1a6f1e35f505255c0b8ce10a35fcf27e6e96b503640f784cd07e5ad6
  FHIR_VALIDATOR_VERSION: 6.9.12

on:
  pull_request:
    branches:
      - main
      - develop
      - experimental
      - staging/*
      - hotfix/*
      - community/*/develop
      - community/*/staging/*
    paths:
      - ".github/workflows/patient-portal.yml"
      - "patient_portal/**"

permissions:
  contents: read

jobs:
  patient-portal:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16@sha256:33f923b05f64ca54ac4401c01126a6b92afe839a0aa0a52bc5aeb5cc958e5f20
        env:
          POSTGRES_DB: carlos_portal
          POSTGRES_PASSWORD: carlos_portal
          POSTGRES_USER: carlos_portal
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U carlos_portal -d carlos_portal"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    defaults:
      run:
        working-directory: patient_portal
    steps:
      - name: Checkout code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: patient_portal/requirements.lock

      - name: Set up Java 21
        uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9
        with:
          distribution: "temurin"
          java-version: "21"

      - name: Install dependencies
        run: python -m pip install --require-hashes -r requirements.lock

      - name: Audit dependencies
        run: |
          python -m pip_audit --require-hashes --progress-spinner off -r requirements-runtime.lock
          python -m pip_audit --require-hashes --progress-spinner off -r requirements.lock

      - name: Run Ruff
        run: python -m ruff check .

      - name: Run tests
        run: >-
          python -m pytest
          --cov=carlos_patient_portal
          --cov-report=term-missing
          --cov-report=xml:coverage.xml

      - name: Compile Python files
        run: python -m compileall carlos_patient_portal tests

      - name: Cache FHIR validator CLI
        id: cache-fhir-validator
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: ${{ runner.temp }}/fhir-validator/validator_cli.jar
          key: fhir-validator-${{ env.FHIR_VALIDATOR_VERSION }}-${{ env.FHIR_VALIDATOR_SHA256 }}

      - name: Download FHIR validator CLI
        if: steps.cache-fhir-validator.outputs.cache-hit != 'true'
        run: |
          mkdir -p "$RUNNER_TEMP/fhir-validator"
          curl -fsSL --retry 3 --proto '=https' --tlsv1.2 \
            --output "$RUNNER_TEMP/fhir-validator/validator_cli.jar" \
            "https://github.com/hapifhir/org.hl7.fhir.core/releases/download/${FHIR_VALIDATOR_VERSION}/validator_cli.jar"

      - name: Verify FHIR validator CLI checksum
        run: |
          printf '%s  %s\n' \
            "$FHIR_VALIDATOR_SHA256" \
            "$RUNNER_TEMP/fhir-validator/validator_cli.jar" > "$RUNNER_TEMP/fhir-validator/validator.sha256"
          sha256sum -c "$RUNNER_TEMP/fhir-validator/validator.sha256"

      - name: Cache FHIR package cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: ~/.fhir/packages
          key: fhir-package-cache-r4-4.0.1-validator-${{ env.FHIR_VALIDATOR_VERSION }}

      - name: Validate FHIR examples
        run: |
          python tests/fhir_examples.py "$RUNNER_TEMP/fhir-examples"
          java -jar "$RUNNER_TEMP/fhir-validator/validator_cli.jar" \
            "$RUNNER_TEMP/fhir-examples" \
            -version 4.0.1 \
            -tx n/a \
            -level errors \
            -output-style compact

      - name: Run migrations
        env:
          PATIENT_PORTAL_ENVIRONMENT: development
          PATIENT_PORTAL_DATABASE_URL: "sqlite+pysqlite:///:memory:"
        run: alembic -c alembic.ini upgrade head

      - name: Run PostgreSQL migrations
        env:
          PATIENT_PORTAL_ENVIRONMENT: development
          PATIENT_PORTAL_DATABASE_URL: "postgresql+psycopg://carlos_portal:carlos_portal@127.0.0.1:5432/carlos_portal"
        run: |
          alembic -c alembic.ini upgrade head
          alembic -c alembic.ini downgrade base

      - name: Build wheel
        run: python -m build --wheel --no-isolation

      - name: Validate runtime lock
        run: |
          python -m venv "$RUNNER_TEMP/patient-portal-runtime"
          . "$RUNNER_TEMP/patient-portal-runtime/bin/activate"
          python -m pip install --require-hashes -r requirements-runtime.lock
          python -m pip install --no-deps dist/*.whl
          python -m pip check
