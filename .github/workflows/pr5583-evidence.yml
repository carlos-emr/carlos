# Disposable evidence inspection only.
name: PR 5583 Full Probe Evidence
on:
  push:
    branches: [validation/pr-5583-runtime]
    paths: [.github/workflows/pr5583-evidence.yml]
permissions:
  actions: read
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Read the full synthetic probe diagnostics
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh run download 41705736671 --repo carlos-emr/carlos --name pr5583-packaged-evidence --dir "$RUNNER_TEMP/evidence"
          python3 - <<'PY'
          import os, re
          from pathlib import Path
          root = Path(os.environ['RUNNER_TEMP']) / 'evidence'
          for path in sorted((root / 'probes').glob('*echart*.log')):
              lines = path.read_text().splitlines()
              print(path.name)
              for line in lines[:70]:
                  print(re.sub(r'(https?://[^\s?"<>]+)\?[^\s"<>]*', r'\1?[redacted]', line))
          journal = root / 'service-journal.log'
          if journal.exists():
              for line in journal.read_text().splitlines():
                  if any(word in line for word in (' ERROR ', 'Exception', 'Caused by:', 'ResponseSanitization', 'GraphMeasurements')):
                      print(re.sub(r'(https?://[^\s?"<>]+)\?[^\s"<>]*', r'\1?[redacted]', line))
          PY
