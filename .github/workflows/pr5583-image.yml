# Disposable investigation only; this workflow is not part of PR #5583.
name: PR 5583 PNG Charset Diagnostic
on:
  push:
    branches: [validation/pr-5583-runtime]
permissions:
  contents: read
  actions: read
jobs:
  image-response:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: de05d14a48dc6bed35d621f66ca84aa4a214cff5
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '22'
      - name: Install the runtime browser version
        run: |
          npm install --prefix "$RUNNER_TEMP/png-probe" --no-audit --no-fund playwright@1.60.0 pngjs@7.0.0
      - name: Fetch the package's pinned Chromium
        run: |
          rev="$(sed -n 's/^rev=//p' debian/chromium.pin)"
          chrome_sha="$(sed -n 's/^chrome_sha256=//p' debian/chromium.pin)"
          driver_sha="$(sed -n 's/^chromedriver_sha256=//p' debian/chromium.pin)"
          bash debian/fetch-chromium.sh "$rev" "$chrome_sha" "$driver_sha" "$RUNNER_TEMP/pinned-chromium"
          echo "PACKAGED_CHROME=$RUNNER_TEMP/pinned-chromium/chrome-linux/chrome" >> "$GITHUB_ENV"
      - name: Compare navigation bytes with the actual served PNG
        run: |
          NODE_PATH="$RUNNER_TEMP/png-probe/node_modules" node <<'JS'
          const assert = require('node:assert/strict');
          const http = require('node:http');
          const {PNG} = require('pngjs');
          const {chromium} = require('playwright');
          const {getLaunchOptions} = require('./scripts/lib/playwright-harness');
          (async () => {
            const png = new PNG({width: 1000, height: 600});
            for (let y = 0; y < 600; y++) for (let x = 0; x < 1000; x++) {
              const at = (y * 1000 + x) * 4;
              png.data[at] = (x * 17 + y * 13) % 256;
              png.data[at + 1] = (x + y * 7) % 256;
              png.data[at + 2] = (x * 3 + y) % 256;
              png.data[at + 3] = 255;
            }
            const expected = PNG.sync.write(png);
            const server = http.createServer((request, response) => {
              if (request.url.startsWith('/GraphMeasurements')) {
                const type = new URL(request.url, 'http://127.0.0.1').searchParams.get('type');
                response.writeHead(200, {'Content-Type': type, 'Cache-Control': 'no-store'});
                response.end(expected);
              } else { response.writeHead(204); response.end(); }
            });
            await new Promise(resolve => server.listen(0, '127.0.0.1', resolve));
            let browser;
            try {
              for (const contentType of ['image/png', 'image/png;charset=UTF-8', 'image/png;charset=ISO-8859-1']) {
              const chromePath = process.env.PACKAGED_CHROME;
              browser = await chromium.launch(getLaunchOptions(chromePath));
              const page = await browser.newPage();
              const url = 'http://127.0.0.1:' + server.address().port + '/GraphMeasurements?type=' + encodeURIComponent(contentType);
              const response = await page.goto(url);
              const navigation = await response.body();
              await page.waitForFunction(() => {
                const image = document.querySelector('img');
                return image && image.complete && image.naturalWidth === 1000;
              });
              const direct = await page.context().request.get(url);
              const actual = await direct.body();
              assert(actual.equals(expected));
              console.log(JSON.stringify({
                executable: chromePath ? 'packaged' : 'playwright', browser: browser.version(), navigationType: response.headers()['content-type'],
                navigationLength: navigation.length, actualLength: actual.length,
                navigationPng: navigation.subarray(0,8).equals(expected.subarray(0,8)),
                navigationHtml: /^\s*<(?:!doctype|html)/i.test(navigation.toString('utf8')),
                browserImageRendered: true, directPng: true,
              }));
              await browser.close(); browser = null;
              }
            } finally {
              if (browser) await browser.close();
              await new Promise(resolve => server.close(resolve));
            }
          })().catch(error => { console.error(error); process.exitCode = 1; });
          JS