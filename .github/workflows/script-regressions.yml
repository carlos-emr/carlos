# Browser-harness/source-contract tests and an isolated Chromium editor fixture.
# No VM, running application, database or secrets required.
# Licensed under the repository's LICENSE.
name: Script Regressions

on:
  pull_request:
  push:
    branches:
      - main
      - develop
      - 'release/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  script-regressions:
    name: Node Script Regressions
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
          cache: npm
      - name: Install locked dependencies without lifecycle scripts
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Run all script regressions
        run: npm run test:scripts
      - name: Install Chromium for the isolated RTL fixture
        run: npx --no-install playwright install --with-deps chromium
      - name: Check RTL measurement loading in Chromium
        run: node scripts/rtl-measurement-browser-check.js
