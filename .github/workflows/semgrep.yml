# GitHub Workflow: Semgrep Security Scan
#
# Description:
# Runs Semgrep SAST analysis connected to Semgrep Cloud (app.semgrep.dev).
# Results appear in both the Semgrep Cloud dashboard and the GitHub Security tab.
#
# Usage:
# - Triggered on pushes to develop/main/release/* branches
# - Triggered on pull requests targeting develop/main/release/*
# - Scheduled weekly full scan
# - Manual dispatch available
#
# Requirements:
# - SEMGREP_APP_TOKEN secret must be configured in repository settings
#   (Create at: https://semgrep.dev → Settings → Tokens)
# - .semgrepignore in repo root controls file exclusions
#
# License:
# This GitHub Workflow file is part of the Carlos EMR project and is subject
# to the licensing terms outlined in the repository's LICENSE file.

name: Semgrep Security Scan

on:
  push:
    branches: [develop, main, "release/*"]
  pull_request:
    branches: [develop, main, "release/*"]
  workflow_dispatch: {}
  schedule:
    - cron: '23 4 * * 1'  # Monday 4:23 UTC (weekly full scan)

# Superseded pushes to the same PR cancel the in-progress run; every other
# event (push to a protected branch, schedule, dispatch) gets a unique group
# via run_id and is never queued behind or cancelled by another run. The final
# head of a PR always gets its own complete run, so no check outcome changes.
concurrency:
  group: semgrep-${{ github.event_name == 'pull_request' && github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  security-events: write
  actions: read
  contents: read

jobs:
  semgrep:
    name: Semgrep SAST Analysis
    runs-on: ubuntu-24.04
    # Full Cloud scans can take 89 minutes, including on a large PR. Leave time
    # for the custom rules and SARIF uploads rather than canceling those checks.
    timeout-minutes: 120
    container:
      image: semgrep/semgrep@sha256:cc1b68266f267878b39739373ea9985b9a78e5d64497dd875c8de100b22695ed # 1.184.0
    env:
      HAS_SEMGREP_TOKEN: ${{ secrets.SEMGREP_APP_TOKEN != '' }}
    if: github.actor != 'dependabot[bot]'
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Run Semgrep CI
        id: run_semgrep
        if: env.HAS_SEMGREP_TOKEN == 'true'
        env:
          SEMGREP_APP_TOKEN: ${{ secrets.SEMGREP_APP_TOKEN }}
        run: |
          # Keep findings non-blocking, as before; execution errors and absent
          # evidence must not silently become a successful security scan.
          set +e
          semgrep ci --no-suppress-errors --timeout 30 --sarif --output semgrep.sarif
          status=$?
          set -e
          if [ "$status" -gt 1 ]; then
            echo "::error::Semgrep CI exited $status: scanner execution failed."
            exit "$status"
          fi
          if [ ! -s semgrep.sarif ]; then
            echo "::error::Semgrep CI produced no SARIF evidence."
            exit 1
          fi

      - name: Verify Semgrep execution-evidence guard
        run: python3 -m unittest discover -s scripts/ci -p test_check_semgrep_complete.py -v

      # Runs every rule in .semgrep/, not just the JSP one. The CRLF and path
      # traversal rules are sanitizer-aware replacements for built-ins that
      # .semgrep/README.md instructs maintainers to disable in the Semgrep Cloud
      # policy; while they were not invoked here, disabling those built-ins left
      # CWE-117 and CWE-22 with no CI coverage at all.
      - name: Test CARLOS document-path sanitizer model
        run: |
          semgrep --test --config .semgrep/path-traversal-carlos.yml \
            src/test/semgrep/path-traversal-carlos.java

      - name: Run CARLOS custom Semgrep rules
        id: run_semgrep_carlos
        # Findings stay non-blocking, but a scanner execution or configuration
        # error must fail the job. `continue-on-error` cannot distinguish the
        # two: a bad rule file would leave the check green while producing no
        # SARIF, silently restoring the CWE-117/CWE-22 coverage gap this step
        # exists to close. Semgrep exits 0 with no blocking findings and 1 with
        # findings; every higher code is an error (2 config, 4 bad pattern,
        # 7 rules failed to parse, 8 unknown language).
        run: |
          set +e
          semgrep scan --strict --timeout 30 --config .semgrep/ --sarif --output semgrep-carlos.sarif
          status=$?
          set -e
          if [ "$status" -gt 1 ]; then
            echo "::error::Semgrep exited $status running .semgrep/ — scanner error, not findings."
            exit "$status"
          fi
          if [ ! -s semgrep-carlos.sarif ]; then
            echo "::error::Semgrep exited $status but wrote no SARIF; CARLOS rule findings would not be uploaded."
            exit 1
          fi

      - name: Filter suppressed Semgrep SARIF results
        if: always() && steps.run_semgrep.outcome != 'skipped' && hashFiles('semgrep.sarif') != ''
        run: python3 scripts/filter_suppressed_sarif.py semgrep.sarif

      - name: Filter suppressed CARLOS Semgrep SARIF results
        if: always() && steps.run_semgrep_carlos.outcome != 'skipped' && hashFiles('semgrep-carlos.sarif') != ''
        run: python3 scripts/filter_suppressed_sarif.py semgrep-carlos.sarif

      - name: Refuse partial Semgrep Cloud execution
        if: always() && steps.run_semgrep.outcome != 'skipped' && hashFiles('semgrep.sarif') != ''
        run: python3 scripts/ci/check-semgrep-complete.py semgrep.sarif

      - name: Refuse partial CARLOS rule execution
        if: always() && steps.run_semgrep_carlos.outcome != 'skipped' && hashFiles('semgrep-carlos.sarif') != ''
        run: python3 scripts/ci/check-semgrep-complete.py semgrep-carlos.sarif

      # Diagnostics only: retain the existing scanner, filtering and upload outcomes.
      # Never log finding messages, metavariables, source snippets or the full SARIF.
      - name: Summarize security finding locations
        if: always() && (hashFiles('semgrep.sarif') != '' || hashFiles('semgrep-carlos.sarif') != '')
        continue-on-error: true
        run: python3 scripts/summarize_security_locations.py semgrep.sarif semgrep-carlos.sarif

      - name: Skip Semgrep CI when token is not configured
        if: env.HAS_SEMGREP_TOKEN != 'true'
        run: |
          echo "SEMGREP_APP_TOKEN is not configured; skipping Semgrep Cloud scan."
          echo "Configure repository secret SEMGREP_APP_TOKEN to enable this check."

      - name: Upload SARIF to GitHub Security tab
        uses: github/codeql-action/upload-sarif@9b3254085494b55a0f7c4c2b3d2d52cc712ce370
        with:
          sarif_file: semgrep.sarif
        if: always() && steps.run_semgrep.outcome != 'skipped' && hashFiles('semgrep.sarif') != ''

      - name: Upload CARLOS Semgrep SARIF to GitHub Security tab
        uses: github/codeql-action/upload-sarif@9b3254085494b55a0f7c4c2b3d2d52cc712ce370
        with:
          sarif_file: semgrep-carlos.sarif
          category: semgrep-carlos
        if: always() && steps.run_semgrep_carlos.outcome != 'skipped' && hashFiles('semgrep-carlos.sarif') != ''
