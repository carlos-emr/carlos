name: Issue 5533 refreshed baseline diagnostics
on:
  push:
    branches: [codex/issue-5533-sonar-diagnostics]
permissions:
  contents: read
jobs:
  diagnostics:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Read release baseline and PR findings
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          python3 - <<'PY'
          import base64, json, os, urllib.parse, urllib.request
          def get(path, **params):
              request = urllib.request.Request('https://sonarcloud.io/api/' + path + '?' + urllib.parse.urlencode(params), headers={'Authorization':'Basic ' + base64.b64encode((os.environ['SONAR_TOKEN']+':').encode()).decode()})
              with urllib.request.urlopen(request, timeout=30) as response:
                  return json.load(response)
          project='carlos-emr_carlos'
          print('BRANCHES', json.dumps(get('project_branches/list', project=project)))
          print('PR_METADATA', json.dumps([pr for pr in get('project_pull_requests/list', project=project).get('pullRequests',[]) if str(pr.get('key'))=='5543']))
          print('QUALITY', json.dumps(get('qualitygates/project_status', projectKey=project, pullRequest=5543)))
          print('MEASURES', json.dumps(get('measures/component', component=project, pullRequest=5543, metricKeys='new_code_smells,new_technical_debt,new_development_cost,new_sqale_debt_ratio,new_maintainability_rating,new_lines')))
          data=get('issues/search',componentKeys=project,pullRequest=5543,resolved='false',ps=500)
          print('ISSUE_TOTAL', data.get('paging'))
          print('BRANCH_SETTING', json.dumps(get('settings/values', component=project, keys='sonar.branch.longLivedBranches.regex')))
          for controller in get('webservices/list').get('webServices',[]):
              if controller.get('path')=='api/project_branches':
                  print('BRANCH_API', json.dumps(controller))
          PY
