name: Issue 5533 scanner failure diagnostics
on:
  push:
    branches: [codex/issue-5533-sonar-diagnostics]
permissions:
  contents: read
  actions: read
jobs:
  diagnostics:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Read bounded scanner failure context
        env:
          ACTIONS_READ_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import os, re, urllib.request, urllib.error
          class NoRedirect(urllib.request.HTTPRedirectHandler):
              def redirect_request(self, request, fp, code, message, headers, newurl):
                  return None
          request = urllib.request.Request('https://api.github.com/repos/carlos-emr/carlos/actions/jobs/125605841417/logs', headers={'Authorization':'Bearer ' + os.environ['ACTIONS_READ_TOKEN'], 'Accept':'application/vnd.github+json'})
          try:
              response = urllib.request.build_opener(NoRedirect).open(request, timeout=30)
          except urllib.error.HTTPError as failure:
              if failure.code != 302:
                  raise
              location = failure.headers['Location']
              if not location.startswith('https://'):
                  raise RuntimeError('Expected HTTPS log redirect')
              response = urllib.request.urlopen(location, timeout=60)
          lines = response.read().decode('utf-8-sig', errors='replace').splitlines()
          for line in lines:
              if re.search(r'SONAR_SCANNER_JAVA_OPTS|sonar.scanner.javaOpts|heap|JavaOpts|Memory configuration|Scanner Engine JVM|Engine configuration|OutOfMemoryError', line, re.I):
                  print('MEMORY_CONTEXT', line[:1500])
          print('SCANNER_FINAL_CONTEXT')
          for line in lines[-90:]:
              print(line[:2000])
          PY
      - name: Read actual release branch and PR quality state
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          python3 - <<'PY'
          import base64, json, os, urllib.parse, urllib.request
          def get(path, **params):
              request = urllib.request.Request('https://sonarcloud.io/api/' + path + '?' + urllib.parse.urlencode(params), headers={'Authorization':'Basic ' + base64.b64encode((os.environ['SONAR_TOKEN']+':').encode()).decode()})
              with urllib.request.urlopen(request, timeout=30) as response:
                  return json.load(response)
          print('BRANCHES', json.dumps(get('project_branches/list', project='carlos-emr_carlos')))
          print('QUALITY', json.dumps(get('qualitygates/project_status', projectKey='carlos-emr_carlos', pullRequest=5543)))
          PY
