name: Issue 5533 Sonar diagnostics
on:
  push:
    branches: [codex/issue-5533-sonar-diagnostics]
permissions:
  contents: read
  actions: read
jobs:
  diagnostics:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Read the failed target branch analysis log
        env:
          ACTIONS_READ_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PYLOG'
          import os, urllib.request, urllib.error, urllib.parse, re
          class NoRedirect(urllib.request.HTTPRedirectHandler):
              def redirect_request(self, request, fp, code, message, headers, newurl):
                  return None
          request = urllib.request.Request('https://api.github.com/repos/carlos-emr/carlos/actions/jobs/125573078288/logs', headers={'Authorization':'Bearer ' + os.environ['ACTIONS_READ_TOKEN'], 'Accept':'application/vnd.github+json'})
          try:
              response = urllib.request.build_opener(NoRedirect).open(request, timeout=30)
          except urllib.error.HTTPError as failure:
              if failure.code != 302:
                  raise
              location = failure.headers['Location']
              if urllib.parse.urlsplit(location).scheme != 'https':
                  raise RuntimeError('Expected HTTPS log download')
              # The redirected download receives no GitHub authorization header.
              response = urllib.request.urlopen(location, timeout=60)
          text = response.read().decode('utf-8-sig', errors='replace')
          lines = [line for line in text.splitlines() if re.search(r'\[ERROR\]|QUALITY GATE|BUILD FAILURE|EXECUTION FAILURE', line)]
          for line in lines[-50:]:
              print(line[:2000])
          PYLOG
      - name: Read quality gate, new-code findings and target analysis
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          python3 - <<'PY'
          import base64, json, os, urllib.parse, urllib.request
          token = os.environ['SONAR_TOKEN']
          def get(path, **params):
              url = 'https://sonarcloud.io/api/' + path + '?' + urllib.parse.urlencode(params)
              request = urllib.request.Request(url, headers={'Authorization': 'Basic ' + base64.b64encode((token + ':').encode()).decode()})
              with urllib.request.urlopen(request, timeout=30) as response:
                  return json.load(response)
          project = 'carlos-emr_carlos'
          print('QUALITY', json.dumps(get('qualitygates/project_status', projectKey=project, pullRequest=5543)))
          print('MEASURES', json.dumps(get('measures/component', component=project, pullRequest=5543, metricKeys='new_code_smells,new_technical_debt,new_development_cost,new_sqale_debt_ratio,new_maintainability_rating,new_lines')))
          for label, path, params in [('TARGET_ANALYSES','project_analyses/search',{'project':project,'branch':'release/2026.08','ps':3}),('BRANCHES','project_branches/list',{'project':project})]:
              try:
                  print(label, json.dumps(get(path, **params)))
              except urllib.error.HTTPError as failure:
                  print(label, 'ERROR', failure.code, failure.read().decode())
          for extra in [{}, {'sinceLeakPeriod': 'true'}, {'inNewCodePeriod': 'true'}]:
              try:
                  data = get('issues/search', componentKeys=project, pullRequest=5543, resolved='false', ps=500, **extra)
                  print('ISSUE_SET', extra, data.get('paging'))
                  if not extra:
                      for issue in data.get('issues', []):
                          print('ISSUE', json.dumps({key: issue.get(key) for key in ['key','rule','component','line','message','debt','effort','creationDate','isNew','textRange','flows']}))
              except Exception as failure:
                  print('FILTER_ERROR', extra, type(failure).__name__, str(failure), failure.read().decode() if isinstance(failure, urllib.error.HTTPError) else '')
          PY
