# GitHub Workflow: SonarCloud Analysis
#
# Description:
# This workflow runs SonarCloud static code analysis on the CARLOS EMR codebase.
# It analyzes code quality, security vulnerabilities, and maintainability issues.
#
# Container Images:
# This workflow uses the same dev container as maven-project.yml to ensure
# all local_repo dependencies are available for the build.
#
# Usage:
# - Triggered on pushes to main, develop, and release/* branches
# - Triggered on pull requests targeting main, develop, and release/*
#
# Requirements:
# - SONAR_TOKEN secret must be configured in repository settings
# - Project must be set up on SonarCloud (https://sonarcloud.io)
# - sonar.organization must be set in pom.xml
#
# License:
# This GitHub Workflow file is part of the Carlos EMR project and is subject
# to the licensing terms outlined in the repository's LICENSE file.
#
# Last Updated:
# August 2026

name: SonarCloud Analysis

on:
  push:
    branches:
      - main
      - develop
      - release/*
  pull_request:
    types: [opened, synchronize, reopened]
    branches:
      - main
      - develop
      - release/*

concurrency:
  group: sonarcloud-${{ github.event.pull_request.head.repo.full_name || github.repository }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ${{ github.repository_owner }}

permissions:
  contents: read
  pull-requests: write
  packages: read

jobs:
  build:
    name: Build and analyze
    runs-on: ubuntu-latest
    timeout-minutes: 60
    if: >
      github.actor != 'dependabot[bot]' &&
      (
        github.event_name != 'pull_request' ||
        (
          github.event.pull_request.head.repo.full_name == github.repository &&
          github.event.pull_request.user.login != 'dependabot[bot]'
        )
      )
    steps:
      - name: Verify SonarCloud configuration
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          if [ -z "$SONAR_TOKEN" ]; then
            echo "::error::SONAR_TOKEN is not available in this workflow run."
            echo "::error::Configure the SONAR_TOKEN secret with access to the SonarCloud project used by this workflow."
            echo "::error::For events where GitHub does not expose repository secrets, keep SonarCloud analysis skipped or run it through a trusted manual process."
            exit 1
          fi

      - name: Checkout code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: false
          fetch-depth: 0  # Shallow clones should be disabled for a better relevancy of analysis

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f

      - name: Log in to Container Registry
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Try to pull pre-built image from ghcr.io
        id: pull-image
        continue-on-error: true
        env:
          IMAGE: ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/carlos-tomcat-dev:latest
        run: |
          echo "Attempting to pull pre-built image from $IMAGE..."
          if docker pull "$IMAGE" 2>pull-image-error.log; then
            docker tag "$IMAGE" carlos-tomcat-dev
            echo "pulled=true" >> "$GITHUB_OUTPUT"
            echo "reason=success" >> "$GITHUB_OUTPUT"
            echo "Successfully pulled pre-built image!"
          else
            echo "pulled=false" >> "$GITHUB_OUTPUT"
            if grep -qiE 'manifest unknown|not found' pull-image-error.log; then
              echo "reason=not-found" >> "$GITHUB_OUTPUT"
              echo "Pre-built image not available (not found in registry), will build locally"
            else
              echo "reason=error" >> "$GITHUB_OUTPUT"
              echo "Image pull failed due to an unexpected error:"
              cat pull-image-error.log
            fi
          fi
          rm -f pull-image-error.log

      - name: Fail on unexpected image pull error
        if: steps.pull-image.outputs.reason == 'error'
        run: |
          echo "::error::Failed to pull pre-built image from ${{ env.REGISTRY }} for a reason other than 'image not found'. Check network connectivity, registry permissions, or image name."
          exit 1

      - name: Cache Docker layers
        if: steps.pull-image.outputs.pulled != 'true' && steps.pull-image.outputs.reason == 'not-found'
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: /tmp/.buildx-cache
          key: ${{ runner.os }}-buildx-${{ hashFiles('.devcontainer/development/**') }}
          restore-keys: |
            ${{ runner.os }}-buildx-

      - name: Cache Maven packages
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: .m2-cache
          key: ${{ runner.os }}-m2-${{ hashFiles('**/pom.xml', 'dependencies-lock.json') }}
          restore-keys: ${{ runner.os }}-m2

      - name: Cache SonarCloud packages
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: .sonar-cache
          key: ${{ runner.os }}-sonar
          restore-keys: ${{ runner.os }}-sonar

      - name: Prepare cache directories
        run: |
          mkdir -p .m2-cache
          mkdir -p .sonar-cache

      - name: Purge stale local_repo artifacts from Maven cache
        # Both formerly-JitPack groupIds are vendored in local_repo with bytes
        # that differ from what JitPack ever served; a restored cache copy
        # shadows local_repo (Maven prefers ~/.m2 and never re-verifies cached
        # bytes), so evict them and let them re-copy from file://local_repo.
        # Same guard as maven-project.yml / dependency-submission.yml.
        run: |
          rm -rf .m2-cache/repository/com/github/openosp \
                 .m2-cache/repository/com/github/librepdf

      - name: Build dev container (fallback)
        if: steps.pull-image.outputs.pulled != 'true'
        run: |
          echo "Building container locally..."
          docker buildx build \
            --cache-from=type=local,src=/tmp/.buildx-cache \
            --cache-to=type=local,dest=/tmp/.buildx-cache-new,mode=max \
            --load \
            -t carlos-tomcat-dev \
            .devcontainer/development
          rm -rf /tmp/.buildx-cache
          mv /tmp/.buildx-cache-new /tmp/.buildx-cache

      - name: Start container
        run: |
          docker run -d --name carlos-tomcat-dev \
            -v ${{ github.workspace }}:/workspace \
            -v ${{ github.workspace }}/.m2-cache:/root/.m2 \
            -v ${{ github.workspace }}/.sonar-cache:/root/.sonar/cache \
            -w /workspace \
            carlos-tomcat-dev tail -f /dev/null

      - name: Configure git safe directory
        run: |
          docker exec carlos-tomcat-dev bash -c "
            git config --global --add safe.directory /workspace
          "

      - name: Build and analyze (Push branch)
        if: github.event_name == 'push'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          docker exec \
            -e GITHUB_TOKEN="$GITHUB_TOKEN" \
            -e SONAR_TOKEN="$SONAR_TOKEN" \
            carlos-tomcat-dev bash -c "
              echo '========================================='
              echo 'Running SonarCloud Analysis (Branch)'
              echo '========================================='
              mvn -B verify org.sonarsource.scanner.maven:sonar-maven-plugin:5.7.0.6970:sonar \
                -Pskip-dependency-lock \
                -Dmaven.test.failure.ignore=true \
                -Dsonar.host.url=https://sonarcloud.io \
                -Dsonar.projectKey=carlos-emr_carlos \
                            "

      - name: Build and analyze (Pull Request)
        if: github.event_name == 'pull_request'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_BRANCH: ${{ github.head_ref }}
          PR_BASE: ${{ github.base_ref }}
        run: |
          docker exec \
            -e GITHUB_TOKEN="$GITHUB_TOKEN" \
            -e SONAR_TOKEN="$SONAR_TOKEN" \
            -e PR_NUMBER="$PR_NUMBER" \
            -e PR_BRANCH="$PR_BRANCH" \
            -e PR_BASE="$PR_BASE" \
            carlos-tomcat-dev bash -c "
              echo '========================================='
              echo 'Running SonarCloud Analysis (Pull Request)'
              echo '========================================='
              echo \"PR Number: \$PR_NUMBER\"
              echo \"PR Branch: \$PR_BRANCH\"
              echo \"PR Base: \$PR_BASE\"
              echo '========================================='
              mvn -B verify org.sonarsource.scanner.maven:sonar-maven-plugin:5.7.0.6970:sonar \
                -Pskip-dependency-lock \
                -Dmaven.test.failure.ignore=true \
                -Dsonar.host.url=https://sonarcloud.io \
                -Dsonar.projectKey=carlos-emr_carlos \
                \"-Dsonar.pullrequest.key=\$PR_NUMBER\" \
                \"-Dsonar.pullrequest.branch=\$PR_BRANCH\" \
                \"-Dsonar.pullrequest.base=\$PR_BASE\" \
                            "

      # The dev container runs as root and leaves root-owned files in the
      # mounted workspace (.m2-cache, .sonar-cache, target/**). The post-job
      # cache save runs as the runner user: it re-evaluates the cache key's
      # hashFiles('**/pom.xml', ...) across the workspace and tars the cache
      # directories, so unreadable root-owned paths fail the job even after a
      # successful analysis. Only cold-cache runs hit this — an exact-key
      # cache hit skips the save step entirely, which is why warm-cache runs
      # never saw it. Restore runner ownership before the post steps run.
      - name: Fix workspace ownership for cache save
        if: always()
        run: sudo chown -R "$(id -u):$(id -g)" "$GITHUB_WORKSPACE"
