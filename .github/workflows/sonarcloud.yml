name: Issue 5533 baseline and capacity diagnostics
on:
  push:
    branches: [codex/issue-5533-sonar-diagnostics]
permissions:
  contents: read
  packages: read
jobs:
  capacity:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Measure remaining hosted image storage after existing cleanup
        run: |
          test "$RUNNER_ENVIRONMENT" = github-hosted
          test "$RUNNER_OS" = Linux
          sudo rm -rf -- /usr/local/lib/android /opt/ghc /usr/share/dotnet \
            /opt/hostedtoolcache /usr/local/.ghcup /usr/local/share/boost \
            /usr/local/share/powershell /usr/local/share/chromium \
            /usr/share/swift /usr/share/miniconda /usr/lib/jvm
          docker image prune --all --force
          df -h /
          sudo du -xhd1 /opt /usr/local /usr/local/share /usr/share /usr/lib /var/lib /mnt | sort -h
  baseline:
    name: Refresh actual release analysis with bounded scanner heap
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      SONAR_SCANNER_JAVA_OPTS: -Xmx4g
    steps:
      - name: Checkout exact release commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: 4ef47a2654f8a56b1f5dc23fceb8a8cdcefe87b4
          persist-credentials: false
          fetch-depth: 0
      - name: Prepare SonarCloud cache
        run: mkdir -p .sonar-cache
      - name: Start normal dev container
        uses: ./.github/actions/dev-container
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          maven-cache: restore
          extra-run-args: -v ${{ github.workspace }}/.sonar-cache:/root/.sonar/cache
      - name: Build and analyze exact release source
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          test "$(git rev-parse HEAD)" = 4ef47a2654f8a56b1f5dc23fceb8a8cdcefe87b4
          docker exec \
            -e GITHUB_TOKEN \
            -e SONAR_TOKEN \
            -e SONAR_SCANNER_JAVA_OPTS \
            carlos-tomcat-dev bash -c '
              mvn -B verify org.sonarsource.scanner.maven:sonar-maven-plugin:5.7.0.6970:sonar \
                -Pskip-dependency-lock \
                -Dmaven.test.failure.ignore=true \
                -Dsonar.host.url=https://sonarcloud.io \
                -Dsonar.projectKey=carlos-emr_carlos \
                -Dsonar.branch.name=release/2026.08 \
                -Dsonar.scm.revision=4ef47a2654f8a56b1f5dc23fceb8a8cdcefe87b4
            '
