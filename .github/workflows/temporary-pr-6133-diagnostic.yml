name: Temporary PR 6133 diagnostic artifact
on:
  pull_request:
    branches: ['release/2026.08']
permissions:
  actions: read
jobs:
  read-existing-diagnostics:
    if: github.event.pull_request.number == 6133
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Read the immutable diagnostic artifact from the preceding PR run
        run: |
          set -euo pipefail
          gh api repos/carlos-emr/carlos/actions/artifacts/13826787575/zip > findings.zip
          echo 'cc3d9b40b61aa6fb7044ee59f69f754842dfd5a6317c8196a4a12a2498964741  findings.zip' | sha256sum --check
          python3 - <<'PY'
          import json,zipfile
          with zipfile.ZipFile('findings.zip') as archive:
              for entry in archive.infolist():
                  if entry.filename.endswith('after-analysis.json'):
                      assert entry.file_size < 1024 * 1024
                      print(json.dumps(json.loads(archive.read(entry)),ensure_ascii=True))
          PY
