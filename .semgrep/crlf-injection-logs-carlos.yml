# Custom Semgrep Taint-Mode Rule: CRLF Injection in Logs
#
# Replaces three built-in Semgrep rules that produce false positives because
# they do not recognize LogSafe.sanitize() as a valid CRLF neutralizer:
#
#   - java.servlets.security.crlf-injection-logs-deepsemgrep.crlf-injection-logs-deepsemgrep
#   - java.servlets.security.crlf-injection-logs.crlf-injection-logs
#   - java.lang.security.audit.crlf-injection-logs.crlf-injection-logs
#
# Those built-in rules must be disabled in Semgrep Cloud policy (app.semgrep.dev)
# so that only this custom rule runs for CRLF log injection detection.
#
# See: https://github.com/carlos-emr/carlos/issues/1432

rules:
  - id: carlos.crlf-injection-logs
    message: >
      When data from an untrusted source is put into a logger and not
      neutralized correctly, an attacker could forge log entries or
      include malicious content. Use LogSafe.sanitize() to escape
      control characters before logging user-supplied values.
    severity: ERROR
    languages: [java]
    mode: taint
    metadata:
      category: security
      technology: [java]
      cwe:
        - "CWE-117: Improper Output Neutralization for Logs"
      owasp:
        - "A09:2021 - Security Logging and Monitoring Failures"
      confidence: HIGH
      references:
        - https://owasp.org/Top10/A09_2021-Security_Logging_and_Monitoring_Failures/
        - https://cwe.mitre.org/data/definitions/117.html
    pattern-sources:
      - patterns:
          - pattern: (HttpServletRequest $REQ).$METHOD(...)
          - metavariable-regex:
              metavariable: $METHOD
              regex: ^(getParameter|getQueryString|getHeader|getRequestURI|getRequestURL|getPathInfo|getCookies|getRemoteAddr|getRemoteHost)$
    pattern-sanitizers:
      # Project sanitizers — io.github.carlos_emr.carlos.utility.LogSafe.
      #
      # The class is LogSafe, not LogSanitizer. There has never been a
      # LogSanitizer type in this repository, so the previous patterns matched
      # nothing and every correctly-sanitized log call was still reported.
      #
      # Only methods that provably neutralize CR (0x0D) and LF (0x0A) are
      # listed here. Adding a non-neutralizing helper would silence real
      # CWE-117 findings, so each entry below records why it is safe.

      # sanitize(String) / sanitize(String,int) -> Encode.forJava(), which
      # escapes CR, LF and every other control character.
      - pattern: LogSafe.sanitize(...)
      - pattern: io.github.carlos_emr.carlos.utility.LogSafe.sanitize(...)

      # sanitizeUri(String) strips ;jsessionid-style path parameters, then
      # delegates to sanitize(String).
      - pattern: LogSafe.sanitizeUri(...)
      - pattern: io.github.carlos_emr.carlos.utility.LogSafe.sanitizeUri(...)

      # sanitizeObject(Object) delegates to sanitize(String); its toString()
      # failure fallbacks are string literals plus a class name.
      - pattern: LogSafe.sanitizeObject(...)
      - pattern: io.github.carlos_emr.carlos.utility.LogSafe.sanitizeObject(...)

      # sanitizeForDisplay(String) neutralizes by deletion rather than by
      # escaping: it removes [\p{Cntrl}\u2028\u2029], which covers LF, CR and
      # the Unicode line separators. Intended for operator-facing messages that
      # may later be logged, so it is a valid CWE-117 barrier.
      - pattern: LogSafe.sanitizeForDisplay(...)
      - pattern: io.github.carlos_emr.carlos.utility.LogSafe.sanitizeForDisplay(...)

      # exceptionTrace(Throwable) cuts taint rather than escaping it: it never
      # calls Throwable.toString()/getMessage(), emitting only exception class
      # names and sanitize()-escaped stack frames. The newlines it does emit are
      # server-generated structure, never attacker-controlled.
      - pattern: LogSafe.exceptionTrace(...)
      - pattern: io.github.carlos_emr.carlos.utility.LogSafe.exceptionTrace(...)

      # Static-import forms of the same helpers.
      - patterns:
          - pattern-inside: |
              import static io.github.carlos_emr.carlos.utility.LogSafe.sanitize;
              ...
          - pattern: sanitize(...)
      - patterns:
          - pattern-inside: |
              import static io.github.carlos_emr.carlos.utility.LogSafe.sanitizeUri;
              ...
          - pattern: sanitizeUri(...)
      - patterns:
          - pattern-inside: |
              import static io.github.carlos_emr.carlos.utility.LogSafe.sanitizeObject;
              ...
          - pattern: sanitizeObject(...)
      - patterns:
          - pattern-inside: |
              import static io.github.carlos_emr.carlos.utility.LogSafe.sanitizeForDisplay;
              ...
          - pattern: sanitizeForDisplay(...)
      - patterns:
          - pattern-inside: |
              import static io.github.carlos_emr.carlos.utility.LogSafe.exceptionTrace;
              ...
          - pattern: exceptionTrace(...)
      - patterns:
          - pattern-inside: |
              import static io.github.carlos_emr.carlos.utility.LogSafe.*;
              ...
          - pattern-either:
              - pattern: sanitize(...)
              - pattern: sanitizeUri(...)
              - pattern: sanitizeObject(...)
              - pattern: sanitizeForDisplay(...)
              - pattern: exceptionTrace(...)

      # OWASP Encoder direct usage also neutralizes CRLF.
      - pattern: Encode.forJava(...)
      - pattern: org.owasp.encoder.Encode.forJava(...)
    pattern-sinks:
      # Log4j 2
      - patterns:
          - pattern: (org.apache.logging.log4j.Logger $LOG).$METHOD(...)
          - metavariable-regex:
              metavariable: $METHOD
              regex: ^(trace|debug|info|warn|error|fatal|log)$
      # SLF4J
      - patterns:
          - pattern: (org.slf4j.Logger $LOG).$METHOD(...)
          - metavariable-regex:
              metavariable: $METHOD
              regex: ^(trace|debug|info|warn|error)$
      # Log4j 1.x (legacy — still used in some integration classes)
      - patterns:
          - pattern: (org.apache.log4j.Logger $LOG).$METHOD(...)
          - metavariable-regex:
              metavariable: $METHOD
              regex: ^(trace|debug|info|warn|error|fatal)$
      # java.util.logging (JUL)
      - patterns:
          - pattern: (java.util.logging.Logger $LOG).$METHOD(...)
          - metavariable-regex:
              metavariable: $METHOD
              regex: ^(info|warning|severe|fine|finer|finest|config|log)$
