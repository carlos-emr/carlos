# Custom Semgrep rule: Path Traversal with PathValidationUtils sanitizer
#
# Replaces the three built-in path traversal rules that generate ~140 false
# positives across 17 files already protected by PathValidationUtils:
#   - java.lang.security.httpservlet-path-traversal.httpservlet-path-traversal
#   - java.servlets.security.httpservlet-path-traversal.httpservlet-path-traversal
#   - java.servlets.security.httpservlet-path-traversal-deepsemgrep.httpservlet-path-traversal-deepsemgrep
#
# Those built-in rules must be disabled in Semgrep Cloud policy (app.semgrep.dev)
# so that only this custom rule runs for path traversal detection.
#
# See: https://github.com/carlos-emr/carlos/issues/1433
# See also: docs/path-validation-utils.md

rules:
  - id: carlos.httpservlet-path-traversal
    message: >
      Detected a request parameter used in a file path operation without
      proper validation via PathValidationUtils. This could allow path
      traversal attacks. Use a containment-enforcing helper such as
      PathValidationUtils.validatePath(), validateExistingPath(),
      validateChildPath(), validateGeneratedChildPath(), validatePathComponent(),
      validateGeneratedFileName(), validateZipEntryPath(), validateZipEntryName(),
      or validateUpload() before the value reaches the filesystem. Note that
      resolveTrustedPath(), resolveConfiguredDirectory() and resolveConfiguredFile()
      only canonicalize a trusted value and are NOT a security boundary.
      See docs/path-validation-utils.md for usage guidance.
    severity: ERROR
    languages: [java]
    mode: taint
    metadata:
      category: security
      cwe:
        - "CWE-22: Improper Limitation of a Pathname to a Restricted Directory ('Path Traversal')"
      confidence: HIGH
      references:
        - https://owasp.org/www-community/attacks/Path_Traversal
        - https://github.com/carlos-emr/carlos/blob/develop/docs/path-validation-utils.md

    pattern-sources:
      - pattern-either:
          - patterns:
              - pattern: $REQ.$METHOD(...)
              - metavariable-type:
                  metavariable: $REQ
                  type: javax.servlet.http.HttpServletRequest
              - metavariable-regex:
                  metavariable: $METHOD
                  regex: (getParameter|getQueryString|getPathInfo|getRequestURI|getHeader)
          - patterns:
              - pattern: $REQ.$METHOD(...)
              - metavariable-type:
                  metavariable: $REQ
                  type: jakarta.servlet.http.HttpServletRequest
              - metavariable-regex:
                  metavariable: $METHOD
                  regex: (getParameter|getQueryString|getPathInfo|getRequestURI|getHeader)

    pattern-sanitizers:
      # Containment-enforcing helpers on
      # io.github.carlos_emr.carlos.utility.PathValidationUtils.
      #
      # This list is kept deliberately identical to the CodeQL barrier in
      # codeql/customizations/Customizations.qll, so Semgrep and CodeQL agree on
      # what counts as a path-traversal sanitizer in this codebase. Each entry was
      # verified against the helper's body, not assumed from its name:
      #
      #   validatePath              basename-strip + validateWithinDirectory
      #   validateExistingPath      validateWithinDirectory
      #   validateChildPath         delegates to validateExistingPath
      #   validateGeneratedChildPath  rejects / \ . .. NUL, then validateWithinDirectory
      #   validatePathComponent     rejects separators, prefixes, hidden and traversal
      #   validateGeneratedFileName normalizes to [a-zA-Z0-9._-], so no separator survives
      #   validateZipEntryPath      ZIP-slip containment (validateWithinDirectory)
      #   validateZipEntryName      validateExistingPath + canonical relativization
      #   validateUpload            containment within the allowed upload directory
      #
      # DELIBERATELY EXCLUDED — do not add without re-reading their Javadoc:
      # resolveTrustedPath, resolveConfiguredDirectory and resolveConfiguredFile
      # only canonicalize an already-trusted value and state that they are "not a
      # security boundary". isInAllowedTempDirectory / isInApplicationTempDirectory
      # return a boolean and sanitize nothing. Modelling any of these as a sanitizer
      # would hide real CWE-22 flows.
      - pattern-either:
          - pattern: PathValidationUtils.validatePath(...)
          - pattern: PathValidationUtils.validateExistingPath(...)
          - pattern: PathValidationUtils.validateChildPath(...)
          - pattern: PathValidationUtils.validateGeneratedChildPath(...)
          - pattern: PathValidationUtils.validatePathComponent(...)
          - pattern: PathValidationUtils.validateGeneratedFileName(...)
          - pattern: PathValidationUtils.validateZipEntryPath(...)
          - pattern: PathValidationUtils.validateZipEntryName(...)
          - pattern: PathValidationUtils.validateUpload(...)

      # Fully-qualified class references
      - pattern-either:
          - pattern: io.github.carlos_emr.carlos.utility.PathValidationUtils.validatePath(...)
          - pattern: io.github.carlos_emr.carlos.utility.PathValidationUtils.validateExistingPath(...)
          - pattern: io.github.carlos_emr.carlos.utility.PathValidationUtils.validateChildPath(...)
          - pattern: io.github.carlos_emr.carlos.utility.PathValidationUtils.validateGeneratedChildPath(...)
          - pattern: io.github.carlos_emr.carlos.utility.PathValidationUtils.validatePathComponent(...)
          - pattern: io.github.carlos_emr.carlos.utility.PathValidationUtils.validateGeneratedFileName(...)
          - pattern: io.github.carlos_emr.carlos.utility.PathValidationUtils.validateZipEntryPath(...)
          - pattern: io.github.carlos_emr.carlos.utility.PathValidationUtils.validateZipEntryName(...)
          - pattern: io.github.carlos_emr.carlos.utility.PathValidationUtils.validateUpload(...)

      # Wildcard static-import usage
      - patterns:
          - pattern-inside: |
              import static io.github.carlos_emr.carlos.utility.PathValidationUtils.*;
              ...
          - pattern-either:
              - pattern: validatePath(...)
              - pattern: validateExistingPath(...)
              - pattern: validateChildPath(...)
              - pattern: validateGeneratedChildPath(...)
              - pattern: validatePathComponent(...)
              - pattern: validateGeneratedFileName(...)
              - pattern: validateZipEntryPath(...)
              - pattern: validateZipEntryName(...)
              - pattern: validateUpload(...)

      # Single-member static imports
      - patterns:
          - pattern-inside: |
              import static io.github.carlos_emr.carlos.utility.PathValidationUtils.validatePath;
              ...
          - pattern: validatePath(...)
      - patterns:
          - pattern-inside: |
              import static io.github.carlos_emr.carlos.utility.PathValidationUtils.validateExistingPath;
              ...
          - pattern: validateExistingPath(...)
      - patterns:
          - pattern-inside: |
              import static io.github.carlos_emr.carlos.utility.PathValidationUtils.validateChildPath;
              ...
          - pattern: validateChildPath(...)
      - patterns:
          - pattern-inside: |
              import static io.github.carlos_emr.carlos.utility.PathValidationUtils.validateGeneratedChildPath;
              ...
          - pattern: validateGeneratedChildPath(...)
      - patterns:
          - pattern-inside: |
              import static io.github.carlos_emr.carlos.utility.PathValidationUtils.validatePathComponent;
              ...
          - pattern: validatePathComponent(...)
      - patterns:
          - pattern-inside: |
              import static io.github.carlos_emr.carlos.utility.PathValidationUtils.validateGeneratedFileName;
              ...
          - pattern: validateGeneratedFileName(...)
      - patterns:
          - pattern-inside: |
              import static io.github.carlos_emr.carlos.utility.PathValidationUtils.validateZipEntryPath;
              ...
          - pattern: validateZipEntryPath(...)
      - patterns:
          - pattern-inside: |
              import static io.github.carlos_emr.carlos.utility.PathValidationUtils.validateZipEntryName;
              ...
          - pattern: validateZipEntryName(...)
      - patterns:
          - pattern-inside: |
              import static io.github.carlos_emr.carlos.utility.PathValidationUtils.validateUpload;
              ...
          - pattern: validateUpload(...)

    pattern-sinks:
      # Unqualified names (standard import usage)
      - pattern: new File(...)
      - pattern: new FileInputStream(...)
      - pattern: new FileOutputStream(...)
      - pattern: Paths.get(...)
      - patterns:
          - pattern: Files.$METHOD(...)
          - metavariable-regex:
              metavariable: $METHOD
              regex: (newInputStream|newOutputStream|newBufferedReader|newBufferedWriter|newByteChannel|readAllBytes|readAllLines|readString|write|writeString|copy|move|delete|deleteIfExists|createFile|createDirectory|createDirectories|createTempFile|createTempDirectory)
      # Fully-qualified names (explicit package references)
      - pattern: new java.io.File(...)
      - pattern: new java.io.FileInputStream(...)
      - pattern: new java.io.FileOutputStream(...)
      - pattern: java.nio.file.Paths.get(...)
      - patterns:
          - pattern: java.nio.file.Files.$METHOD(...)
          - metavariable-regex:
              metavariable: $METHOD
              regex: (newInputStream|newOutputStream|newBufferedReader|newBufferedWriter|newByteChannel|readAllBytes|readAllLines|readString|write|writeString|copy|move|delete|deleteIfExists|createFile|createDirectory|createDirectories|createTempFile|createTempDirectory)
