# Flyway configuration for the CARLOS `oscar` database.
#
# This file holds only NON-SECRET defaults. Supply the connection and credentials at invocation
# so they never live in the repo:
#
#   flyway -configFiles=database/mysql/migration/flyway.conf \
#          -url="jdbc:mariadb://db:3306/oscar" -user=root -password="$MYSQL_PWD" info
#
# or via environment (FLYWAY_URL / FLYWAY_USER / FLYWAY_PASSWORD), or the flyway-maven-plugin
# (`mvn flyway:info -Dflyway.url=... -Dflyway.user=... -Dflyway.password=...`).
#
# Province selection: the shared 'common' set is always applied; append exactly one province
# location (on OR bc) for a given database. The default below targets an Ontario install.

flyway.locations=filesystem:database/mysql/migration/common,filesystem:database/mysql/migration/on

# The consolidated baseline is version 1. `flyway baseline -baselineVersion=1` stamps an existing
# (pre-Flyway) OpenO/oscar19 datadir at the fork point so only forward CARLOS migrations apply.
flyway.baselineVersion=1
flyway.baselineDescription=CARLOS consolidated baseline

# Adopt a non-empty existing schema on first migrate instead of erroring (conversion path).
flyway.baselineOnMigrate=true

# MariaDB/MySQL: keep each migration's statements in one transaction where the engine allows it.
# DDL is not transactional in MariaDB, so a failed migration may leave a partial change — always
# take a pre-migration backup in production (carlos-ctl db-backup) before `migrate`.
flyway.validateOnMigrate=true
