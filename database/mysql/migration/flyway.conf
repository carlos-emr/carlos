# Flyway configuration for the CARLOS `oscar` database.
#
# This file holds only NON-SECRET defaults. Supply the connection and credentials at invocation
# so they never live in the repo:
#
#   FLYWAY_URL="jdbc:mariadb://db:3306/oscar" \
#   FLYWAY_USER=root \
#   FLYWAY_PASSWORD="$MYSQL_PWD" \
#   flyway -configFiles=database/mysql/migration/flyway.conf info
#
# Maven plugin invocations should follow the same pattern with environment variables; avoid
# command-line password flags because local users can read process argv while the command runs.
#
# Province selection: the shared 'common' set is always applied; append exactly one province
# location (on OR bc) for a given database. The default below targets an Ontario install.

flyway.locations=filesystem:database/mysql/migration/common,filesystem:database/mysql/migration/on

# Conversion default: an existing (pre-Flyway) OpenO/oscar19 datadir is stamped at the FULL
# genesis — common V1 + province V1.0.1/V1.0.2 — so only forward migrations (V1.0.3+) apply.
# NEVER stamp at 1: Flyway would then re-run the province files (V1.0.1 DROPs and recreates
# province tables = data loss; V1.0.2 re-inserts reference rows = abort).
flyway.baselineVersion=1.0.2
flyway.baselineDescription=CARLOS full genesis (V1 + province V1.0.1/V1.0.2)

# Deliberately NO baselineOnMigrate here: auto-stamping a non-empty schema during `migrate` is a
# data-loss trap if pointed at the wrong datadir. Adoption is the explicit two-step —
# `flyway baseline` (stamps 1.0.2, above) then `flyway migrate`. The callers that need
# baselineOnMigrate for an EMPTY schema (release/postinst, db-schema-verify.yml) pass it
# explicitly on their own invocations.

# MariaDB/MySQL: keep each migration's statements in one transaction where the engine allows it.
# DDL is not transactional in MariaDB, so a failed migration may leave a partial change — always
# take a pre-migration backup in production (carlos-ctl db-backup) before `migrate`.
flyway.validateOnMigrate=true
