#
# Installed by the carlos-emr-drugref package at
# WEB-INF/classes/hibernate.properties, where Hibernate picks it up
# automatically at startup.
#
# WHY THIS FILE EXISTS. DrugRef's spring_config.xml sets no dialect, so
# Hibernate autodetects one from JDBC connection metadata. That path makes
# MySQL Connector/J run
#     SELECT WORD FROM INFORMATION_SCHEMA.KEYWORDS WHERE RESERVED=1
# because MariaDB 11.8 reports a server version >= 8.0 — but RESERVED is a
# MySQL-only column that MariaDB's KEYWORDS table does not have. The query
# throws, Hibernate concludes it "could not determine Dialect", the
# entityManagerFactory bean fails, and the whole /drugref2 context refuses to
# deploy. Verified live on Ubuntu 26.04 / MariaDB 11.8.6 / Connector/J 9.1.
#
# Naming the dialect skips autodetection entirely. Hibernate 7 logs
# HHH90000025 claiming the property is unnecessary — that advice assumes the
# metadata probe works, which is exactly what fails here; ignore it.
hibernate.dialect=org.hibernate.dialect.MariaDBDialect
