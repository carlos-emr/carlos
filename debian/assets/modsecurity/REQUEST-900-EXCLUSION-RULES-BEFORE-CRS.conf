#
# Site exclusions that must run BEFORE the CRS rules.
#
# Use this file for exclusions that have to suppress a rule for a whole
# request — SecRuleRemoveById, SecRuleRemoveByTag, ctl:ruleRemoveById in a
# phase-1 SecRule keyed on REQUEST_URI. Exclusions that only need to unhook
# one argument from one rule belong in the AFTER-CRS file instead, because
# they need the rule to exist first.
#
# This file is a dpkg conffile: your edits survive upgrades and dpkg will
# offer a merge if the package ever ships new content here.
#
# Empty by default. `carlos-ctl waf tail` prints the rule id, the matched
# variable and the request path for every block, which is the input for an
# entry in one of the two files. Forms that belong HERE (they act before the
# rules load, keyed on the request):
#
#   SecRule REQUEST_URI "@beginsWith /carlos/eform/" \
#       "id:1001,phase:1,pass,nolog,ctl:ruleRemoveById=942100"
#
# SecRuleUpdateTargetById / SecRuleUpdateActionById MODIFY an already-loaded
# rule and therefore belong in RESPONSE-999-EXCLUSION-RULES-AFTER-CRS.conf,
# which documents the narrow-before-broad guidance.
