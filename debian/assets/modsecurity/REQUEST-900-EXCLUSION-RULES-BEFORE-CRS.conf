        ctl:ruleRemoveTargetByTag=attack-rce;ARGS:admission.dischargeNotes,\
        ctl:ruleRemoveTargetByTag=attack-injection-php;ARGS:admission.dischargeNotes,\
        ctl:ruleRemoveTargetByTag=attack-protocol;ARGS:admission.dischargeNotes,\
        ctl:ruleRemoveTargetByTag=attack-lfi;ARGS:admission.dischargeNotes,\
        ctl:ruleRemoveTargetByTag=attack-rfi;ARGS:admission.dischargeNotes"

# 1140: the chart launchers' GET link (appointment sheet, document viewer, patient
# search, patient page "E"), whose `reason` is page-generated text: the
# appointment's reason, a fixed label such as "Document Notes", or empty. That
# text is clinician prose (an appointment reason can carry a pasted link), so it
# is exempted; the link's other arguments are page-generated and stay inspected:
# `encType` in particular is a fixed label the action also validates against
# [a-zA-Z0-9_ ]{1,50}, so no legitimate value can score. No launcher puts TYPED
# text on this link: the patient page's old custom telephone-encounter reason
# (add2url) had no markup left to invoke it and has been removed.
SecRule REQUEST_URI "@rx ^/carlos/encounter/IncomingEncounter(?:[;?]|$)" \
    "id:1140,phase:1,pass,nolog,chain"
    SecRule REQUEST_METHOD "@streq GET" \
        "t:none,\
        ctl:ruleRemoveTargetByTag=attack-sqli;ARGS:reason,\
        ctl:ruleRemoveTargetByTag=attack-rce;ARGS:reason,\
        ctl:ruleRemoveTargetByTag=attack-injection-php;ARGS:reason,\
        ctl:ruleRemoveTargetByTag=attack-protocol;ARGS:reason,\
        ctl:ruleRemoveTargetByTag=attack-lfi;ARGS:reason,\
        ctl:ruleRemoveTargetByTag=attack-rfi;ARGS:reason"

# 1141: tickler list: the DataTables search box. The list is fetched by GET with the
# typed search term in the query string (search[value]), so searching ticklers for the
# same prose that 1104 lets a clinician save — a pasted link, "H&P" — answered the list
# request 403 and DataTables reported an AJAX error. Found by tickler-crud-playwright-
# checks.js the moment its message carried the scoring text: it finds its row by
# searching for the message. A search term is free text like the messages it searches.
SecRule REQUEST_URI "@rx ^/carlos/tickler/ListTicklers(?:[;?]|$)" \
    "id:1141,phase:1,pass,nolog,chain"
    SecRule REQUEST_METHOD "@streq GET" \
        "t:none,\
        ctl:ruleRemoveTargetByTag=attack-sqli;ARGS:search[value],\
        ctl:ruleRemoveTargetByTag=attack-rce;ARGS:search[value],\
        ctl:ruleRemoveTargetByTag=attack-injection-php;ARGS:search[value],\
        ctl:ruleRemoveTargetByTag=attack-protocol;ARGS:search[value],\
        ctl:ruleRemoveTargetByTag=attack-lfi;ARGS:search[value],\
        ctl:ruleRemoveTargetByTag=attack-rfi;ARGS:search[value]"

# 1142: provider encounter-note templates (Administration > Provider Templates,
# providertemplate.jsp). ARGS:value is the body of a template a provider writes
# once and inserts into encounter notes from the chart, so it is note prose by
# construction and false-positives on the same shapes as the note itself; the
# per-argument survey behind carlos-emr/carlos#3623 found the save answered 403
# on the plain "Reviewed labs with the patient; find attached the CBC" sentence
# (932100/932110). The route is gated by `_newCasemgmt.templates` write.
# ARGS:name stays inspected: the page constrains it to [a-zA-Z0-9\s] and the
# action looks the template up by it. Back to POST after the two GET rules.
#
# Keyed on the operation as well as the route, the way the generated form rules
# key on form_class: ProviderTemplate2Action reads ARGS:value on exactly one
# branch, dboperation=Save (the page posts " Save ", the action trims it). The
# Edit and Delete POSTs to this route ignore the argument, so a payload in
# ARGS:value on them buys an attacker nothing at the application and there is
# no reason to stop scoring it. ARGS:dboperation is a body argument, so this
# rule runs in phase 2, where the body is parsed; the CRS content rules are
# phase 2 too and this file loads before them, so the removal still lands first.
#
# WHAT REMAINS BETWEEN A PAYLOAD IN ARGS:value AND A READER, since removing the
# sqli family from a stored value is the part of this rule worth justifying.
# Checked against the code, not assumed:
#   * reaching the argument at all needs `_newCasemgmt.templates` WRITE. This is
#     an authenticated administrative surface, not a patient- or internet-facing
#     one, and anyone who holds that right can already author template text by
#     design — that IS the feature.
#   * the value never reaches a SQL parser as code. EncounterTemplateDaoImpl is
#     JPA: createQuery with bound positional parameters for reads, merge/persist
#     for writes, so a SQLi payload is stored and returned as text.
#   * attack-xss is NOT removed here (it is not one of the six), so script
#     payloads in this argument are still scored at the front door.
#   * every path that renders a template body is encoded or non-markup:
#     providertemplate.jsp and providerencountersingle.jsp use SafeEncode.forHtml,
#     InsertTemplate.jsp uses <carlos:encode context="javaScriptBlock">, and
#     InsertTemplate2.jsp writes it raw ONLY because that response is text/plain
#     and the chart assigns it to a textarea value.
# ProseSinkEncodingRegressionTest pins the last two of those, so the assumption
# cannot rot silently.
SecRule REQUEST_URI "@rx ^/carlos/admin/ProviderTemplate(?:[;?]|$)" \
    "id:1142,phase:2,pass,nolog,chain"
    SecRule REQUEST_METHOD "@streq POST" \
        "chain"
        SecRule ARGS:dboperation "@rx ^\s*[Ss][Aa][Vv][Ee]\s*$" \
            "t:none,\
            ctl:ruleRemoveTargetByTag=attack-sqli;ARGS:value,\
            ctl:ruleRemoveTargetByTag=attack-rce;ARGS:value,\
            ctl:ruleRemoveTargetByTag=attack-injection-php;ARGS:value,\
            ctl:ruleRemoveTargetByTag=attack-protocol;ARGS:value,\
            ctl:ruleRemoveTargetByTag=attack-lfi;ARGS:value,\
            ctl:ruleRemoveTargetByTag=attack-rfi;ARGS:value"
