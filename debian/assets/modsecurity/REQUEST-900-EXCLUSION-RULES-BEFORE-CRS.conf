#
# Site exclusions that must run BEFORE the CRS rules.
#
# Use this file for exclusions that have to suppress a rule for a whole
# request — SecRuleRemoveById, SecRuleRemoveByTag, ctl:ruleRemoveById in a
# phase-1 SecRule keyed on REQUEST_URI. Exclusions that only need to unhook
# one argument from one rule belong in the AFTER-CRS file instead, because
# they need the rule to exist first.
#
# This file is a dpkg conffile. It is PACKAGE-MANAGED: CARLOS ships the
# clinical-workflow exclusions below (id range 1000-1999) and may add to them
# in future releases. Put YOUR OWN site exclusions in the operator-owned files
# instead, so a package update to this file never triggers a dpkg merge prompt
# on a rule you edited:
#
#   /etc/carlos-emr/modsecurity/local-exclusions-before-crs.conf  (ids 5000-5999)
#   /etc/carlos-emr/modsecurity/local-exclusions-after-crs.conf
#
# `carlos-ctl waf tail` prints the rule id, the matched variable and the request
# path for every block — the exact input for a new exclusion. Forms that belong
# HERE / in local-exclusions-before-crs.conf (they act before the rules load,
# keyed on the request):
#
#   SecRule REQUEST_URI "@beginsWith /carlos/eform/" \
#       "id:5001,phase:1,pass,nolog,ctl:ruleRemoveById=942100"
#
# SecRuleUpdateTargetById / SecRuleUpdateActionById MODIFY an already-loaded
# rule and therefore belong in the AFTER-CRS files, which document the
# narrow-before-broad guidance.
#
# ---------------------------------------------------------------------------
# Package-shipped clinical-workflow exclusions (ids 1000-1999)
# ---------------------------------------------------------------------------
# CARLOS is a legacy JSP EMR that posts clinical free text and base64 image
# blobs from a handful of routes. At CRS paranoia level 1 with anomaly
# threshold 5 (see crs-overrides.conf) a single CRITICAL signature match blocks
# the whole request with 403. Every exclusion below is chained to POST (so the
# entire GET surface — including anything probe-shaped — stays fully inspected)
# and scoped to ONE route.
#
# Most are per-argument: they unhook only the named argument from only the noisy
# attack tag groups, leaving every other argument on the route — and every other
# rule on the excluded argument — fully inspected. TWO go slightly wider, each
# annotated at its rule with the reason and the tracked follow-up:
#   - id 1010 additionally removes ONE rule (932110, Windows-RCE) on
#     ARGS:reloadUrl — narrowly, by id, not by the whole attack-rce tag, which
#     also carries the Unix/PowerShell rules and the REQUEST-944 Java-RCE family
#     and would leave RCE detection on that value uncompensated. Every other
#     RCE/LFI/traversal rule still scores reloadUrl and every other argument.
#   - id 1040 removes CRS rules 941130/941170 by id for the whole
#     /eform/addEForm POST (the un-enumerable signature data-URI fields), so
#     those two attribute-XSS signatures no longer score ANY field on that one
#     route. See its comment and carlos-emr/carlos#3552.
# The route match is path-anchored (@rx ^…(?:[;?]|$) on REQUEST_URI, not a bare
# @beginsWith): the request-wide id 1040 in particular must not be carried onto
# a DIFFERENT action reached by Tomcat path/matrix-param confusion
# (…/addEForm/..;/otherAction). When adding an exclusion, prefer the
# per-argument tag form; reach for a whole-rule ruleRemoveById only when the
# argument name cannot be enumerated, and document the residual scope inline.

# eChart CPP progress-note / history-item save: the note body arrives in
# ARGS:value as clinical prose (apostrophes, "or", "s/p", drug names, angle
# brackets) that trips the SQLi/XSS keyword rules. ARGS:reloadUrl carries an
# app-generated internal redirect URL whose OWN nested query string
# (…&method=…&issue_code=…&cmd=divR1I1) makes the Windows-RCE rule 932110 match
# the literal "&cmd", 403-ing every encounter-note save through the front door.
# reloadUrl IS an attacker-controllable POST parameter, so the safety does not
# rest on "the client won't send anything bad": its value is server-side
# validated on the only sink that consumes it (the listCPPNotes redirect goes
# through RedirectValidationUtils; the rest is parsed for issue_code, reflected
# nowhere). So unhook only the noisy signatures that actually false-positive —
# SQLi/XSS keyword tags on the two args, and ONLY rule 932110 on reloadUrl (not
# the whole attack-rce tag, which would also drop Unix/PowerShell/Java RCE) —
# and only on POST to this route. Stored-XSS defence for the note body remains
# the application's CI-enforced context-aware output encoding.
SecRule REQUEST_URI "@rx ^/carlos/CaseManagementEntry(?:[;?]|$)" \
    "id:1010,phase:1,pass,nolog,chain"
    SecRule REQUEST_METHOD "@streq POST" \
        "t:none,\
        ctl:ruleRemoveTargetByTag=attack-sqli;ARGS:value,\
        ctl:ruleRemoveTargetByTag=attack-xss;ARGS:value,\
        ctl:ruleRemoveTargetByTag=attack-sqli;ARGS:reloadUrl,\
        ctl:ruleRemoveTargetByTag=attack-xss;ARGS:reloadUrl,\
        ctl:ruleRemoveTargetById=932110;ARGS:reloadUrl"

# Signature pad upload: ARGS:signatureImage is a 50-200 KB base64 data-URI
# (canvas.toDataURL) whose random base64 matches SQLi/XSS/RCE keyword rules.
# The endpoint (SaveSignatureUpload2Action) strictly validates the base64 and
# caps the size server-side. Unhook only that argument, only on POST.
SecRule REQUEST_URI "@rx ^/carlos/signature_pad/SaveSignatureUpload(?:[;?]|$)" \
    "id:1020,phase:1,pass,nolog,chain"
    SecRule REQUEST_METHOD "@streq POST" \
        "t:none,\
        ctl:ruleRemoveTargetByTag=attack-sqli;ARGS:signatureImage,\
        ctl:ruleRemoveTargetByTag=attack-xss;ARGS:signatureImage,\
        ctl:ruleRemoveTargetByTag=attack-rce;ARGS:signatureImage"

# eForm save: the floating toolbar's appendImageInputs() serializes every image
# on the form into hidden ARGS:openosp-image-link inputs as
# {"id":...,"value":"data:image/png;base64,..."} so JS-set images (signature
# captures, letterheads) survive save/PDF render. The data:image/...;base64
# prefix matches the XSS attribute-vector rules (941130/941170, anomaly 33 on a
# real save) and 403s the save — confirmed live via the modsec audit log. The
# value is consumed as an image source and re-encoded by the eForm render
# pipeline, never reflected raw. Only this argument, only on POST to the save
# route; every other argument (the form fields themselves) stays inspected.
SecRule REQUEST_URI "@rx ^/carlos/eform/addEForm(?:[;?]|$)" \
    "id:1030,phase:1,pass,nolog,chain"
    SecRule REQUEST_METHOD "@streq POST" \
        "t:none,\
        ctl:ruleRemoveTargetByTag=attack-sqli;ARGS:openosp-image-link,\
        ctl:ruleRemoveTargetByTag=attack-xss;ARGS:openosp-image-link,\
        ctl:ruleRemoveTargetByTag=attack-rce;ARGS:openosp-image-link"

# The same save also carries data:image/...;base64 URIs in the eForm's OWN
# fields (signature pads persist the drawn signature into a form field, and
# field names are form-author-defined, so no ARGS list can enumerate them).
# 941130/941170 both fire on the "data:image/...;base64" prefix itself —
# confirmed via the audit log on a live save (each is +5..+8, blocking alone).
# Remove exactly those two data-URI signatures for this POST; every other XSS/
# SQLi/RCE rule still scores all fields, and stored-XSS defence for rendered
# eForms remains the application's CI-enforced context-aware output encoding.
#
# ACCEPTED RESIDUAL SCOPE (tracked in carlos-emr/carlos#3552): because the
# signature fields are un-enumerable, this is request-wide, so 941130/941170 no
# longer score the OTHER eForm fields either — an authenticated submitter's
# data:text/html;base64, javascript:, xlink:href or bare formaction= in an
# author-named field is not caught HERE (it becomes stored XSS only through an
# output-encoding gap, the app-side control). No narrower pure-WAF form exists.
# The real fix is app-side: route signature data-URIs through the enumerable
# openosp-image-link channel (as appendImageInputs() already does for <img src>),
# after which this rule drops to a 1030-style per-argument removal. Do NOT widen
# this beyond 941130/941170 or beyond POST /carlos/eform/addEForm.
SecRule REQUEST_URI "@rx ^/carlos/eform/addEForm(?:[;?]|$)" \
    "id:1040,phase:1,pass,nolog,chain"
    SecRule REQUEST_METHOD "@streq POST" \
        "t:none,\
        ctl:ruleRemoveById=941130,\
        ctl:ruleRemoveById=941170"

# eForm TEMPLATE EDITOR save (Administration > eForms > edit an eForm, or
# "Create In Editor"). ARGS:formHtml on this route IS an HTML document — it is
# the eForm's own source, authored in a 40-row <textarea> — so the CRS
# HTML/XSS/RCE signatures necessarily match it on every legitimate save. A real
# save of the stock "Rich Text Letter" scored 949110 off 921130, 932100,
# 932110, 932130, 933210, 934100 and the whole 941xxx family at once, and the
# operator got nginx's bare 403 with no application log line — "editing eForms
# does not seem to save", reported by a tester on 2026.08.0-alpha8 and
# reproduced live on alpha9 through the packaged front door.
#
# This CANNOT reproduce in the devcontainer: that stack has no WAF, so the
# editor works there and the failure is deb-deployment-only.
#
# SCOPE. Per-argument removal (the tight 1030 form, not the request-wide 1040
# form): only ARGS:formHtml, only POST, only this route. Every other argument
# on the save — formName, formSubject, formFileName, roleType — stays fully
# inspected by CRS. The route is gated by `_eform` WRITE in HtmlEdit2Action,
# i.e. this is an authenticated eForm-administrator surface, not a patient- or
# internet-facing one; anyone who can reach it can already author arbitrary
# form markup by design, which is the feature.
#
# Stored-XSS defence for the markup this accepts remains where it belongs: the
# application's CI-enforced context-aware output encoding when a saved eForm is
# rendered. Do NOT widen this to other arguments, other methods, or other
# routes — in particular do not extend it to the eForm INSTANCE save
# (/eform/addEForm), which has its own narrowly-scoped rules 1030 and 1040.
#
# TWO ADDITIONS after the first version of this rule shipped and the tester
# still got a 403 on alpha9. Both are about WHERE the document is scored, not
# about trusting it more.
#
# 1) REQUEST_BODY, not just ARGS:formHtml. This one save reaches the server in
#    two different encodings. efmformmanageredit.jsp declares
#    enctype="multipart/form-data", but it also calls registerFormSubmit(),
#    which exists only on the Administration panel shell
#    (administration/index.jsp) and re-serialises the form as
#    application/x-www-form-urlencoded into an $.ajax call. So an administrator
#    working the normal way — Administration > eForms, page inside
#    #dynamic-content — sends urlencoded, while opening the editor standalone
#    sends multipart. ModSecurity populates REQUEST_BODY for the urlencoded
#    shape only, and the CRS rules that list REQUEST_BODY among their targets
#    (921110 and the 944100-944130 Java family, all CRITICAL at PL1, so +5 and
#    blocking on their own) therefore kept scoring the whole eForm document in
#    exactly the shape a real administrator produces. The per-argument removal
#    could never reach them: REQUEST_BODY is a different variable, not an ARGS
#    member.
#
#    RESIDUAL SCOPE, stated plainly: on this ONE route, for POST only, those
#    tag families no longer inspect the raw request body. Every ARGS on the
#    request other than formHtml — formName, formSubject, formFileName,
#    roleType — is still fully inspected by every one of them, and the body of
#    this route carries nothing but those arguments plus the eForm source that
#    is already excluded per-argument. This is the same trade rule 1040
#    documents for an un-enumerable field, narrowed to one route.
#
# 2) attack-lfi and attack-rfi. Rule 930110 is CRITICAL at PL1 and matches a
#    bare "../" in ARGS after t:cmdLine strips quoting, so
#    href="../../images/logo.png" — which eForm source contains by
#    construction, and which struts-eform.xml documents as the stored form of
#    an eForm image reference — blocks the save on its own, in BOTH encodings.
#    The original five-tag list was derived from one observed audit trace of a
#    probe document that happened to contain no parent-relative path.
SecRule REQUEST_URI "@rx ^/carlos/eform/editForm(?:[;?]|$)" \
    "id:1050,phase:1,pass,nolog,chain"
    SecRule REQUEST_METHOD "@streq POST" \
        "t:none,\
        ctl:ruleRemoveTargetByTag=attack-sqli;ARGS:formHtml,\
        ctl:ruleRemoveTargetByTag=attack-xss;ARGS:formHtml,\
        ctl:ruleRemoveTargetByTag=attack-rce;ARGS:formHtml,\
        ctl:ruleRemoveTargetByTag=attack-injection-php;ARGS:formHtml,\
        ctl:ruleRemoveTargetByTag=attack-protocol;ARGS:formHtml,\
        ctl:ruleRemoveTargetByTag=attack-lfi;ARGS:formHtml,\
        ctl:ruleRemoveTargetByTag=attack-rfi;ARGS:formHtml,\
        ctl:ruleRemoveTargetByTag=attack-sqli;REQUEST_BODY,\
        ctl:ruleRemoveTargetByTag=attack-xss;REQUEST_BODY,\
        ctl:ruleRemoveTargetByTag=attack-rce;REQUEST_BODY,\
        ctl:ruleRemoveTargetByTag=attack-injection-php;REQUEST_BODY,\
        ctl:ruleRemoveTargetByTag=attack-protocol;REQUEST_BODY,\
        ctl:ruleRemoveTargetByTag=attack-lfi;REQUEST_BODY,\
        ctl:ruleRemoveTargetByTag=attack-rfi;REQUEST_BODY"

# The SAME eForm-authoring payload reaches the server through two more routes
# from the same "Create eForm" menu (efmTopNav.jspf), and rule 1050 above does
# not cover either — verified live on a packaged install: both return CRS 949110
# (403) while the editForm route returns 200 with the identical document.
#
#   1060  eForm Generator. eformGenerator.jsp's toSave form POSTs the generated
#         document as ARGS:formHtmlG to /eform/efmformmanageredit (the editor
#         then renders it for review; the eventual persist goes through
#         /eform/editForm, which 1050 already covers). The generator emits a
#         `url(data:image/png;base64,...)` scrollgrabber rule unconditionally,
#         and per the note on rule 1040 above, 941130/941170 fire on that prefix
#         alone at +5..+8 — over the threshold of 5 by themselves. So this POST
#         is blocked on EVERY use and the laid-out form is lost with no
#         application log line. ViewEFormPage2Action explicitly permits this
#         POST, so the application expects it.
#
#   1070  Visual eForm Editor. visualEformEditor.jsp sends the document as JSON
#         to POST /ws/rs/eform/json (create) and PUT /ws/rs/eform/<fid>/json
#         (update). main.conf enables the JSON body processor, so the body is
#         flattened and the document is scored as ARGS:json.formHtml — that
#         exact argument name is what the audit log shows matching. Both
#         endpoints are gated by `_eform` WRITE in EFormService, the same
#         privilege as HtmlEdit2Action, so the trust boundary is identical to
#         1050's.
#
# Same narrowing as 1050 in both cases: per-argument, only these routes, only
# the mutating methods. Every other argument stays fully inspected, and stored
# XSS defence remains the application's context-aware output encoding at render.
#
# Both carry attack-lfi and attack-rfi for the same reason 1050 does: 930110 is
# CRITICAL at PL1 and matches a bare "../" anywhere in the argument, so any
# eForm whose source references an image or stylesheet by a parent-relative
# path blocks the save on that signature alone. Neither needs 1050's
# REQUEST_BODY companion: 1060 posts a plain urlencoded form whose only large
# field is the excluded formHtmlG, and 1070 posts JSON, which main.conf's JSON
# body processor flattens to ARGS:json.* without populating REQUEST_BODY.
SecRule REQUEST_URI "@rx ^/carlos/eform/efmformmanageredit(?:[;?]|$)" \
    "id:1060,phase:1,pass,nolog,chain"
    SecRule REQUEST_METHOD "@streq POST" \
        "t:none,\
        ctl:ruleRemoveTargetByTag=attack-sqli;ARGS:formHtmlG,\
        ctl:ruleRemoveTargetByTag=attack-xss;ARGS:formHtmlG,\
        ctl:ruleRemoveTargetByTag=attack-rce;ARGS:formHtmlG,\
        ctl:ruleRemoveTargetByTag=attack-injection-php;ARGS:formHtmlG,\
        ctl:ruleRemoveTargetByTag=attack-protocol;ARGS:formHtmlG,\
        ctl:ruleRemoveTargetByTag=attack-lfi;ARGS:formHtmlG,\
        ctl:ruleRemoveTargetByTag=attack-rfi;ARGS:formHtmlG"

SecRule REQUEST_URI "@rx ^/carlos/ws/rs/eform/(?:[0-9]+/)?json(?:[;?]|$)" \
    "id:1070,phase:1,pass,nolog,chain"
    SecRule REQUEST_METHOD "@rx ^(?:POST|PUT)$" \
        "t:none,\
        ctl:ruleRemoveTargetByTag=attack-sqli;ARGS:json.formHtml,\
        ctl:ruleRemoveTargetByTag=attack-xss;ARGS:json.formHtml,\
        ctl:ruleRemoveTargetByTag=attack-rce;ARGS:json.formHtml,\
        ctl:ruleRemoveTargetByTag=attack-injection-php;ARGS:json.formHtml,\
        ctl:ruleRemoveTargetByTag=attack-protocol;ARGS:json.formHtml,\
        ctl:ruleRemoveTargetByTag=attack-lfi;ARGS:json.formHtml,\
        ctl:ruleRemoveTargetByTag=attack-rfi;ARGS:json.formHtml"

# Provider signature stamp (Preferences > Signature Stamp > draw > Save).
# providerpreference.jsp:1851 posts the pad's canvas.toDataURL() output as
#   method=saveDrawn&signatureData=<encodeURIComponent(data:image/png;base64,...)>
# Single-encoded, so ModSecurity's ARGS decode hands 941130/941170 the literal
# "data:image/...;base64" prefix and — per the note on rule 1040 — those two
# score +5..+8 between them, over the anomaly threshold of 5 on their own.
# Verified live through the packaged front door: the clinician draws a
# signature, clicks Save, and gets the page's own "Save failed. Please try
# again." banner with an nginx 403 and no application log line; retrying can
# never succeed. Same defect class as rules 1020/1030/1040, on the one
# signature route they did not cover.
#
# This is NOT reproducible in the devcontainer: that stack has no WAF.
#
# SCOPE. Per-argument (the tight 1020/1030 form): only ARGS:signatureData, only
# POST, only this route. Every other argument on the request — method,
# providerNo — stays fully inspected, and the sibling routes are untouched:
# provider/providerSignatureImage only ever reads providerNo, and the `upload`
# method on THIS route sends a multipart FormData file rather than a data URI,
# so neither needs an exclusion and neither gets one.
#
# The value is not trusted on the strength of this exclusion.
# ProviderSignatureStamp2Action requires `w` access, rejects non-POST for every
# mutating method, strips the data-URI prefix, strictly Base64-decodes the
# remainder (rejecting anything that is not valid base64), caps it at
# MAX_SIGNATURE_BYTES (512 KB), and then decodes it as a real image with
# dimensions capped at 1000x400 before it is written as a .png. It is stored as
# an image file and served back as one, never reflected into a page.
SecRule REQUEST_URI "@rx ^/carlos/provider/providerSignatureStamp(?:[;?]|$)" \
    "id:1080,phase:1,pass,nolog,chain"
    SecRule REQUEST_METHOD "@streq POST" \
        "t:none,\
        ctl:ruleRemoveTargetByTag=attack-sqli;ARGS:signatureData,\
        ctl:ruleRemoveTargetByTag=attack-xss;ARGS:signatureData,\
        ctl:ruleRemoveTargetByTag=attack-rce;ARGS:signatureData"
