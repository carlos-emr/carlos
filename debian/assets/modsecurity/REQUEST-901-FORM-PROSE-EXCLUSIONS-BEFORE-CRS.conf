# Clinician free text on the encounter forms (ids 1200-1399)
# ------------------------------------------------------------
# The encounter forms (Rourke, antenatal, palliative care, mental health and
# the rest) are the largest pool of clinician prose in CARLOS, and nearly all
# of them save through one generic route, /form/formname, which reads every
# posted parameter by name into that form's table. At CRS paranoia level 1
# ordinary prose in those cells (a pasted link with "&cmd=", a note beginning
# with an internal IP address, "select ... and order") scores as an attack
# and the packaged front door answers 403 before the application sees the
# save. See rule 1010 in REQUEST-900-EXCLUSION-RULES-BEFORE-CRS.conf for the
# rule ids and tag families involved; the treatment here is the same,
# per argument, per route, and additionally per form.
#
# Each rule below is keyed on the save route, POST, and — for the generic
# route — the form's own form_class parameter, so a Rourke field name is
# exempt only when a Rourke form is being saved. The targets are the form's
# <textarea> cells and the single-line inputs whose names mark them as
# narrative boxes (see the generator's PROSE_INPUT_NAME); dates, codes,
# numbers, ids and form_class itself stay fully inspected, as does every
# other argument on these routes. Nothing here is request-wide. The XSS
# family is NOT removed: the CRS XSS rules did not fire on any measured
# prose shape at paranoia level 1, and legacy form views render stored
# cells raw, so that layer stays on every cell as defence in depth.
#
# The form_class-keyed rules are phase 2 (the POST body is parsed there);
# the CRS content-attack rules are phase 2 as well, and this file loads
# before them, so the exclusions still apply first. Route-only rules stay
# phase 1 like the rest of the BEFORE-CRS exclusions.
# 48 rules, 1243 free-text cells, ids 1200-1247.

