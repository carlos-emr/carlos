# GENERATED FILE — do not edit by hand. Regenerate with
#     python3 scripts/waf/generate-form-prose-exclusions.py
# after changing any JSP under src/main/webapp/WEB-INF/jsp/form.
# FormProseWafExclusionRegressionTest fails the build when this file and
# the form JSPs disagree.
#
# Clinician free text on the encounter forms whose cell names a ctl target
# cannot carry
# ------------------------------------------------------------------------
# REQUEST-901-FORM-PROSE-EXCLUSIONS-BEFORE-CRS.conf exempts each form's
# narrative cells per route, per form_class and per literal argument name.
# The names below cannot be written that way: libmodsecurity 3.0.14 rejects
# a regex target inside a ctl action and rejects parentheses in a literal one
# ("ARGS:value(subjective)" fails nginx -t, quoted or not). It does accept
# an anchored regex in a config-time SecRuleUpdateTargetByTag, so these cells
# are exempted here, the same way RESPONSE-999-EXCLUSION-RULES-AFTER-CRS.conf
# handles the measurement, manual-lab, contact and waiting-list rows.
#
# One shape, derived from the JSPs by the generator (never hand-listed):
#   value(subjective)   the Vascular Tracker's map-backed cells, spelled
#                       literally with each metacharacter bracketed
#
# A config-time update is NOT route-scoped: an argument of exactly that name is
# exempt on any route. That is accepted here only because these value(<key>)
# names are read solely by the form-save actions and are not generic. Every
# pattern is anchored at both ends. Row-indexed cells (comment_<n>,
# descOther<n>) are deliberately NOT here: their prefix is generic and, e.g.,
# rx/prescribe.jsp posts the prescription comment as comment_<rand>, so a
# global ^comment_[0-9]+$ would unscore that field and give a forged POST a
# rule-free name on any route. They stay fully inspected. The XSS family is
# deliberately NOT removed, here or in the BEFORE-CRS file: the CRS XSS rules
# did not fire on any measured prose shape at paranoia level 1 and the legacy
# form views render stored cells raw, so that layer stays on as defence in
# depth. Nothing here is request-wide.
# 35 anchored patterns, 210 lines.

