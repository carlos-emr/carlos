#
# Site exclusions that run AFTER the CRS rules are loaded.
#
# This is where SecRuleUpdateTargetById and SecRuleUpdateActionById belong:
# they modify a rule, so the rule must already be defined.
#
# This file is a dpkg conffile — your edits survive package upgrades.
#
# The entries below are the ones a stock CARLOS install needs. Each one names
# the workflow it protects, because an exclusion with no explanation is
# indistinguishable from a mistake three years later.

# CSRFGuard tokens are long random strings that the SQLi and XSS rule groups
# read as encoded payloads. The parameter name MUST match the application's
# configured CsrfGuard TokenName — Owasp.CsrfGuard.properties sets
# `org.owasp.csrfguard.TokenName=CSRF-TOKEN`, so the request parameter (and
# header) is `CSRF-TOKEN`. The earlier `OWASP_CSRFTOKEN` was CSRFGuard's default
# *SessionKey*, a server-side session attribute that never appears in a request:
# excluding it suppressed no real false positive while leaving an attacker a
# rule-free parameter name to smuggle SQLi/XSS payloads past these two groups.
# Keyed on the real name the exclusion is also gated by CSRFGuard's own token
# validation — a request whose CSRF-TOKEN is an injection string rather than a
# valid token is rejected before it can reach a sink.
SecRuleUpdateTargetByTag "attack-sqli" "!ARGS:CSRF-TOKEN"
SecRuleUpdateTargetByTag "attack-xss"  "!ARGS:CSRF-TOKEN"

# The session cookie is base64-ish and trips the same groups on every request
# once it happens to contain a matching substring. The name is ANCHORED:
# `/JSESSIONID/` is an unanchored regex that also matches any attacker-named
# cookie merely CONTAINING the substring (e.g. `xJSESSIONIDx`), which would strip
# that cookie's value from the SQLi/XSS groups and hand the attacker a WAF-blind
# channel. `/^JSESSIONID$/` matches only the real Tomcat session cookie.
SecRuleUpdateTargetByTag "attack-sqli" "!REQUEST_COOKIES:/^JSESSIONID$/"
SecRuleUpdateTargetByTag "attack-xss"  "!REQUEST_COOKIES:/^JSESSIONID$/"

# ---------------------------------------------------------------------------
# Clinician free text in per-row fields (names generated with a row index)
# ---------------------------------------------------------------------------
# Every other prose exclusion in this deployment lives in the BEFORE-CRS file
# as a per-route ctl action naming one literal argument, and that is the
# policy: an exemption is scoped to the one route and the one argument that
# needs it. Four fields cannot be written that way. Their parameter names
# carry a row counter that the page generates as the clinician adds rows:
#
#   comments-<n>                the measurement page's comment box per row
#                               (/encounter/Measurements, /encounter/Measurements2)
#   test_<n>.labnotes           the manual lab entry's notes per test
#                               (/oscarMDS/SubmitLab, n = 1..test_num)
#   contact_<n>.note            the patient-contacts page's note per contact
#                               (/demographic/Contact, n = 1..contact_num)
#   waitingListBean[<n>].note   the waiting-list note per row
#                               (/waitinglist/SetupDisplayWaitingList)
#
# There is no upper bound to enumerate: the clinician decides how many rows
# exist. libmodsecurity 3.0.14 rejects a regex target inside a ctl action
# ("ctl:ruleRemoveTargetByTag=attack-sqli;ARGS:/^comments-[0-9]+$/" fails
# nginx -t with "Expecting an action"), but it accepts one here, in a
# config-time SecRuleUpdateTargetByTag, and it works: measured on the
# packaged install, a comment beginning with an internal PACS link reaches
# the application with these in place and answers nginx's 403 without them.
#
# What is different about this form, and why it is acceptable here: a
# config-time update cannot be conditioned on the request, so these apply to
# an argument of that NAME on any route, not only the four above. That is a
# deliberate, narrow departure from per-route scoping, taken because
#   - each pattern is anchored at both ends and matches only the exact shape
#     the page generates; a name that merely contains "comments-" or "note"
#     still scores;
#   - only the four handlers read these names, and they store the text
#     through parameterised writes and render it through the CI-enforced
#     null-safe encoder, which is the stored-XSS defence on every prose
#     exclusion in this deployment;
#   - every other argument on those routes, and every argument of any other
#     name on any route, keeps the full rule set; the probe injections in
#     docs/ui-tests/deb-install-validation.md still 403.
# The clean end state is an application-side rename to a fixed, repeated
# name (ARGS:labnotes matches every occurrence of a repeated parameter), at
# which point each field moves to a per-route literal entry in the BEFORE-CRS
# file and its pattern below is deleted. Do NOT add patterns here for fields
# whose names are fixed: those belong in the BEFORE-CRS file, per route.
# The six tags are the families that misread prose (see rule 1010 in the
# BEFORE-CRS file). The XSS family is deliberately NOT here: the CRS XSS rules
# did not fire on any measured prose shape, and these names have a global scope
# in this file, so the XSS layer stays on them as defence in depth.
#
# Regression test: ClinicalProseWafExclusionRegressionTest pins exactly these
# four patterns, anchored, six tags each, and nothing broader in this file.
SecRuleUpdateTargetByTag "attack-sqli"          "!ARGS:/^comments-[0-9]+$/"
SecRuleUpdateTargetByTag "attack-rce"           "!ARGS:/^comments-[0-9]+$/"
SecRuleUpdateTargetByTag "attack-injection-php" "!ARGS:/^comments-[0-9]+$/"
SecRuleUpdateTargetByTag "attack-protocol"      "!ARGS:/^comments-[0-9]+$/"
SecRuleUpdateTargetByTag "attack-lfi"           "!ARGS:/^comments-[0-9]+$/"
SecRuleUpdateTargetByTag "attack-rfi"           "!ARGS:/^comments-[0-9]+$/"
SecRuleUpdateTargetByTag "attack-sqli"          "!ARGS:/^test_[0-9]+[.]labnotes$/"
SecRuleUpdateTargetByTag "attack-rce"           "!ARGS:/^test_[0-9]+[.]labnotes$/"
SecRuleUpdateTargetByTag "attack-injection-php" "!ARGS:/^test_[0-9]+[.]labnotes$/"
SecRuleUpdateTargetByTag "attack-protocol"      "!ARGS:/^test_[0-9]+[.]labnotes$/"
SecRuleUpdateTargetByTag "attack-lfi"           "!ARGS:/^test_[0-9]+[.]labnotes$/"
SecRuleUpdateTargetByTag "attack-rfi"           "!ARGS:/^test_[0-9]+[.]labnotes$/"
SecRuleUpdateTargetByTag "attack-sqli"          "!ARGS:/^contact_[0-9]+[.]note$/"
SecRuleUpdateTargetByTag "attack-rce"           "!ARGS:/^contact_[0-9]+[.]note$/"
SecRuleUpdateTargetByTag "attack-injection-php" "!ARGS:/^contact_[0-9]+[.]note$/"
SecRuleUpdateTargetByTag "attack-protocol"      "!ARGS:/^contact_[0-9]+[.]note$/"
SecRuleUpdateTargetByTag "attack-lfi"           "!ARGS:/^contact_[0-9]+[.]note$/"
SecRuleUpdateTargetByTag "attack-rfi"           "!ARGS:/^contact_[0-9]+[.]note$/"
SecRuleUpdateTargetByTag "attack-sqli"          "!ARGS:/^waitingListBean[[][0-9]+[]][.]note$/"
SecRuleUpdateTargetByTag "attack-rce"           "!ARGS:/^waitingListBean[[][0-9]+[]][.]note$/"
SecRuleUpdateTargetByTag "attack-injection-php" "!ARGS:/^waitingListBean[[][0-9]+[]][.]note$/"
SecRuleUpdateTargetByTag "attack-protocol"      "!ARGS:/^waitingListBean[[][0-9]+[]][.]note$/"
SecRuleUpdateTargetByTag "attack-lfi"           "!ARGS:/^waitingListBean[[][0-9]+[]][.]note$/"
SecRuleUpdateTargetByTag "attack-rfi"           "!ARGS:/^waitingListBean[[][0-9]+[]][.]note$/"
