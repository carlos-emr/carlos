#
# CARLOS deviations from the OWASP CRS defaults.
#
# Included immediately after /etc/modsecurity/crs/crs-setup.conf and before
# the rule files, so these run before REQUEST-901-INITIALIZATION fills in the
# CRS defaults for anything left unset. Keeping them here rather than editing
# crs-setup.conf matters: that file is a conffile of the modsecurity-crs
# package, and a CRS upgrade would either revert the edits or hand the
# administrator a three-way merge on a security policy.
#
# Rule ids are in the 1-99,999 range reserved for local rules. 900,000-999,999
# belongs to the CRS and reusing an id there silently shadows a CRS rule.

# --- paranoia level and anomaly thresholds ----------------------------------
# Paranoia level 1 with the CRS default thresholds (inbound 5 / outbound 4).
#
# Those numbers are not arbitrary: a single CRITICAL-severity signature scores
# 5, so at threshold 5 one clean SQLi/XSS/RCE hit blocks. The commonly copied
# "10/5" pair lets a single-signature attack through — logged, not blocked —
# which is the failure mode nobody notices until the incident review.
#
# PL1 rather than PL2+: this is a twenty-year-old JSP application that posts
# clinical free text. Higher paranoia levels start matching prose. Raise it
# per site only after running the clinical workflows at the new level.
SecAction \
    "id:100100,\
    phase:1,\
    nolog,\
    pass,\
    t:none,\
    setvar:tx.blocking_paranoia_level=1,\
    setvar:tx.detection_paranoia_level=1,\
    setvar:tx.paranoia_level=1,\
    setvar:tx.executing_paranoia_level=1,\
    setvar:tx.inbound_anomaly_score_threshold=5,\
    setvar:tx.outbound_anomaly_score_threshold=4"

# --- HTTP methods -----------------------------------------------------------
# The CRS default is GET HEAD POST OPTIONS. CARLOS exposes REST and FHIR
# endpoints that legitimately use PUT, DELETE and PATCH, and rule 911100 would
# reject every one of them. TRACE and CONNECT stay out.
SecAction \
    "id:100110,\
    phase:1,\
    nolog,\
    pass,\
    t:none,\
    setvar:'tx.allowed_methods=GET HEAD POST OPTIONS PUT DELETE PATCH'"

# --- restricted extensions --------------------------------------------------
# Rule 920440 blocks requests for these extensions. Setting the variable
# REPLACES the CRS list, so the CRS entries that do not collide with the UI
# (.bak .sql .key .log and friends) are restated here — dropping them would
# silently make database dumps, key files and logs fetchable through the front
# door.
#
# What must NOT appear in this list: .jsp .js .css .html .htm .xml .json .png
# .gif .jpg .svg .woff .woff2 .ttf .map — the CARLOS UI serves all of them,
# and adding one takes the whole application down.
SecAction \
    "id:100120,\
    phase:1,\
    nolog,\
    pass,\
    t:none,\
    setvar:'tx.restricted_extensions=.jspf/ .jspx/ .java/ .class/ .jar/ .war/ .ear/ .conf/ .config/ .properties/ .ini/ .php/ .asp/ .aspx/ .asmx/ .exe/ .dll/ .so/ .sh/ .bash/ .bat/ .cmd/ .com/ .ps1/ .py/ .rb/ .pl/ .cgi/ .c/ .cpp/ .cs/ .vb/ .vbs/ .bak/ .backup/ .old/ .orig/ .save/ .swp/ .tmp/ .sql/ .db/ .dbf/ .mdb/ .rdb/ .key/ .pem/ .p12/ .pfx/ .crt/ .cer/ .csr/ .pass/ .pwd/ .htr/ .htw/ .ida/ .idc/ .idq/ .inc/ .log/ .sys/ .pdb/ .resx/ .licx/ .csproj/ .vbproj/ .vsdisco/ .webinfo/'"

# --- request content types --------------------------------------------------
# The CRS default list already covers what CARLOS posts
# (application/x-www-form-urlencoded, multipart/form-data, application/json,
# text/xml, application/xml, application/soap+xml). It is restated explicitly
# so a CRS default change cannot start rejecting a clinical form, with ONE
# addition, named and justified:
#   text/plain — navigator.sendBeacon() payloads, which the logout-broadcast
#                and session-heartbeat client code emit.
# Deliberately NOT added (a previous revision had them "just in case"):
#   application/octet-stream — the widest possible type: a request declaring
#                it gets no body parser at all, so every ARGS-based CRS rule
#                inspects nothing. No front-door CARLOS workflow posts it.
#   multipart/related — no front-door workflow posts it either; the SOAP
#                integrations use application/soap+xml.
SecAction \
    "id:100130,\
    phase:1,\
    nolog,\
    pass,\
    t:none,\
    setvar:'tx.allowed_request_content_type=|application/x-www-form-urlencoded| |multipart/form-data| |text/xml| |application/xml| |application/soap+xml| |application/json| |text/plain|'"

# --- what is deliberately NOT changed ---------------------------------------
# tx.crs_validate_utf8_encoding stays at the CRS default (off at PL1). The
#   application declares UTF-8 everywhere and the check is a known source of
#   false positives on accented patient names.
# tx.max_num_args / tx.arg_length / tx.max_file_size stay unset. CARLOS
#   e-forms legitimately post hundreds of fields and multi-megabyte scanned
#   documents; the real ceilings are SecRequestBodyLimit above,
#   client_max_body_size in nginx and maxPostSize in Tomcat, which are set
#   together and to the same number.
# The IP-reputation and DoS-protection rule groups stay off. They need a
#   shared collection store to be meaningful on more than one worker, and a
#   clinic's whole staff arrives from one NAT address — the false-positive
#   cost is a waiting room that cannot open the EMR.
