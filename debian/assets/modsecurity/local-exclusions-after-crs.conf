#
# OPERATOR-OWNED WAF exclusions that must run AFTER the CRS rules are loaded.
#
# This file is yours. The package ships it empty and never changes it, so your
# edits here are NEVER subject to a dpkg conffile merge prompt on upgrade.
#
# Use this file for directives that MODIFY an already-loaded rule and therefore
# must run after the CRS rule set exists:
#
#   SecRuleUpdateTargetById 942100 "!ARGS:fieldname"
#   SecRuleUpdateTargetByTag "attack-xss" "!ARGS:fieldname"
#
# Prefer the narrowest form: remove one TARGET (one argument) from one rule (or
# one tag group), never a whole rule id, and never a whole attack class. See the
# workflow in local-exclusions-before-crs.conf.
#
# Empty by default.
