# OPERATOR-OWNED WAF exclusions that must run BEFORE the CRS rules.
#
# This file is yours. The package ships it empty and never changes it, so your
# edits here are NEVER subject to a dpkg conffile merge prompt on upgrade
# (unlike REQUEST-900-EXCLUSION-RULES-BEFORE-CRS.conf, which is package-managed).
#
# Use this file for exclusions that act on the whole request before the CRS
# rules load, keyed on the request — SecRuleRemoveById/ByTag, or a phase-1
# SecRule on REQUEST_URI with a ctl:ruleRemove* action. Use id range 5000-5999
# to stay clear of the package's 1000-1999 range.
#
# Workflow when a clinical action is blocked (403/400):
#   1. sudo carlos-ctl waf tail 200      # while reproducing the block
#   2. copy the rule id, matched variable and path it prints
#   3. add the NARROWEST exclusion here (one route, one arg, one tag/rule):
#
#        SecRule REQUEST_URI "@beginsWith /carlos/<route>" \
#            "id:5000,phase:1,pass,nolog,chain"
#            SecRule REQUEST_METHOD "@streq POST" \
#                "t:none,ctl:ruleRemoveTargetByTag=attack-sqli;ARGS:<fieldname>"
#
#   4. sudo carlos-ctl waf reload        # config-tested; a typo won't take down the running rules
#   5. sudo carlos-ctl check             # confirm the SQLi probe is still blocked (403)
#
# `carlos-ctl waf detect-only` is the loud, TEMPORARY triage escape hatch only;
# never leave the engine in detect-only on a system holding patient data.
#
# Empty by default.
