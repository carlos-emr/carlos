#
# ModSecurity 3 policy for the CARLOS EMR front door, loaded by
# /etc/nginx/sites-available/carlos-emr.
#
# This file is deliberately SELF-CONTAINED rather than including
# /etc/nginx/modsecurity.conf from libnginx-mod-http-modsecurity. That file
# ships `SecRuleEngine DetectionOnly` and a 12.5 MB body limit; including it
# and then overriding those directives works only because ModSecurity happens
# to take the last occurrence, which is a fragile thing for a security control
# to depend on across package upgrades. Everything the recommended
# configuration sets is restated here, with the CARLOS-specific values
# explained where they differ.
#
# Load order below is the one the CRS expects and must not be rearranged:
#   engine settings -> crs-setup -> site overrides -> BEFORE-CRS exclusions
#   -> CRS rules -> AFTER-CRS exclusions

# --- rule engine ------------------------------------------------------------
# BLOCKING. The point of putting a WAF in front of a PHI application is to
# stop the request, not to describe it afterwards. `carlosctl waf detect-only`
# flips this to DetectionOnly for triage and prints a loud reminder; it is not
# a supported steady state.
SecRuleEngine On

SecRequestBodyAccess On

# Tell ModSecurity how to parse the two body types this application posts that
# are not form-encoded.
SecRule REQUEST_HEADERS:Content-Type "^(?:application(?:/soap\+|/)|text/)xml" \
     "id:200000,phase:1,t:none,t:lowercase,pass,nolog,ctl:requestBodyProcessor=XML"
SecRule REQUEST_HEADERS:Content-Type "^application/json" \
     "id:200001,phase:1,t:none,t:lowercase,pass,nolog,ctl:requestBodyProcessor=JSON"

# 50 MB, matching Tomcat's maxPostSize and nginx's client_max_body_size. The
# upstream default is 12.5 MB with Reject, which would 413 a legitimate
# scanned-document or lab-attachment upload at the edge before Tomcat ever
# saw it. Keep all three in step.
SecRequestBodyLimit 52428800
SecRequestBodyNoFilesLimit 262144
SecRequestBodyLimitAction Reject
SecRequestBodyJsonDepthLimit 512
SecArgumentsLimit 2000

SecRule &ARGS "@ge 2000" \
    "id:200007,phase:2,t:none,log,deny,status:400,severity:2,\
msg:'Failed to fully parse request body due to large argument count'"
SecRule REQBODY_ERROR "!@eq 0" \
    "id:200002,phase:2,t:none,log,deny,status:400,severity:2,\
msg:'Failed to parse request body.',logdata:'%{reqbody_error_msg}'"
SecRule MULTIPART_STRICT_ERROR "!@eq 0" \
    "id:200003,phase:2,t:none,log,deny,status:400,\
msg:'Multipart request body failed strict validation'"
SecRule MULTIPART_UNMATCHED_BOUNDARY "@eq 1" \
    "id:200004,phase:2,t:none,log,deny,\
msg:'Multipart parser detected a possible unmatched boundary.'"

SecPcreMatchLimit 5000
SecPcreMatchLimitRecursion 5000
SecRule TX:/^MSC_/ "!@streq 0" \
    "id:200005,phase:2,t:none,deny,\
msg:'ModSecurity internal error flagged: %{MATCHED_VAR_NAME}'"

# --- response bodies --------------------------------------------------------
# Response-body inspection is ON so the CRS outbound rules can catch a data
# leak or an error page carrying a stack trace. The MIME list is restricted to
# text types: buffering a 50 MB PDF download through the inspection buffer is
# pure latency, and the outbound rules have nothing to say about it.
SecResponseBodyAccess On
SecResponseBodyMimeType text/plain text/html text/xml application/json
SecResponseBodyLimit 1048576
SecResponseBodyLimitAction ProcessPartial

# --- filesystem -------------------------------------------------------------
# Temporary and persistent state. Both directories are created by the package
# owned by www-data (the nginx worker uid) with mode 0700: a request body
# spooled here can contain PHI, so nothing else on the host may read it.
SecTmpDir /var/lib/carlos-emr/modsecurity/tmp
SecDataDir /var/lib/carlos-emr/modsecurity/data
SecTmpSaveUploadedFiles Off
SecUploadDir /var/lib/carlos-emr/modsecurity/tmp
# Never keep an intercepted upload: it is by definition the payload of a
# request the WAF just rejected, and on this application it may be a patient
# document.
SecUploadKeepFiles Off
SecUploadFileMode 0600

# Shipped by libnginx-mod-http-modsecurity.
SecUnicodeMapFile /etc/nginx/unicode.mapping 20127

# --- audit log --------------------------------------------------------------
# RelevantOnly: record the transactions that matched a rule or returned an
# error, not every request.
SecAuditEngine RelevantOnly
SecAuditLogRelevantStatus "^(?:5|4(?!04))"
SecAuditLogParts ABFHKZ
SecAuditLogType Serial
SecAuditLog /var/log/carlos-emr/modsec/modsec_audit.log
SecAuditLogFormat JSON
# The audit log is created by the nginx MASTER process, as root, under its own
# umask — which yields a 0644 file. These directives ask libmodsecurity for a
# tighter mode; measured on ModSecurity 3.0.x with SecAuditLogType Serial they
# are NOT honoured (the file still appears 0644), so they are belt, not
# braces.
#
# What actually contains the file is its DIRECTORY: /var/log/carlos-emr/modsec
# is 0750 www-data:adm, so a user outside those groups cannot traverse into it
# whatever the file mode says — verified by reading it as `nobody`
# (Permission denied) and as a member of adm (allowed). A tmpfiles `z` rule
# also re-asserts 0640 root:adm on the file at every boot.
SecAuditLogFileMode 0640
SecAuditLogDirMode 0750
#
# WHY ABFHKZ AND NOT ABCEFHIJKZ — this is a compliance decision, not a
# preference. Parts C and E are the request and response bodies and parts I
# and J are the reduced body and uploaded-file metadata. On this application
# those are clinical free text, health-card numbers and patient documents, and
# they would be written to a log file on every CRS false positive and then
# rotated, archived and backed up. ABFHKZ keeps the request line, headers and
# the matched rule data, which is what triage actually needs.
#
# RESIDUAL RISK, stated plainly: part A/B still contain the request line and
# headers, and a query string on this OSCAR-lineage application can carry
# PHI-correlating identifiers (demographicNo, billing ids) and cookies. The
# audit log is therefore treated as PHI-adjacent: the directory is 0750
# www-data:adm and the log itself 0640 root-owned (see SecAuditLogFileMode
# above — read it with `carlosctl waf tail`, which runs as root), it is
# included in the encrypted restic backup, and logrotate keeps it for 30 days. A site with a stricter retention rule should
# change /etc/logrotate.d/carlos-emr, not the parts list.

SecDebugLog /var/log/carlos-emr/modsec/modsec_debug.log
SecDebugLogLevel 0

SecStatusEngine Off
# NOTE: there is no SecServerSignature here. That directive is ModSecurity v2
# (Apache) only — libmodsecurity3 rejects it outright and nginx then refuses to
# start with a rules-parse error. The Server header is nginx's to control and
# `server_tokens off` in the headers snippet already handles it.

# --- OWASP Core Rule Set ----------------------------------------------------
# crs-setup.conf is a conffile of the modsecurity-crs package and is included
# unmodified; crs-overrides.conf immediately after it carries every CARLOS
# deviation, so a CRS package upgrade never silently reverts them.
# `Include`, not `IncludeOptional`: the latter is ModSecurity v2 syntax and
# libmodsecurity3 fails to parse it, taking the front door down. Every file
# named here is a dpkg conffile of this package, so it is always present — if
# you delete one rather than emptying it, nginx will refuse to start until
# `apt install --reinstall carlos-emr` puts it back.
Include /etc/modsecurity/crs/crs-setup.conf
Include /etc/carlos-emr/modsecurity/crs-overrides.conf
Include /etc/carlos-emr/modsecurity/REQUEST-900-EXCLUSION-RULES-BEFORE-CRS.conf
Include /usr/share/modsecurity-crs/rules/*.conf
Include /etc/carlos-emr/modsecurity/RESPONSE-999-EXCLUSION-RULES-AFTER-CRS.conf
