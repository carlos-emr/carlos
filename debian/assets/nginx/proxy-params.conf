#
# Proxy parameters for the CARLOS Tomcat hop. Installed to
# /etc/carlos-emr/nginx/proxy-params.conf.
#
# X-Forwarded-Proto is load-bearing: Tomcat's RemoteIpValve reads it to decide
# that the request arrived over TLS, which is what makes the application issue
# https:// redirects and set the session cookie Secure. Remove it and login
# breaks in a way that looks like an application bug.

proxy_http_version 1.1;
proxy_set_header Host              $host;
proxy_set_header X-Real-IP         $remote_addr;
proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
proxy_set_header X-Forwarded-Proto $scheme;
# The user-facing port, not nginx's internal one: the application inspects
# this when building absolute URLs.
proxy_set_header X-Forwarded-Port  $server_port;
proxy_set_header X-Forwarded-Host  $host;
# Keepalive to the backend needs Connection cleared; without it nginx forwards
# the client's Connection header and Tomcat closes the socket per request.
proxy_set_header Connection        "";

# Long-running clinical reports and lab imports legitimately take minutes. The
# nginx default of 60s turns those into a 504 halfway through.
proxy_connect_timeout 15s;
proxy_send_timeout    300s;
proxy_read_timeout    300s;

# Let the application own its own redirects; rewriting Location here would
# fight with the X-Forwarded-* handling above.
proxy_redirect off;

# Drop the application's own copies of the security headers before nginx adds
# its own. The application sets several of them (it predates having a WAF in
# front of it) and without this the client receives TWO of each — which is not
# merely untidy: Referrer-Policy arrived twice with DIFFERENT values
# (same-origin from the application, no-referrer from here), and which one a
# browser honours is then a question about header ordering rather than about
# policy. One header, one source of truth, and that source is
# /etc/nginx/snippets/carlos-emr-headers.conf.
#
# Cache-Control and Pragma are included deliberately: the no-store policy on
# every front-door response is a PHI decision this deployment makes, and it
# must not be weakened by an application response that says otherwise.
proxy_hide_header X-Frame-Options;
proxy_hide_header X-Content-Type-Options;
proxy_hide_header Referrer-Policy;
proxy_hide_header Permissions-Policy;
proxy_hide_header Content-Security-Policy;
proxy_hide_header Content-Security-Policy-Report-Only;
proxy_hide_header Strict-Transport-Security;
proxy_hide_header Cache-Control;
proxy_hide_header Pragma;
