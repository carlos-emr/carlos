# Security response headers for the CARLOS front door.
#
# `always` on every header so they are emitted on 4xx/5xx as well — an error
# page is still a page a browser will render and cache.
#
# nginx's add_header does NOT inherit into a block that declares its own
# add_header. That is why the site file includes this snippet again inside the
# rate-limited login location: dropping it there would have silently served
# the login page — the one page that most needs them — without any of these.

# Two years, subdomains included. Deliberately NO `preload`: submitting to the
# browser preload list is a one-way commitment that also forces every current
# and future subdomain onto HTTPS. That is an operator decision about a domain
# they own, not a package default.
add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
add_header X-Content-Type-Options "nosniff" always;
# SAMEORIGIN, not DENY: the CARLOS UI frames its own encounter and e-chart
# panels, and DENY breaks them.
add_header X-Frame-Options "SAMEORIGIN" always;
add_header Referrer-Policy "no-referrer" always;

# CSP is split in two.
#
# 1. ENFORCING — only the directives that do not break the OSCAR-lineage UI.
#    frame-ancestors backs up X-Frame-Options, base-uri blocks <base> tag
#    hijacking, object-src kills plugin vectors. None of these fall back to
#    default-src, so scripts and styles are untouched.
add_header Content-Security-Policy "frame-ancestors 'self'; base-uri 'self'; object-src 'none'" always;
# 2. REPORT-ONLY — the script-src experiment. The UI is heavy with inline
#    script and eval, so enforcing default-src would break clinical pages
#    today. With no report-to endpoint, violations surface in the browser
#    console, which is enough to inventory them per site before tightening.
add_header Content-Security-Policy-Report-Only "default-src 'self' 'unsafe-inline' 'unsafe-eval' data: blob:; frame-ancestors 'self'; base-uri 'self'; object-src 'none'" always;

# An EMR front door has no business reaching sensors or payment APIs.
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;

# PHI must not linger in a browser or intermediary cache. no-store is applied
# to EVERY response on purpose: this application serves clinical data on
# unpredictable routes with no clean static/dynamic split, so a path-scoped
# rule would eventually miss a PHI page. The cost is that genuinely static
# assets are re-fetched.
add_header Cache-Control "no-store" always;
add_header Pragma "no-cache" always;

# Never advertise the nginx version to an unauthenticated visitor.
server_tokens off;
