## DrugRef2 configuration for the CARLOS EMR Debian package.
##
## Installed to /etc/carlos-emr/drugref2.properties, mode 0640 root:carlos, and
## symlinked into the `carlos` user's home so DrugRef's StartUp listener finds
## it at ${user.home}/drugref2.properties. It carries a database password, so
## it is not world-readable and is not a dpkg conffile — the package renders it
## once and never rewrites it.
##
## DrugRef connects as its own least-privilege `drugref` account with rights on
## the drugref2 database only. The upstream default of connecting as root is
## deliberately not used here: the two applications share one MariaDB instance
## on this host, and a drug-reference service must not hold a credential that
## can read the patient schema.
db_user=drugref
db_password=
## NO query parameters on this URL — that is load-bearing, not laziness.
## DrugRef's spring_config.xml builds the pool URL as "${db_url}?serverTimezone=UTC",
## so any ?param=... appended here produces a second '?' and the last parameter
## becomes garbage (connectionCollation=..."?serverTimezone=UTC"), the driver
## rejects it, HikariCP never connects, and the whole context fails to deploy
## with an unrelated-looking "Unable to determine Dialect" error. Verified live.
## Connector/J 9 negotiates utf8mb4 by default, so nothing is lost.
db_url=jdbc:mysql://127.0.0.1:3306/drugref2
db_driver=com.mysql.cj.jdbc.Driver

## Push APO/NOVO-style manufacturer-tagged generics below the plain names in
## search results, which is what prescribers expect to see first.
sort_down_mfg_tagged_generics=true

## Medi-Span interaction data requires a licence obtained through OSCAR EMR.
## Without it DrugRef still serves the Health Canada Drug Product Database that
## this package loads, but not commercial interaction monographs.
#licence_key=
#interaction_base_url=https://download.oscar-emr.com/ws/rs/accounts
#scheduled_timer=300000
