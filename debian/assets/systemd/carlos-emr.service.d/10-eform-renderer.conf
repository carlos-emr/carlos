#
# Shipped by carlos-emr-eform-renderer, NOT by carlos-emr. Installing the
# optional renderer package adds this relationship; removing it takes it away.
# carlos-emr.service itself stays free of anything renderer-specific.

[Unit]
# Wants, not Requires — the same reasoning the main unit applies to MariaDB. A
# broken render browser must never stop the EMR from serving; eForm print, fax
# and archive degrade and the startup probe says so.
Wants=carlos-emr-chromedriver.service
After=carlos-emr-chromedriver.service

[Service]
# Run the render browser WITH Chromium's own sandbox.
#
# This lives here rather than in carlos-emr.service because it is only true when
# the renderer package is installed: the flag is read by the JVM and decides
# whether --no-sandbox goes into the options it SENDS to chromedriver, but what
# makes the sandbox actually work is the browser unit this package also ships.
# Tying them together means the setting cannot outlive the thing that satisfies
# it — with the package removed, the drop-in goes too and the flag reverts.
#
# It fails CLOSED: a render errors rather than silently dropping to an
# unsandboxed browser. That is the right direction for a security control, and
# the reason the two halves ship as one package.
Environment=EFORM_RENDER_SANDBOX=true
