#
# java.util.logging configuration for the CARLOS Tomcat instance (JULI).
#
# Container-level logging only. The CARLOS application configures its own
# Log4j2 appenders; this file governs Catalina's startup, deployment and
# error output. Everything lands in /var/log/carlos-emr/tomcat, which is owned by
# carlos:adm mode 0750. Tomcat expires these itself at maxDays below; logrotate
# deliberately does not touch them (see /etc/logrotate.d/carlos-emr).
#
# PHI: these handlers record container events, not request content. Do not
# raise the level of the application packages here to capture request data —
# use the application's own logging so its PHI filters apply.

handlers = 1catalina.org.apache.juli.AsyncFileHandler, java.util.logging.ConsoleHandler

.handlers = 1catalina.org.apache.juli.AsyncFileHandler, java.util.logging.ConsoleHandler

1catalina.org.apache.juli.AsyncFileHandler.level = FINE
1catalina.org.apache.juli.AsyncFileHandler.directory = /var/log/carlos-emr/tomcat
1catalina.org.apache.juli.AsyncFileHandler.prefix = catalina.
1catalina.org.apache.juli.AsyncFileHandler.maxDays = 30
1catalina.org.apache.juli.AsyncFileHandler.encoding = UTF-8

# The console handler's output is what systemd captures into the journal, so
# `journalctl -u carlos-emr` shows the same container events without a second
# file to rotate.
java.util.logging.ConsoleHandler.level = FINE
java.util.logging.ConsoleHandler.formatter = org.apache.juli.OneLineFormatter
java.util.logging.ConsoleHandler.encoding = UTF-8

org.apache.catalina.core.ContainerBase.[Catalina].[localhost].level = INFO
org.apache.catalina.core.ContainerBase.[Catalina].[localhost].handlers = \
   1catalina.org.apache.juli.AsyncFileHandler

# Silence the two loggers that are pure noise on a package deployment.
org.apache.catalina.startup.DigesterFactory.level = SEVERE
org.apache.catalina.util.SessionIdGeneratorBase.level = SEVERE

# OpenTelemetry announces itself the first time anything in the WAR touches the
# API, which on this deployment is once per Tomcat start:
#
#   INFO io.opentelemetry.api.GlobalOpenTelemetry maybeAutoConfigureAndSetGlobal
#   AutoConfiguredOpenTelemetrySdk found on classpath but automatic configuration
#   is disabled. To enable, run your JVM with
#   -Dotel.java.global-autoconfigure.enabled=true
#
# The SDK arrives as a transitive Flyway dependency and this deployment exports
# no telemetry, so the line is advice about a configuration nobody here asked
# for. It reads as a fault in `carlos-ctl logs`, and the remedy it suggests would
# silence it by STARTING an exporter rather than by turning the notice off.
#
# The same line is suppressed for the migration runner, which is a separate JVM
# that never reads this file — see FlywayRunner.quietenOpenTelemetry().
io.opentelemetry.api.GlobalOpenTelemetry.level = WARNING
