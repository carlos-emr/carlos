[package]
name = "mycarlos-tauri-poc"
version = "0.1.0"
description = "A non-production Tauri evaluation for the proposed myCarlos app"
authors = ["CARLOS EMR contributors"]
edition = "2021"
license = "GPL-2.0-or-later"

[lib]
name = "mycarlos_tauri_poc_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
argon2 = { version = "0.5", features = ["zeroize"] }
atomicwrites = "0.4"
base64 = "0.22"
chacha20poly1305 = { version = "0.10", features = ["std"] }
hkdf = "0.12"
hmac = "0.12"
libc = "0.2"
rand = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
thiserror = "2"
uuid = { version = "1", features = ["v4", "serde"] }
zeroize = { version = "1", features = ["derive"] }

[dev-dependencies]
tempfile = "3"

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
