[package]
name = "myvitalhistory-tauri-poc"
version = "0.1.0"
description = "A non-production Tauri evaluation for the proposed MyVitalHistory app"
authors = ["CARLOS EMR contributors"]
edition = "2021"
license = "GPL-2.0-or-later"

[lib]
name = "myvitalhistory_tauri_poc_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
