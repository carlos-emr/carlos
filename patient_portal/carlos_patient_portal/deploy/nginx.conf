# Reference edge policy. Replace upstream/CIDRs and tune rate values from the deployment-host
# benchmark before pilot traffic. The log format intentionally contains no raw URI or query string.
log_format portal_safe
  '$request_id method=$request_method status=$status bytes=$body_bytes_sent '
  'duration=$request_time upstream_duration=$upstream_response_time';

limit_req_zone $binary_remote_addr zone=portal_login:10m rate=5r/m;
limit_req_zone $binary_remote_addr zone=portal_reset:10m rate=3r/m;
limit_req_zone $binary_remote_addr zone=portal_activation:10m rate=3r/m;
limit_req_zone $binary_remote_addr zone=portal_mfa:10m rate=10r/m;

upstream carlos_patient_portal {
  server 127.0.0.1:8090;
  keepalive 16;
}

server {
  listen 443 ssl;
  server_name portal.example.invalid;
  access_log /var/log/nginx/patient-portal-access.log portal_safe;

  proxy_set_header Host $host;
  proxy_set_header X-Request-ID $request_id;
  proxy_set_header X-Real-IP $remote_addr;
  proxy_set_header X-Forwarded-Proto $scheme;
  # Patient-facing locations inherit these empty values. The CARLOS-only location below
  # deliberately overrides them after its source-address check.
  proxy_set_header X-CARLOS-Provider-ID "";
  proxy_set_header X-CARLOS-Provider-Name "";
  proxy_set_header X-CARLOS-Clinic-ID "";
  proxy_set_header X-CARLOS-Permissions "";
  proxy_http_version 1.1;
  proxy_set_header Connection "";
  limit_req_status 429;

  location = /auth/login {
    limit_req zone=portal_login burst=2 nodelay;
    proxy_pass http://carlos_patient_portal;
  }
  location = /auth/password-reset/request {
    limit_req zone=portal_reset burst=1 nodelay;
    proxy_pass http://carlos_patient_portal;
  }
  location = /auth/activate {
    limit_req zone=portal_activation burst=1 nodelay;
    proxy_pass http://carlos_patient_portal;
  }
  location ~ ^/auth/mfa/(verify|resend)$ {
    limit_req zone=portal_mfa burst=3 nodelay;
    proxy_pass http://carlos_patient_portal;
  }

  # Every /internal/** endpoint is infrastructure-only, so the source-address restriction belongs on
  # the whole prefix rather than on /internal/carlos/ alone. Without this block the probe and
  # telemetry endpoints (/internal/health/db, /internal/readiness, /internal/metrics) fell through to
  # `location /` and were served straight from the public internet, which contradicts the README's
  # instruction to expose them only to trusted infrastructure. /internal/carlos/ still matches its
  # own longer prefix below and keeps its own ACL.
  location ^~ /internal/ {
    allow 127.0.0.1/32;
    deny all;
    proxy_pass http://carlos_patient_portal;
  }

  # Secure default for a same-host CARLOS deployment. Replace this exact address with the
  # deployment's exact CARLOS workload CIDRs when the application runs on another host; never
  # widen it to an entire RFC1918 range.
  location ^~ /internal/carlos/ {
    allow 127.0.0.1/32;
    deny all;
    # Defining any proxy_set_header here disables inheritance of the server-level set.
    proxy_set_header Host $host;
    proxy_set_header X-Request-ID $request_id;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Connection "";
    proxy_set_header X-CARLOS-Provider-ID $http_x_carlos_provider_id;
    proxy_set_header X-CARLOS-Provider-Name $http_x_carlos_provider_name;
    proxy_set_header X-CARLOS-Clinic-ID $http_x_carlos_clinic_id;
    proxy_set_header X-CARLOS-Permissions $http_x_carlos_permissions;
    proxy_pass http://carlos_patient_portal;
  }

  # Example deployment-specific subpath for
  # PATIENT_PORTAL_PUBLIC_BASE_URL=https://portal.example.invalid/patient. The trailing slash on
  # proxy_pass strips /patient before forwarding, while FastAPI root_path adds it to generated
  # URLs. Rename both occurrences when choosing another deployment prefix.
  location = /patient {
    return 308 /patient/;
  }
  location = /patient/auth/login {
    limit_req zone=portal_login burst=2 nodelay;
    proxy_pass http://carlos_patient_portal/auth/login;
  }
  location = /patient/auth/password-reset/request {
    limit_req zone=portal_reset burst=1 nodelay;
    proxy_pass http://carlos_patient_portal/auth/password-reset/request;
  }
  location = /patient/auth/activate {
    limit_req zone=portal_activation burst=1 nodelay;
    proxy_pass http://carlos_patient_portal/auth/activate;
  }
  location ^~ /patient/auth/mfa/ {
    limit_req zone=portal_mfa burst=3 nodelay;
    rewrite ^/patient(/.*)$ $1 break;
    proxy_pass http://carlos_patient_portal;
  }
  # The deployment prefix is for patient-facing routes only, and it must be blocked from reaching the
  # internal API. nginx matches prefixes against the start of the URI, so /patient/internal/carlos/...
  # never matched `^~ /internal/carlos/` and its `deny all` therefore did not apply; the trailing
  # slash on the /patient/ proxy_pass below then stripped the prefix, so the application received
  # /internal/carlos/... with no source-address restriction at all. Returning 404 here rather than
  # applying the ACL keeps one canonical path to the internal API instead of two that must be kept in
  # step. CARLOS calls the portal on its own /internal/carlos/ prefix.
  location ^~ /patient/internal/ {
    return 404;
  }

  location ^~ /patient/ {
    proxy_pass http://carlos_patient_portal/;
  }

  location / {
    proxy_pass http://carlos_patient_portal;
  }
}
