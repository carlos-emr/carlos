# Reference edge policy. Replace upstream/CIDRs and tune rate values from the deployment-host
# benchmark before pilot traffic. The log format intentionally contains no raw URI or query string.
log_format portal_safe
  '$request_id method=$request_method status=$status bytes=$body_bytes_sent '
  'duration=$request_time upstream_duration=$upstream_response_time';

limit_req_zone $binary_remote_addr zone=portal_login:10m rate=5r/m;
limit_req_zone $binary_remote_addr zone=portal_reset:10m rate=3r/m;
limit_req_zone $binary_remote_addr zone=portal_activation:10m rate=3r/m;
limit_req_zone $binary_remote_addr zone=portal_mfa:10m rate=10r/m;

upstream carlos_patient_portal {
  server 127.0.0.1:8090;
  keepalive 16;
}

server {
  listen 443 ssl;
  server_name portal.example.invalid;
  access_log /var/log/nginx/patient-portal-access.log portal_safe;

  proxy_set_header Host $host;
  proxy_set_header X-Request-ID $request_id;
  proxy_set_header X-Real-IP $remote_addr;

  location = /auth/login {
    limit_req zone=portal_login burst=2 nodelay;
    proxy_pass http://carlos_patient_portal;
  }
  location = /auth/password-reset/request {
    limit_req zone=portal_reset burst=1 nodelay;
    proxy_pass http://carlos_patient_portal;
  }
  location = /auth/activate {
    limit_req zone=portal_activation burst=1 nodelay;
    proxy_pass http://carlos_patient_portal;
  }
  location ~ ^/auth/mfa/(verify|resend)$ {
    limit_req zone=portal_mfa burst=3 nodelay;
    proxy_pass http://carlos_patient_portal;
  }

  # Only CARLOS application networks may supply staff identity headers.
  location ^~ /internal/carlos/ {
    allow 10.0.0.0/8;
    deny all;
    proxy_set_header X-CARLOS-Provider-ID $http_x_carlos_provider_id;
    proxy_set_header X-CARLOS-Provider-Name $http_x_carlos_provider_name;
    proxy_set_header X-CARLOS-Clinic-ID $http_x_carlos_clinic_id;
    proxy_set_header X-CARLOS-Permissions $http_x_carlos_permissions;
    proxy_pass http://carlos_patient_portal;
  }

  location / {
    # Strip any patient-supplied attempt to forge the deployment-owned CARLOS trust headers.
    proxy_set_header X-CARLOS-Provider-ID "";
    proxy_set_header X-CARLOS-Provider-Name "";
    proxy_set_header X-CARLOS-Clinic-ID "";
    proxy_set_header X-CARLOS-Permissions "";
    proxy_pass http://carlos_patient_portal;
  }
}

