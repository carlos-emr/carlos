[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "carlos-patient-portal"
version = "0.1.0"
description = "Patient credential portal foundation for CARLOS EMR"
requires-python = ">=3.11"
dependencies = [
  "alembic>=1.14,<2",
  "fastapi>=0.115,<1",
  "jinja2>=3.1,<4",
  "psycopg[binary]>=3.2,<4",
  "pydantic-settings>=2.6,<3",
  "sqlalchemy>=2.0,<3",
  "uvicorn[standard]>=0.32,<1",
]

[project.scripts]
carlos-patient-portal-migrate = "carlos_patient_portal.cli:migrate"

[project.optional-dependencies]
dev = [
  "httpx>=0.27,<1",
  "pip-tools>=7,<8",
  "pytest>=8,<9",
  "ruff>=0.8,<1",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["carlos_patient_portal*"]

[tool.setuptools.package-data]
carlos_patient_portal = [
  "static/*.css",
  "static/*.svg",
  "templates/*.html",
  "migrations/README",
  "migrations/script.py.mako",
  "migrations/versions/*.py",
  "migrations/versions/.gitkeep",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
