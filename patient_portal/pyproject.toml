[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "carlos-patient-portal"
version = "0.1.0"
description = "Patient credential portal foundation for CARLOS EMR"
requires-python = ">=3.11"
dependencies = [
  "alembic>=1.14,<2",
  "argon2-cffi>=25.1,<26",
  "cryptography>=48.0.1,<49",
  "fastapi>=0.115,<1",
  "fhir.resources==5.1.1",
  "hl7apy>=1.3.5,<2",
  "jinja2>=3.1,<4",
  "psycopg[binary]>=3.2,<4",
  "pydantic-settings>=2.6,<3",
  # CFFI accepts 2.x; keep this parser dependency on a reviewed major version.
  "pycparser>=2.23,<3",
  "sqlalchemy>=2.0,<3",
  "uvicorn[standard]>=0.32,<1",
]

[project.scripts]
carlos-patient-portal-migrate = "carlos_patient_portal.cli:migrate"
carlos-patient-portal-maintenance = "carlos_patient_portal.cli:maintenance"

[project.optional-dependencies]
dev = [
  "httpx>=0.27,<1",
  "pip-tools>=7,<8",
  "pytest>=9.0.3,<10",
  "pytest-cov>=7,<8",
  "ruff>=0.8,<1",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["carlos_patient_portal*"]

[tool.setuptools.package-data]
carlos_patient_portal = [
  "static/*.css",
  "static/*.js",
  "static/*.png",
  "static/*.svg",
  "templates/*.jinja",
  "wordlists/*.txt",
  "interop_profiles/*.json",
  "migrations/README",
  "migrations/script.py.mako",
  "migrations/versions/*.py",
  "migrations/versions/.gitkeep",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.coverage.run]
relative_files = true

[tool.coverage.report]
fail_under = 85
show_missing = true

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
