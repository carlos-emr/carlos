# Build identity of this CARLOS EMR artifact.
#
# Written at build time and read by io.github.carlos_emr.carlos.utility.BuildInfo.
# This file is deliberately separate from carlos.properties: carlos.properties is
# deployment CONFIGURATION and is loaded again from an operator override file
# (e.g. /etc/carlos-emr/carlos.properties) on top of the in-WAR copy. Build
# identity carried in that file was frozen at first install and never followed
# a WAR upgrade. Nothing here is meant to be overridden by an operator.
#
# build.version is the Maven project version, substituted by resource filtering.
# build.date, build.job and build.number are substituted by the maven-antrun-plugin
# step in pom.xml from the build timestamp and the JOB_NAME / BUILD_NUMBER
# environment variables; the job/number pair defaults to empty when they are unset.
# (The placeholder tokens are intentionally not written in this comment: resource
# filtering would rewrite them here too, mangling the shipped file's documentation.)
build.version=${project.version}
build.date=${build.dateTime}
build.job=${build.JOB_NAME}
build.number=${build.BUILD_NUMBER}
