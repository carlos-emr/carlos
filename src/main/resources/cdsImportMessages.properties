title=Demographic CDS Import
intro=Import OntarioMD CDS patient data using durable jobs. Uploaded, accepted, clinically complete and reports delivered are separate states.
disabled=New import admission is disabled. Existing run status, reports and reconciliation remain available to authorized users.
sourcesMissing=No approved source/profile choices are configured. Ask the import administrator to register the source before submission.
javascript=JavaScript is required for bounded uploads and durable job controls.
sourceOptions=Source and import options
files=XML or ZIP files
filesHelp=Select up to 128 XML/ZIP files per browser selection. Each file receives its own durable run. Use a ZIP preserving relative folders for XML with attachments or very large patient batches. Closing the browser after acceptance does not stop a run; bytes not yet uploaded still require transfer.
profile=Approved source and specification profile
selectSource=Select an approved source/profile
provider=Importing provider number
program=Program ID (authorized scope)
facility=Facility ID (authorized scope)
providerMatching=Match provider names where source identifiers are absent
merge=Merge clinical data into one eligible HIN + exact DOB match (off by default)
dryRun=Dry run: validate and plan without clinical writes
synthetic=Authorized synthetic learning/course copies
course=Course ID from program management
timeshift=Synthetic date shift in days
window=Clinical writes require the approved migration window and admission policy. Review and resolve preflight findings before declaring a migration complete.
start=Upload and submit import
uploads=Owned uploads and transfer recovery
refreshUploads=Refresh uploads / first page
nextPage=Next page
file=Source file
state=Durable state
bytes=Received / expected bytes
actions=Actions
resumeUpload=Upload ID to resume (reselect the same file; the received prefix will be verified)
submitCompleted=Submit or recover acceptance of this completed upload
runs=Durable import runs
openRun=Open / reconnect
cancel=Request cancellation
resumeRun=Resume / reconcile known work
eventLog=Download Import Event Log
errorLog=Download Import Error Log
receipt=Download completeness receipt
patients=Patient outcomes (one bounded page)
sourcePatient=Source patient / target copy
held=Import hold
units=Expected units
diagnostics=Errors, warnings and review items (one bounded page)
code=Code / stage
detail=Explanation
review=Clinical review
pagesHelp=Tables show bounded pages. Use the complete protected reports and exact occurrence receipt to confirm whole-run completeness. A heartbeat or 100% transfer is not clinical success.
reviewHelp=This submits a versioned correction or explicit patient decline for backend revalidation. It does not acknowledge away a clinical blocker or permit blind replay. Drafts that fail full XML validation remain inactive; add the remaining required corrections and revalidate before resuming.
reviewXPathHelp=Use the exact indexed scalar-field XPath from the protected source report, for example /OmdCds[1]/PatientRecord[1]/Demographics[1]/DateOfBirth[1]. The server verifies that the field exists. Enter the original source value before any synthetic date shift. Corrections apply to every authorized copy of that source patient; a decline applies only to the identified copy. Original source bytes remain preserved.
reviewKind=Review decision
correctValue=Correct a source value through a preserved overlay
declinePatient=Decline this patient without erasing committed data
approveUnwrittenRevision=Approve a replacement attempt with no committed data
revisionHelp=Upload and submit a corrected file normally using the same registered source identity and intended options. If the new run reports a source revision conflict, explicit replacement approval is available only after the server proves both attempts have no committed data, holds or uncertainty. Approval requires a reason and versioned review; it never replaces existing clinical data or accepts a server path. Reconcile prior committed work rather than changing the source namespace.
replacement=Replacement value
reason=Clinical reason
submitReview=Submit for revalidation
sourceFieldsTitle=CDS source fields
sourceFieldsLink=CDS source fields
sourceFieldsHelp=Each logical source field remains separately available in its clinical category. Precision and source values are preserved; display previews do not replace the original value. Native clinical records remain available in their usual modules.
sourceFieldsEmpty=No preserved source fields appear on this page.
sourceNamespace=Source namespace
sourceValueType=Value type
sourcePrecision=Source date precision
sourceOccurrence=Source occurrence
sourceExternalValue=Original value is available as a protected download. Size:
sourceOriginalValue=Original logical value
sourceNormalizedValue=Effective normalized value
sourcePreviewTruncated=Display preview is shortened. Download the original value for the complete field.
sourceDownload=Download complete original value
sourceFirstPage=First page
sourceReviews=Source review history
sourceReviewsHelp=Request state and version identify each reviewed source change. A ready request is not proof that clinical revalidation or import completed.
sourceReviewsEmpty=No source review requests appear on this page.
sourceReviewOperator=Operator
sourceReviewTime=Review timestamp
sourceReviewVersion=Request version
sourceReviewNextPage=Next review page
