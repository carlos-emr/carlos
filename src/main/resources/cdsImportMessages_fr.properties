code=Code / \u00e9tape
detail=Explication
failureEvidence=Preuve technique de l\u2019\u00e9chec
failureEvidenceHelp=Les types d\u2019exception, les codes SQL et les emplacements du code v\u00e9rifi\u00e9s aident au diagnostic. Les valeurs source, messages d\u2019exception, instructions SQL, noms de fichiers et chemins priv\u00e9s sont exclus. Les rapports de diagnostic et d\u2019exhaustivit\u00e9 restent la r\u00e9f\u00e9rence des r\u00e9sultats cliniques.
review=R\u00e9vision clinique
pagesHelp=Les tableaux affichent des pages limit\u00e9es. Consulter les rapports prot\u00e9g\u00e9s complets et la preuve par occurrence pour confirmer l'exhaustivit\u00e9. Un signal de vie ou un transfert \u00e0 100 % n'est pas un succ\u00e8s clinique.
reviewHelp=Soumettre une correction versionn\u00e9e ou un refus explicite pour revalidation. Cette commande ne supprime pas un blocage clinique et ne permet pas une r\u00e9ex\u00e9cution aveugle. Les corrections provisoires restent inactives si la validation XML compl\u00e8te \u00e9choue; ajouter les corrections requises et revalider avant de reprendre.
reviewXPathHelp=Utiliser le XPath index\u00e9 exact d\u2019un champ scalaire du rapport prot\u00e9g\u00e9, par exemple /OmdCds[1]/PatientRecord[1]/Demographics[1]/DateOfBirth[1]. Le serveur v\u00e9rifie le champ. Saisir la valeur source avant tout d\u00e9calage de date synth\u00e9tique. Une correction s\u2019applique \u00e0 toutes les copies autoris\u00e9es du patient source; un refus vise uniquement la copie identifi\u00e9e. Les octets source originaux restent conserv\u00e9s.
reviewKind=D\u00e9cision de r\u00e9vision
correctValue=Corriger une valeur par une modification conserv\u00e9e
declinePatient=Refuser le patient sans effacer les donn\u00e9es valid\u00e9es
approveUnwrittenRevision=Approuver une tentative de remplacement sans donn\u00e9es valid\u00e9es
revisionHelp=T\u00e9l\u00e9verser et soumettre normalement le fichier corrig\u00e9 avec la m\u00eame identit\u00e9 source enregistr\u00e9e et les options voulues. Si la nouvelle t\u00e2che signale un conflit de r\u00e9vision source, l\u2019approbation exige la preuve que les deux tentatives n\u2019ont aucune donn\u00e9e valid\u00e9e, aucun blocage ni aucune incertitude. Un motif et une r\u00e9vision versionn\u00e9e sont requis. Cette commande ne remplace jamais des donn\u00e9es cliniques et n\u2019accepte aucun chemin serveur. R\u00e9concilier les donn\u00e9es ant\u00e9rieures plut\u00f4t que changer l\u2019espace de noms.
replacement=Valeur de remplacement
