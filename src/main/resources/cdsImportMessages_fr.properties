sourceFieldsHelp=Chaque champ logique reste accessible séparément dans sa catégorie clinique. La précision et les valeurs source sont conservées; les aperçus ne remplacent pas la valeur originale. Les dossiers cliniques restent accessibles dans leurs modules habituels.
