provider=Num\u00e9ro du fournisseur responsable de l'importation
program=ID du programme autoris\u00e9
facility=ID de l'\u00e9tablissement autoris\u00e9
providerMatching=Associer les noms des fournisseurs lorsque les identifiants sont absents
merge=Fusionner les donn\u00e9es cliniques dans un dossier admissible selon le num\u00e9ro de sant\u00e9 et la date de naissance exacte (d\u00e9sactiv\u00e9 par d\u00e9faut)
dryRun=Simulation : valider et planifier sans \u00e9criture clinique
