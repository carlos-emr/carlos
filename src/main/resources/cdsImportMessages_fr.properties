sourceFieldsHelp=Chaque champ logique reste accessible s\u00e9par\u00e9ment dans sa cat\u00e9gorie clinique. La pr\u00e9cision et les valeurs source sont conserv\u00e9es; les aper\u00e7us ne remplacent pas la valeur originale. Les dossiers cliniques restent accessibles dans leurs modules habituels.
