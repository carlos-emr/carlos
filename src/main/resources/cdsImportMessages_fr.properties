course=ID du cours dans la gestion des programmes
timeshift=D\u00e9calage synth\u00e9tique des dates en jours
window=Les \u00e9critures cliniques exigent la fen\u00eatre de migration et la politique d'admission approuv\u00e9es. R\u00e9soudre les anomalies avant de d\u00e9clarer la migration compl\u00e8te.
