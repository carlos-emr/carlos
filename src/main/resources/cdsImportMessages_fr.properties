title=Importation des donn\u00e9es CDS des patients
intro=Importer les donn\u00e9es CDS OntarioMD au moyen de t\u00e2ches durables. Le transfert, l'acceptation, l'importation clinique compl\u00e8te et la livraison des rapports sont des \u00e9tats distincts.
disabled=L'admission de nouvelles importations est d\u00e9sactiv\u00e9e. Le suivi, les rapports et la r\u00e9conciliation restent accessibles aux utilisateurs autoris\u00e9s.
sourcesMissing=Aucune source ni aucun profil approuv\u00e9 n'est configur\u00e9. Demandez \u00e0 l'administrateur d'enregistrer la source.
javascript=JavaScript est n\u00e9cessaire pour les transferts limit\u00e9s et les commandes de t\u00e2ches durables.
sourceOptions=Source et options d'importation
files=Fichiers XML ou ZIP
filesHelp=S\u00e9lectionner au plus 128 fichiers XML/ZIP. Chaque fichier re\u00e7oit une t\u00e2che durable distincte. Utiliser un ZIP conservant les dossiers relatifs pour les pi\u00e8ces jointes et les grands lots. Fermer le navigateur apr\u00e8s l'acceptation n'arr\u00eate pas la t\u00e2che; les octets non transf\u00e9r\u00e9s doivent encore \u00eatre envoy\u00e9s.
profile=Source approuv\u00e9e et profil de sp\u00e9cification
