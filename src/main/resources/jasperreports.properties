#
# CARLOS report font policy (issue #5046). JasperReports reads this file from the
# classpath before any report is compiled or filled.
#
# A text element that names no font used Jasper's built-in default, the Java logical
# font "SansSerif". That resolves to whatever face the host's fontconfig picks, and
# Jasper measures text with that face's line height. When the host face is taller than
# a field box (Noto Sans, WenQuanYi Zen Hei, Thai faces), Jasper fits zero lines and
# the field is silently left out of a PDF that otherwise looks complete. The same
# default exported as non-embedded Helvetica/Cp1252, which drops every character
# outside Western European Latin (for example the Vietnamese "e" with circumflex and
# tilde, U+1EC5), as well as Greek and Cyrillic.
#
# The bundled DejaVu Sans extension (jasperreports-fonts) has fixed metrics on every
# host and is embedded as Identity-H. fonts/carlos-jasper-fonts.xml maps the Java
# logical names to bundled faces as well, so templates that name SansSerif, Serif or
# Monospaced (including site-customised label templates) get the same guarantee.
# See docs/pdf-font-policy.md.
net.sf.jasperreports.default.font.name=DejaVu Sans

# Fail instead of substituting a host font when a template names a face that neither
# the bundled extensions nor the JVM provide. This is Jasper's default; it is pinned
# here because turning it off would reintroduce silent, host-dependent output.
net.sf.jasperreports.awt.ignore.missing.font=false
