#
# Registers the CARLOS JasperReports font families (fonts/carlos-jasper-fonts.xml).
# Jasper loads every jasperreports_extension.properties on the classpath, so this sits
# beside the DejaVu families that the jasperreports-fonts jar registers with the same
# factory key. See jasperreports.properties and docs/pdf-font-policy.md (issue #5046).
net.sf.jasperreports.extension.registry.factory.simple.font.families=net.sf.jasperreports.engine.fonts.SimpleFontExtensionsRegistryFactory
net.sf.jasperreports.extension.simple.font.families.carlos=fonts/carlos-jasper-fonts.xml
