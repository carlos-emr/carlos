<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Simple Calculator</title>
</head>
<body>
    <!--
      Preserve legacy bookmarks without maintaining a second calculator implementation.
      Retired with the two risk-calculator copies beside it (issue #3665), whose
      drifted static code still carried the unguarded age ladder fixed in the
      maintained pages; this one is kept as a redirect for the same reason.
    -->
    <p><a id="calculatorLink" href="ViewSimpleCalculator">Open Simple Calculator</a></p>
    <script>
        var link = document.getElementById('calculatorLink');
        link.href = 'ViewSimpleCalculator' + window.location.search + window.location.hash;
        window.location.replace(link.href);
    </script>
</body>
</html>
