# Test-only fixture for StartupUnitTest issue #2969 review follow-up (WEB-INF key-overwrite guard).
# Loaded via getResourceAsStream("/WEB-INF/carlosmergekey.properties") when Startup falls back to the
# WEB-INF config. Unlike carlosmerge.properties, this fixture ALSO defines encryption.util.secret.key
# as a placeholder/default. The merge must load the DB config from here while preserving the real key
# that already lives in the user-home stub, never letting this placeholder overwrite it. The value is
# a valid (all-zero) AES-256 key so a regression surfaces as a wrong-key assertion, not a decode crash.
# Unique context name ("carlosmergekey") so it cannot affect other Startup tests. Synthetic only.
db_username=carlos_test_user
db_name=carlos_test_db
encryption.util.secret.key=AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
